    gfi2.value = '';
    if(f) applyGeoFile(f);
  };
  var imp = root.querySelector('#importFile');
  if(imp) imp.onchange = function(){
    var f = imp.files && imp.files[0]; if(!f) return;
    imp.value='';
    if(!ensureEditor())return;
    aiFolderStop('상황 JSON 불러오기를 시작해 폴더 연결을 해제했습니다.');
    var opSeq=stateLifecycleSeq,opEpoch=SESSION_EPOCH,fileSeq=++fileMutationSeq;
    if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq))return;
    if(f.size>MAX_IMPORT_BYTES){alert('가져오기 파일이 '+Math.round(MAX_IMPORT_BYTES/1048576)+'MB 한도를 초과합니다. 원본을 별도 보관하고 지도를 축소하세요.');return;}
    var fr = new FileReader();
    fr.onerror=function(){if(lifecycleCurrent(opSeq,opEpoch)&&fileMutationCurrent(fileSeq))alert('파일을 읽지 못했습니다. 기존 데이터는 변경되지 않았습니다.');};
    fr.onload = function(){
      if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq)||!ownsEditorLock())return;
      try{
        var o = JSON.parse(fr.result);
        validateImportPackage(o);
        if(!confirm('현재 상황을 이 파일로 교체할까요? 작업 전 복구본을 먼저 만듭니다.'))return;
        if(!saveRecoveryPoint('JSON 가져오기 전'))throw new Error('복구본을 만들 수 없어 가져오기를 중단했습니다.');
        applyStateWithMap(o,o.map||null,opSeq,opEpoch,fileSeq).then(function(ok){
          if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq))return;
          alert(ok ? '검증 후 안전하게 불러왔습니다.'
            : '가져오기 실패: 저장공간 부족 또는 저장 충돌로 적용하지 못했습니다.\n기존 데이터는 유지됩니다.');
        });
      }catch(e){ alert('가져오기 실패: '+(e&&e.message?e.message:'JSON 형식 또는 구조를 확인하세요.')+'\n기존 데이터는 유지됩니다.'); }
    };
    fr.readAsText(f);
  };
  if(!ownsEditorLock()){
    root.querySelectorAll('input,textarea,select,button').forEach(function(el){
      var act=el.getAttribute('data-act');
      var safe=act==='takecontrol'||act==='export'||act==='report'||act==='nav'||act==='verdictnav'||act==='eventpage'
        ||['eventSearch','eventTypeFilter','eventStatusFilter'].indexOf(el.id)>=0
        ||el.hasAttribute('data-map-layer')||(el.hasAttribute('data-map-action')&&el.dataset.mapAction!=='paint')
        ||el.hasAttribute('data-priority-toggle')
        ||el.id==='btnOpenDisplay'||el.id==='btnCloseDrawer'||el.id==='btnMoreNav';
      if(!safe)el.disabled=true;
    });
  }
}

/* --------------------------------------------------------------------------
   클립보드 붙여넣기 (문서 전역 - 어디에 포커스가 있어도 받는다)
   -------------------------------------------------------------------------- */
document.addEventListener('paste', function(ev){
  var dt = ev.clipboardData;
  var items = dt && dt.items;
  var f = null;

  if(items){
    for(var i=0;i<items.length;i++){
      if(items[i].type && items[i].type.indexOf('image') === 0){
        f = items[i].getAsFile();
        break;
      }
    }
  }
  /* 일부 환경은 items 대신 files 로만 넘어온다 */
  if(!f && dt && dt.files && dt.files.length){
    for(var j=0;j<dt.files.length;j++){
      if(/^image\//.test(dt.files[j].type)){ f = dt.files[j]; break; }
    }
  }

  if(f){ ev.preventDefault(); fileToMap(f); return; }

  /* 붙여넣기 영역에 대고 눌렀는데 이미지가 없으면 이유를 알려준다.
     (입력칸에 텍스트를 붙여넣는 정상 동작은 건드리지 않는다) */
  var onZone = ev.target && ev.target.closest && ev.target.closest('.paste-zone');
  if(onZone){
    ev.preventDefault();
    mapMsg('클립보드에 이미지가 없습니다. '
      + (IS_MAC ? '⌘⇧4 는 바탕화면에 파일로 저장됩니다 — ⌘+Control+Shift+4 로 캡처하거나 아래 「이미지 파일 선택」을 쓰세요.'
                : 'Win+Shift+S 로 캡처한 뒤 다시 붙여넣거나 아래 「이미지 파일 선택」을 쓰세요.'), 'warn');
  }
});

/* --------------------------------------------------------------------------
   드래그앤드롭 (문서 전역)
   좁은 영역만 받으면 살짝 빗나간 순간 브라우저가 그 이미지 파일로 이동해
   상황판이 날아간다. 창 전체에서 받고, 그 외의 드롭은 막는다.
   -------------------------------------------------------------------------- */
document.addEventListener('dragover', function(ev){
  ev.preventDefault();
  var pz = document.getElementById('pasteZone');
  if(pz) pz.classList.add('hot');
});
document.addEventListener('dragleave', function(ev){
  if(ev.relatedTarget) return;
  var pz = document.getElementById('pasteZone');
  if(pz) pz.classList.remove('hot');
});
document.addEventListener('drop', function(ev){
  ev.preventDefault();
  var pz = document.getElementById('pasteZone');
  if(pz) pz.classList.remove('hot');
  var files = ev.dataTransfer && ev.dataTransfer.files;
  if(!files || !files.length){ mapMsg('끌어다 놓은 항목에서 파일을 찾지 못했습니다.', 'warn'); return; }
  if(files.length===1&&/\.json$/i.test(files[0].name)){aiReadFile(files[0]);return;}
  var f = null, gf = null;
  for(var i=0;i<files.length;i++){
    if(!f && /^image\//.test(files[i].type)) f = files[i];
    else if(!gf && isGeoFileName(files[i].name)) gf = files[i];
  }
  /* 정사영상은 보통 이미지와 좌표 파일이 한 쌍이다. 같이 놓으면 같이 적용한다. */
  if(f) fileToMap(f, gf);
  else if(gf) applyGeoFile(gf);
  else mapMsg('이미지 또는 좌표 파일(.jgw/.tfw/.kml)이 아닙니다 ('
    + (files[0].type || files[0].name) + ').', 'warn');
});

/* --------------------------------------------------------------------------
   좌표 파일 읽기
   world file(.jgw/.tfw/.pgw/.wld) 은 숫자 6줄 텍스트다. KML GroundOverlay 는
   <LatLonBox> 에 사방 좌표를 담는다. 둘 다 외부 라이브러리가 필요 없다.
   GeoTIFF 는 브라우저가 디코딩하지 못해 지원하지 않는다.
   -------------------------------------------------------------------------- */
function parseWorldFile(text, imgW, imgH){
  var v = String(text).trim().split(/[\r\n]+/).map(function(s){ return parseFloat(String(s).trim()); });
  if(v.length < 6 || v.slice(0,6).some(function(x){ return !isFinite(x); }))
    return {err:'world file 형식이 아닙니다. 숫자 6줄이어야 합니다.'};
  var A=v[0], D=v[1], B=v[2], E=v[3], C=v[4], F=v[5];
  if(Math.abs(D) > 1e-9 || Math.abs(B) > 1e-9)
    return {err:'회전이 포함된 좌표 파일은 지원하지 않습니다. 정북 정렬로 다시 내보내세요.'};
  if(!imgW || !imgH)
    return {err:'지도 원본 크기를 알 수 없습니다. 지도를 다시 불러온 뒤 적용하세요.'};
  /* 미터 좌표계(UTM·TM 등)는 투영 역변환이 필요하다. 잘못 변환한 좌표를 지상팀에
     넘기는 것보다 거부하는 편이 안전하다. */
  if(Math.abs(C) > 180 || Math.abs(F) > 90)
    return {err:'미터 좌표계(UTM·TM 등)로 보입니다. 매핑 소프트웨어에서 WGS84 경위도로 내보내거나 수동 2점 보정을 쓰세요.'};
  var west = C - A/2, north = F - E/2;
  return validateGeo({west:west, north:north,
    east:west + A*imgW, south:north + E*imgH, src:'world', at:Date.now()});
}
function parseKmlOverlay(text){
  var doc = null;
  try{ doc = new DOMParser().parseFromString(String(text), 'application/xml'); }
  catch(e){ return {err:'KML 을 읽지 못했습니다.'}; }
  if(!doc || doc.getElementsByTagName('parsererror').length)
    return {err:'KML 형식이 올바르지 않습니다.'};
  var box = doc.getElementsByTagName('LatLonBox')[0];
  if(!box) return {err:'KML 에 GroundOverlay 의 LatLonBox 가 없습니다. 정사영상 오버레이 KML 인지 확인하세요.'};
  function val(tag){
    var e = box.getElementsByTagName(tag)[0];
    return e ? parseFloat(String(e.textContent).trim()) : NaN;
  }
  var rot = val('rotation');
  if(isFinite(rot) && Math.abs(rot) > 0.5)
    return {err:'회전('+rot.toFixed(1)+'도)이 있는 오버레이는 지원하지 않습니다.'};
  return validateGeo({west:val('west'), east:val('east'),
    north:val('north'), south:val('south'), src:'kml', at:Date.now()});
}
function isGeoFileName(name){ return /\.(jgw|tfw|pgw|wld|kml)$/i.test(String(name||'')); }
function applyGeoFile(file,opSeq,opEpoch,fileSeq,targetMapId,targetMapVer){
  aiFolderStop('좌표 파일 불러오기를 시작해 폴더 연결을 해제했습니다.');
  if(opSeq===undefined)opSeq=stateLifecycleSeq;
  if(opEpoch===undefined)opEpoch=SESSION_EPOCH;
  if(fileSeq===undefined)fileSeq=++fileMutationSeq;
  if(!ensureEditor() || !file) return;
  if(isOnlineMap()){mapMsg('좌표 파일은 사진·오프라인으로 전환한 뒤 적용하세요.','warn');return;}
  if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq))return;
  if(file.size > 2*1024*1024){ mapMsg('좌표 파일이 너무 큽니다.','err'); return; }
  if(!S.grid.hasMap){ mapMsg('먼저 지도 이미지를 넣은 뒤 좌표 파일을 적용하세요.','err'); return; }
  if(targetMapId===undefined)targetMapId=S.grid.mapId;
  if(targetMapVer===undefined)targetMapVer=S.grid.mapVer;
  var targetNatW=S.grid.mapNatW,targetNatH=S.grid.mapNatH;
  function sameTarget(){return lifecycleCurrent(opSeq,opEpoch)&&fileMutationCurrent(fileSeq)
    &&S.grid.hasMap&&S.grid.mapId===targetMapId&&S.grid.mapVer===targetMapVer;}
  var fr = new FileReader();
  fr.onerror = function(){if(sameTarget())mapMsg('좌표 파일을 읽지 못했습니다.','err');};
  fr.onload = function(){
    if(!sameTarget()||!ownsEditorLock()){if(fileMutationCurrent(fileSeq))mapMsg('지도가 바뀌어 이전 좌표 파일 적용을 취소했습니다.','warn');return;}
    var res = /\.kml$/i.test(String(file.name||''))
      ? parseKmlOverlay(fr.result)
      : parseWorldFile(fr.result,targetNatW,targetNatH);
    if(res.err){ mapMsg(res.err,'err'); return; }
    S.grid.geo = res.geo; S.grid.ref1 = null; S.grid.ref2 = null;
    commit();
    mapMsg('좌표를 적용했습니다 · '+geoSrcLabel()+' · 지도 가로 '
      + Math.round(mapWidthMeters()) + 'm', 'ok');
  };
  fr.readAsText(file);
}

/* --------------------------------------------------------------------------
   이미지 -> 최대폭 1600px JPEG 로 축소 (localStorage 용량 확보)
   -------------------------------------------------------------------------- */
function fileToMap(file, geoFile){
  aiFolderStop('지도 불러오기를 시작해 폴더 연결을 해제했습니다.');
  var opSeq=stateLifecycleSeq,opEpoch=SESSION_EPOCH,fileSeq=++fileMutationSeq;
  if(!ensureEditor())return;
  if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq))return;
  if(!file){ mapMsg('이미지를 찾지 못했습니다.', 'err'); return; }
  if(file.type && file.type.indexOf('image') !== 0){
    mapMsg('이미지 파일이 아닙니다 ('+file.type+').', 'err'); return;
  }
  /* 축소는 읽기가 끝난 뒤에 일어난다. 원본을 통째로 base64 로 올리는 단계에서
     수십 MB 사진이면 탭이 메모리 압박을 받는다. 읽기 전에 막는다. */
  if(file.size > MAX_IMAGE_BYTES){
    mapMsg('이미지가 너무 큽니다 ('+Math.round(file.size/1048576)+'MB). '
      + Math.round(MAX_IMAGE_BYTES/1048576)+'MB 이하로 줄여 다시 시도하세요.', 'err'); return;
  }
  mapMsg('지도 이미지를 처리하는 중…', 'warn');
  var fr = new FileReader();
  fr.onerror = function(){if(lifecycleCurrent(opSeq,opEpoch)&&fileMutationCurrent(fileSeq))mapMsg('파일을 읽지 못했습니다.', 'err');};
  fr.onload = function(){
    if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq)||!ownsEditorLock())return;
    var img = new Image();
    img.onload = function(){
      if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq)||!ownsEditorLock())return;
      if(!img.width || !img.height){ mapMsg('이미지 크기를 읽지 못했습니다.', 'err'); return; }
      try{
        /* IndexedDB 가 살아 있으면 정사영상을 쓸 만한 해상도까지 남긴다. */
        var maxW = mapPxCap();
        var sc = Math.min(1, maxW / img.width);
        var cv = document.createElement('canvas');
        cv.width  = Math.round(img.width * sc);
        cv.height = Math.round(img.height * sc);
        var cx = cv.getContext('2d');
        cx.fillStyle = '#0B1219'; cx.fillRect(0,0,cv.width,cv.height);
        cx.drawImage(img, 0, 0, cv.width, cv.height);
        /* world file 은 원본 픽셀 크기를 기준으로 해석해야 한다. 축소 전 값을 남긴다. */
        saveMap(cv.toDataURL('image/jpeg', 0.82),
          {w:cv.width, h:cv.height, natW:img.width, natH:img.height},opSeq,opEpoch,fileSeq)
          /* 이미지와 좌표 파일을 함께 끌어다 놓은 경우, 지도가 들어간 뒤에 적용한다. */
          .then(function(okSave){
            if(okSave&&geoFile&&lifecycleCurrent(opSeq,opEpoch)&&fileMutationCurrent(fileSeq))
              applyGeoFile(geoFile,opSeq,opEpoch,fileSeq,S.grid.mapId,S.grid.mapVer);
          });
      }catch(e){
        mapMsg('이미지 변환에 실패했습니다: '+(e && e.name ? e.name : e), 'err');
      }
    };
    img.onerror = function(){
      if(lifecycleCurrent(opSeq,opEpoch)&&fileMutationCurrent(fileSeq))mapMsg('이 형식은 브라우저가 읽지 못합니다. PNG 또는 JPG로 저장해 다시 시도하세요 (HEIC 등은 지원되지 않습니다).', 'err');
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ==========================================================================
   S10. 기상 자동 갱신 (Open-Meteo · API 키 불필요 · CORS 허용)
        통신이 안 되면 조용히 실패하고 수동 입력값을 유지한다.
   ========================================================================== */
var wxBusy=false,wxRequestSeq=0,wxController=null;
function cancelWeatherRequest(){
  wxRequestSeq++;
  if(wxController)try{wxController.abort();}catch(e){}
  wxController=null;wxBusy=false;
}
function fetchWeather(manualTrigger){
  if(!ownsEditorLock())return;
  if(wxBusy){if(manualTrigger)alert('기상 갱신이 이미 진행 중입니다.');return;}
  if(!manualTrigger&&!S.weather.auto)return;
  if(!manualTrigger&&S.weather.src==='manual'&&S.weather.confirmed)return;
  var cs=coordinateStatus();
  if(!cs.ok||!cs.confirmed){if(manualTrigger)alert(cs.why||'현장 좌표를 먼저 확인하세요.');return;}
  if(!navigator.onLine){if(manualTrigger)alert('오프라인입니다. 수동 관측값을 입력하세요.');return;}
  if(manualTrigger&&S.weather.src==='manual'&&S.weather.confirmed
      &&!confirm('확정된 수동 관측값을 자동 모델값으로 교체할까요?'))return;
  var lat=cs.lat,lon=cs.lon,seq=++wxRequestSeq;
  var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon
    +'&current=temperature_2m,precipitation,wind_speed_10m,wind_gusts_10m'
    +'&hourly=precipitation_probability&wind_speed_unit=ms&timezone=Asia%2FSeoul&timeformat=unixtime&forecast_days=1';
  wxBusy=true;S.weather.lastAttemptAt=Date.now();S.weather.error='';
  if(commitLight()===false){wxBusy=false;return;}
  var controller=typeof AbortController!=='undefined'?new AbortController():null;
  wxController=controller;
  var timer=setTimeout(function(){if(controller)controller.abort();},12000);
  fetch(url,{cache:'no-store',signal:controller?controller.signal:undefined})
    .then(function(r){if(!r.ok)throw new Error(String(r.status));return r.json();})
    .then(function(j){
      if(seq!==wxRequestSeq||!ownsEditorLock())return;
      var nowCs=coordinateStatus();
      if(!nowCs.ok||Math.abs(nowCs.lat-lat)>0.000001||Math.abs(nowCs.lon-lon)>0.000001)return;
      var c=j.current||{},temp=num(c.temperature_2m,NaN),wind=num(c.wind_speed_10m,NaN);
      var gust=num(c.wind_gusts_10m,NaN),rainAmt=num(c.precipitation,NaN);
      var observed=typeof c.time==='number'?c.time*1000:Date.parse(c.time||'');
      if(!isFinite(temp)||!isFinite(wind)||!isFinite(gust)||!isFinite(rainAmt)||!isFinite(observed))throw new Error('응답 필수값 누락');
      var precip=null,best=Infinity;
      if(j.hourly&&j.hourly.time&&j.hourly.precipitation_probability){
        for(var i=0;i<j.hourly.time.length;i++){
          var ht=typeof j.hourly.time[i]==='number'?j.hourly.time[i]*1000:Date.parse(j.hourly.time[i]);
          if(isFinite(ht)&&Math.abs(ht-observed)<best){best=Math.abs(ht-observed);precip=num(j.hourly.precipitation_probability[i],null);}
        }
      }
      var w=S.weather;
      var next={rain:rainAmt>0.05,wind:Math.round(wind*10)/10,
                gust:Math.round(gust*10)/10,precip:precip};
      var reconfirm=weatherNeedsReconfirm(
        {confirmed:w.confirmed,src:w.src,rain:w.rain,wind:w.wind,gust:w.gust,precip:w.precip}, next);
      w.temp=Math.round(temp*10)/10;w.wind=next.wind;w.gust=next.gust;
      w.rain=next.rain;w.precip=next.precip;
      w.observedAt=observed;w.stamp=localDateTime(new Date(observed));
      w.src='auto';w.lat=lat;w.lon=lon;
      if(reconfirm){ w.confirmed=false; w.confirmedAt=0; }
      w.error='';commit();
    })
    .catch(function(e){
      if(seq!==wxRequestSeq||!ownsEditorLock())return;
      S.weather.lastAttemptAt=Date.now();S.weather.error='자동 갱신 실패: '+(e&&e.name==='AbortError'?'시간 초과':(e&&e.message||'통신 오류'));
      commit();if(manualTrigger)alert('기상 자동 갱신 실패 — 기존 관측값은 유지했습니다.\n'+S.weather.error);
    })
    /* .then 으로 두면 앞선 .catch 핸들러가 던졌을 때 실행되지 않아
       wxBusy 가 true 로 굳고 이후 모든 기상 갱신이 조용히 막힌다. */
    .finally(function(){
      clearTimeout(timer);
      if(seq===wxRequestSeq){wxBusy=false;if(wxController===controller)wxController=null;}
    });
}

/* ==========================================================================
   S11. 내보내기 · 활동일지 · 샘플
   ========================================================================== */
function download(name, text, type){
  var blob = new Blob([text], {type: type || 'application/json;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function stampName(){
  var n = new Date();
  return n.getFullYear()+p2(n.getMonth()+1)+p2(n.getDate())+'-'+p2(n.getHours())+p2(n.getMinutes());
}
/* 보관 파일 한 개만 있어도 복원 가능해야 한다. 지도 참조만 들어간 JSON은 상태상
   '지도 있음'인데 본체가 없어, 가장 최신 파일일수록 오히려 복원할 수 없게 된다. */
function exportPayloadBase(includeMap){
  var out = JSON.parse(JSON.stringify(S));
  out.appVersion = APP_VERSION;
  if(includeMap !== false && MAPDATA) out.map = MAPDATA;
  return JSON.stringify(out, null, 1);
}
function mapPayloadReadyBase(){
  if(!S.grid.hasMap)return true;
  return mapVerLoaded===S.grid.mapVer
    &&mapIdLoaded===(S.grid.mapId||'legacy')&&validMapData(MAPDATA);
}
function exportJson(){
  if(!mapPayloadReady()){
    alert('지도 또는 후보 이미지를 아직 읽지 못해 완전한 JSON을 만들 수 없습니다. 잠시 후 다시 시도하세요.');
    return false;
  }
  try{download('stayup-'+stampName()+'.json', exportPayload(true));return true;}
  catch(error){alert(error.message);return false;}
}

/* ==========================================================================
   S11b. 자동 보관
   활동 타임라인은 그대로 보고서가 되는데, 지금까지는 운영요원이 'JSON 내보내기'를
   누르기 전까지 브라우저 저장소에만 존재했다. 프로필 초기화·브라우저 변경·파일 경로
   이동 한 번이면 출동 기록이 통째로 사라지고, 자동 복구본도 같은 저장소라 함께 없어진다.
     1순위 - 파일 하나를 지정받아 조용히 덮어쓴다 (File System Access).
     2순위 - 그게 막힌 환경(file:// 등)에서는 주기적으로 다운로드한다.
   ========================================================================== */
var AUTOSAVE_MIN = 10;        /* 다운로드 폴백 주기(분) */
var AUTOSAVE_FILE_MS = 20000; /* 파일 덮어쓰기 최소 간격 */
var autoSaveHandle = null;    /* 세션 한정. 새로고침하면 다시 지정해야 한다 */
var autoSaveAt = 0, autoSaveErr = '', autoSaveBusy = false, lastAutoSavedRev = -1;
var autoSavedMapVer = -1;     /* 지도를 마지막으로 보관에 포함한 판 번호 */
var autoSaveGeneration=0;
function resetAutoSaveSession(preserveAIFolder){
  if(!preserveAIFolder&&typeof aiFolderStop==='function')aiFolderStop('상황이 교체되어 폴더 연결을 해제했습니다. 다시 연결하세요.',false);
  /* 다른 상황의 기록을 이전 출동의 지정 파일에 덮지 않는다. 진행 중 쓰기는
     다음 비동기 경계에서 중단하고, 그 작업이 끝날 때까지 새 쓰기를 기다린다. */
  autoSaveGeneration++;autoSaveHandle=null;autoSaveAt=0;autoSaveErr='';lastAutoSavedRev=-1;autoSavedMapVer=-1;
  refreshAutoSavePill();
}

function autoSaveWorth(){
  return !!(sanInt(S.meta.revision,0,Number.MAX_SAFE_INTEGER,0)>0
    || S.events.length || S.grid.hasMap || String(S.mission.title||'').trim()
    || S.drones.length || S.crew.length || S.subject.name);
}
function autoSaveLabel(){
  if(!S.ui.autoSave) return '자동 보관 꺼짐';
  if(autoSaveErr) return '자동 보관 실패 · '+autoSaveErr;
  var how = autoSaveHandle ? '파일' : '다운로드';
  if(!autoSaveAt) return '자동 보관 대기 · '+how;
  var m = Math.floor((Date.now()-autoSaveAt)/60000);
  return '보관 '+(m<1?'방금':m+'분 전')+' · '+how;
}
function refreshAutoSavePill(){
  var el = document.getElementById('autoSavePill'); if(!el) return;
  el.textContent = autoSaveLabel();
  el.className = 'save-pill' + ((!S.ui.autoSave || autoSaveErr) ? ' bad' : '');
}
function pickAutoSaveFile(){
  if(typeof window.showSaveFilePicker !== 'function'){
    alert('이 환경에서는 보관 파일을 지정할 수 없습니다. 자동 보관은 다운로드로 진행됩니다.');
    return;
  }
  var pickerGeneration=autoSaveGeneration;
  window.showSaveFilePicker({
    suggestedName:'stayup-'+stampName()+'.json',
    types:[{description:'STAY UP 상황 데이터',accept:{'application/json':['.json']}}]
  }).then(function(h){
    if(pickerGeneration!==autoSaveGeneration||!ownsEditorLock())return;
    resetAutoSaveSession(true); /* 백업 파일만 바꿀 때 현재 상황의 후보 연결은 유지 */
    autoSaveHandle=h; autoSaveErr=''; lastAutoSavedRev=-1; autoSaveAt=0;
    autoSaveTick(); refreshAutoSavePill();
    alert('보관 파일을 지정했습니다. 이후 변경은 이 파일에 자동으로 덮어씁니다.\n창을 새로고침하면 다시 지정해야 합니다.');
  }, function(e){
    if(pickerGeneration!==autoSaveGeneration)return;
    if(e && e.name==='AbortError') return;   /* 사용자가 취소 */
    autoSaveErr=(e&&e.name)?e.name:String(e); refreshAutoSavePill();
    alert('보관 파일을 지정하지 못했습니다. 자동 보관은 다운로드로 진행됩니다.');
  });
}
function autoSaveTick(){
  /* 편집권을 가진 창만 보관한다. 두 창이 동시에 쓰면 파일이 서로를 덮는다. */
  if(!S.ui.autoSave || autoSaveBusy || !ownsEditorLock() || !autoSaveWorth()) return;
  var rev = S.meta.revision, now = Date.now();
  if(rev === lastAutoSavedRev) return;      /* 바뀐 게 없으면 쓰지 않는다 */
  if(!mapPayloadReady()){
    autoSaveErr='지도 데이터를 읽지 못해 보관 중단';refreshAutoSavePill();return;
  }
  if(autoSaveHandle){
    if(now - autoSaveAt < AUTOSAVE_FILE_MS) return;
    autoSaveBusy = true;
    var body = exportPayload(true),generation=autoSaveGeneration,handle=autoSaveHandle,writer=null;
    function current(){return generation===autoSaveGeneration&&handle===autoSaveHandle&&ownsEditorLock();}
    function abortWriter(){
      try{if(writer&&typeof writer.abort==='function')return Promise.resolve(writer.abort()).catch(function(){});}catch(e){}
      return Promise.resolve();
    }
    Promise.resolve().then(function(){
      if(!current())return null;
      return handle.createWritable();
    }).then(function(w){
      writer=w;if(!w)return false;
      if(!current())return abortWriter().then(function(){return false;});
      return w.write(body).then(function(){
        if(!current())return abortWriter().then(function(){return false;});
        return w.close().then(function(){return true;});
      });
    }).then(function(saved){
      if(!saved||!current())return;
      autoSaveAt = Date.now(); lastAutoSavedRev = rev; autoSaveErr = '';
      autoSavedMapVer = S.grid.mapVer;
    }, function(e){
      /* 권한이 끊기거나 파일이 사라지면 다운로드 방식으로 되돌아간다. */
      if(current()){autoSaveErr = (e&&e.name)?e.name:String(e); autoSaveHandle = null;}
      return abortWriter();
    }).then(function(){ autoSaveBusy = false; refreshAutoSavePill(); });
    return;
  }
  if(autoSaveAt && now - autoSaveAt < AUTOSAVE_MIN*60000) return;
  try{
    download('stayup-자동보관-'+stampName()+'.json', exportPayload(true));
    autoSaveAt = now; lastAutoSavedRev = rev; autoSaveErr = '';
    autoSavedMapVer = S.grid.mapVer;
  }catch(e){ autoSaveErr = (e&&e.name)?e.name:String(e); }
  refreshAutoSavePill();
}

    var fs=drawerFocusable();
    if(fs.length){
      var first=fs[0],last=fs[fs.length-1],active=document.activeElement;
      if(ev.shiftKey&&(active===first||!$('drawer').contains(active))){ev.preventDefault();last.focus();}
      else if(!ev.shiftKey&&(active===last||!$('drawer').contains(active))){ev.preventDefault();first.focus();}
    }
    return;
  }
  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName||''));
  if((ev.ctrlKey || ev.metaKey) && (ev.key === 'e' || ev.key === 'E')){
    ev.preventDefault();
    if(MODE === 'display'){if(mapExpandedTarget)closeMapWorkspace();toggleDrawer();}
    return;
  }
  if(ev.key==='Escape'&&pinMode){ev.preventDefault();setPinMode(null);return;}
  if(ev.key==='Escape'&&mapExpandedTarget){ev.preventDefault();closeMapWorkspace();return;}
  if(ev.key === 'Escape' && !$('drawer').hidden){ closeDrawer(); return; }
  if(typing) return;
  if(mapExpandedTarget&&(ev.key==='+'||ev.key==='='||ev.key==='-'||ev.key==='_')){
    ev.preventDefault();var mapHost=$(mapExpandedTarget),mapView=mapViewState(mapHost);
    var zoomStep=isOnlineMap()?2:1.25;setMapView(mapHost,{zoom:mapView.zoom*((ev.key==='+'||ev.key==='=')?zoomStep:1/zoomStep)});return;
  }
  /* 쓸다가 잘못 지나가는 경우가 가장 흔하다. 입력칸에 있을 때는 동작하지 않는다. */
  if((ev.ctrlKey || ev.metaKey) && (ev.key === 'z' || ev.key === 'Z')){
    if(lastSweep){ ev.preventDefault(); undoSweep(); }
    return;
  }
  if(ev.key === 'f' || ev.key === 'F'){
    if(document.fullscreenElement) document.exitFullscreen();
    else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }
  if(ev.key==='+'||ev.key==='='){
    if(ownsEditorLock()){S.ui.scale=clamp(num(S.ui.scale,1)+0.05,0.75,1.5);commit();}
    else if(MODE==='display')sendPeer({type:'action',action:'scale',delta:0.05});

  }

    if(!$('board').hidden){renderHeader();renderSafety();tickDrones();renderBanner();}
    /* 손대지 않은 발생시각은 계속 현재 시각을 가리켜야 한다.
       고정돼 있으면 오래 열어둔 입력줄에서 과거 시각으로 기록된다. */
    if(quickEv.timeAuto){
      var te=document.getElementById('evTime');
      if(te&&document.activeElement!==te) te.value=quickEvTime();
    }
  }, 1000);
  setInterval(pollStore, 500);
  /* 30초: 최근 5세대 자동 복구본 */
  setInterval(function(){createSnapshot('자동');},30000);
  setInterval(autoSaveTick,30000);
  /* 10분: 기상 자동 갱신 */
  fetchWeather(false);
  setInterval(function(){ fetchWeather(false); }, 600000);
  setInterval(function(){sendPeer({type:'ping'});},2000);
  setInterval(function(){
    /* 절전·모달로 5초 갱신이 멈춰 임대가 만료되면, 다른 창이 가져가지 않은 한
       같은 창이 스스로 편집권을 회수한다. 그러지 않으면 노트북을 덮었다 열 때마다
       조작 패널이 읽기 전용으로 잠겨 버튼을 한 번 더 눌러야 한다. */
    if(ownsEditorLock()){ refreshEditorLock(); heldEditorLock=true; return; }
    if(heldEditorLock){
      if(acquireEditorLock()) renderAll();      /* 만료된 자기 임대 회수 */
      else { heldEditorLock=false; renderAll(); }    /* 다른 창이 정당하게 가져감 */
    }
  },5000);
  /* 연결 상태 표시 갱신 */
  setInterval(function(){
    var pill = document.getElementById('syncPill');
    if(!pill) return;
    var on = peerConnected();
    pill.className = 'sync-pill' + (on ? '' : ' off');
    pill.textContent = on ? '표출 화면 연결됨' : '표출 화면 미연결';
    var save=document.getElementById('savePill');if(save){save.className='save-pill'+(SAVE_STATUS.ok&&SAVE_STATUS.backupOk?'':' bad');
      save.textContent=SAVE_STATUS.ok?(SAVE_STATUS.backupOk?'저장·복구 정상':'저장 정상 · 복구본 실패'):'저장 실패';}
    refreshAutoSavePill();
  }, 2000);

  /* 표출 화면을 닫을 때 마지막 상태를 확실히 남긴다 */
  window.addEventListener('beforeunload',function(){if(ownsEditorLock())persist();releaseEditorLock();});
}
boot();
</script>
</body>
</html>
