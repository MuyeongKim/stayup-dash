      ?'다른 지도 이미지로 교체할까요?\n기존 구역 상태·담당, 기체 담당구역, 핀과 좌표 보정을 초기화합니다. 작업 전 상태는 복구본에 보관합니다.'
      :'지도 이미지와 기존 구역 상태·담당, 기체 담당구역, 핀, 좌표 보정을 지울까요? 작업 전 상태는 복구본에 보관합니다.'))return Promise.resolve(false);
  if(hadSpatial&&!saveRecoveryPoint(dataUrl?'지도 교체 전':'지도 삭제 전')){
    mapMsg('복구본을 만들 수 없어 지도 변경을 중단했습니다. 저장공간을 확인하세요.','err');
    return Promise.resolve(false);
  }
  var recoveryRevision=S.meta.revision;
  var newId = dataUrl ? uid() : null;
  return (dataUrl ? mapBlobPut(newId, dataUrl) : Promise.resolve()).then(function(){
    if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq)){if(newId)mapBlobDel(newId);return false;}
    /* 큰 이미지가 저장되는 동안 추가한 입력도 작업 전 복구본에 포함한다. */
    if(!sameImage&&S.meta.revision!==recoveryRevision&&!saveRecoveryPoint(dataUrl?'지도 교체 전':'지도 삭제 전')){
      if(newId)mapBlobDel(newId);mapMsg('최신 입력의 복구본을 만들 수 없어 지도 변경을 중단했습니다.','err');return false;
    }
    var ok = commitMap(dataUrl, meta, newId,opSeq,opEpoch,fileSeq);
    if(!ok && newId) mapBlobDel(newId);
    return ok;
  }, function(e){
    if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq))return false;
    mapMsg('지도 저장에 실패했습니다 · '+(e&&e.message?e.message:e),'err');
    return false;
  });
}
function commitMap(dataUrl,meta,newId,opSeq,opEpoch,fileSeq){
  var candidate=migrate(S),hadLegacyMap=!!(S.grid.hasMap&&!S.grid.mapId);
  try{
    if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq))throw new Error('더 최신 지도 작업이 시작됐습니다.');
    var sameImage=!!(dataUrl&&MAPDATA&&dataUrl===MAPDATA);
    candidate.grid.source='image';
    candidate.grid.mapId = dataUrl ? newId : null;
    candidate.grid.hasMap=!!dataUrl; candidate.grid.mapVer=(candidate.grid.mapVer||0)+1;
    candidate.grid.mapW=meta?sanInt(meta.w,0,20000,0):0; candidate.grid.mapH=meta?sanInt(meta.h,0,20000,0):0;
    candidate.grid.mapNatW=meta?sanInt(meta.natW,0,200000,0):0;
    candidate.grid.mapNatH=meta?sanInt(meta.natH,0,200000,0):0;
    /* 픽셀 크기가 같아도 다른 장소의 지도일 수 있다. 이미지 본체가 완전히 같을 때만
       좌표 보정을 유지하고, 그 외에는 화면 변환까지 원점으로 되돌린다. */
    if(!sameImage){
      resetSpatialGrid(candidate,true);
      candidate.grid.geo=null; candidate.grid.ref1=null; candidate.grid.ref2=null;candidate.grid.offlineId='';
      candidate.grid.mapZoom=100;candidate.grid.mapX=0;candidate.grid.mapY=0;
    }
    candidate.grid.mapKB=dataUrl?Math.round(dataUrl.length/1024):0; touchState(candidate);
    if(!persistCandidate(candidate)) throw new Error('상태 저장 실패');
    S=candidate;MAPDATA=dataUrl||null;mapVerLoaded=S.grid.mapVer;mapIdLoaded=dataUrl?S.grid.mapId:null;lastSeenUpdated=S.meta.updated;
    if(!sameImage){lastSweep=null;painting=null;pinMode=null;gridDimensionsDraft=null;}
    if(hadLegacyMap)try{localStorage.removeItem(MAPKEY);}catch(ignore){}
  }catch(e){
    mapMsg('지도 저장에 실패해 이전 지도로 되돌렸습니다. 저장공간을 확인하세요.','err');
    renderAll(); return false;
  }
  /* 이 시점에는 KEY와 지도 블롭이 모두 확인됐다. 이후 렌더 예외는 저장 실패로
     돌리지 않아 참조 중인 새 블롭을 호출자가 삭제하지 않게 한다. */
  try{
    broadcast();renderAll();gcMapBlobs();
    sendPeer({type:'map',ver:S.grid.mapVer,data:dataUrl||null});
    mapMsg(dataUrl?'지도 적용·저장 완료 · '+S.grid.mapW+'×'+S.grid.mapH+' · 약 '+S.grid.mapKB+'KB · '+mapStoreLabel()
      :'지도 이미지를 삭제했습니다.',dataUrl?'ok':'warn');
  }catch(e){console.warn('지도 저장 후 화면 갱신 실패',e);}
  return true;
}

window.addEventListener('message',function(ev){
  var m=ev.data; if(!m||m.ch!=='stayup'||ev.source===window) return;
  var expectedOrigin=location.protocol==='file:'?'null':location.origin;
  if(ev.origin!==expectedOrigin)return;
  if(m.type==='hello'){
    if(MODE!=='console') return; peer=ev.source; lastPeerSeen=Date.now();
    sendPeer({type:'helloAck'}); broadcast(); if(MAPDATA)sendPeer({type:'map',ver:S.grid.mapVer,data:MAPDATA}); return;
  }
  if(ev.source!==peer&&ev.source!==window.opener) return;
  lastPeerSeen=Date.now(); if(ev.source)peer=ev.source;
  if(m.type==='helloAck'||m.type==='pong'||m.type==='ack') return;
  if(m.type==='ping'){sendPeer({type:'pong'});return;}
  if(m.type==='purge'){
    stateLifecycleSeq++;mapGcGeneration++;fileMutationSeq++;resetAutoSaveSession();
    S=defaultState();MAPDATA=null;mapVerLoaded=-1;mapIdLoaded=null;
    if(MODE==='display'&&m.epoch)SESSION_EPOCH=m.epoch;
    STARTUP_WARNINGS=['출동 종료로 상황 데이터가 완전 삭제되었습니다.'];renderAll();return;
  }
  if(m.type==='state'){adopt(m.state,false);sendPeer({type:'ack',revision:S.meta.revision});}
  else if(m.type==='map'){
    if(m.data&&!validMapData(m.data)) return;
    if(m.ver==null||m.ver!==S.grid.mapVer)return;
    if((m.data&&!S.grid.hasMap)||(!m.data&&S.grid.hasMap))return;
    MAPDATA=m.data||null;mapVerLoaded=m.ver;mapIdLoaded=m.data?(S.grid.mapId||'legacy'):null;
    renderGridAll(); sendPeer({type:'ack',revision:S.meta.revision});
  }else if(m.type==='action'&&ownsEditorLock()){handlePeerAction(m);}
});

/* localStorage 폴링 - 읽기 화면은 저장소의 단일 편집자 상태를 따라간다. */
function pollStore(){
  try{
    if(!epochCurrent()){
      if(MODE==='display'){
        stateLifecycleSeq++;mapGcGeneration++;fileMutationSeq++;resetAutoSaveSession();SESSION_EPOCH=localStorage.getItem(EPOCHKEY)||SESSION_EPOCH;S=defaultState();S.meta.epoch=SESSION_EPOCH;MAPDATA=null;mapVerLoaded=-1;mapIdLoaded=null;renderAll();
      }else if(!epochInvalidNotified){epochInvalidNotified=true;stateLifecycleSeq++;mapGcGeneration++;fileMutationSeq++;resetAutoSaveSession();
        S=defaultState();MAPDATA=null;mapVerLoaded=-1;mapIdLoaded=null;
        STARTUP_WARNINGS=['다른 창에서 출동 종료 삭제가 실행되었습니다. 이 창을 새로고침하세요.'];renderAll();}
      lastPolledRaw=null;
      return;
    }
    var raw=localStorage.getItem(KEY); if(!raw)return;
    /* 이벤트가 수천 건이면 파싱·정규화·직렬화가 무거워 초당 2회는 표출 화면을 끊기게 한다.
       저장 원문이 지난번과 같으면 상태가 바뀌었을 수 없으므로 바로 빠져나간다. */
    if(raw!==lastPolledRaw){
      lastPolledRaw=raw;
      var o=migrate(JSON.parse(raw)), rr=o.meta.revision, sr=S.meta.revision;
      if(rr>sr||(rr===sr&&o.meta.updated>S.meta.updated))adopt(o,true);
      else if(!ownsEditorLock()&&rr===sr&&o.meta.updated===S.meta.updated&&JSON.stringify(o)!==JSON.stringify(S))adopt(o,true);
    }
    if(S.grid.mapVer!==mapVerLoaded&&Date.now()>=mapRetryAt&&readMapFromStore())renderGridAll();
  }catch(e){console.warn('동기화 상태 읽기 실패',e);}
}

/* ==========================================================================
   S4. 일몰 계산 (좌표만으로 오프라인 동작 · NOAA 태양위치 알고리즘)
   ========================================================================== */
var RAD = Math.PI/180, J1970 = 2440588, J2000 = 2451545, DAYMS = 86400000;
var OBLIQ = RAD * 23.4397;
function toJulian(d){ return d.valueOf()/DAYMS - 0.5 + J1970; }
function fromJulian(j){ return new Date((j + 0.5 - J1970) * DAYMS); }
function toDays(d){ return toJulian(d) - J2000; }
function meanAnomaly(d){ return RAD * (357.5291 + 0.98560028 * d); }
function eclipticLon(M){
  var C = RAD*(1.9148*Math.sin(M) + 0.02*Math.sin(2*M) + 0.0003*Math.sin(3*M));
  return M + C + RAD*102.9372 + Math.PI;
}
function declination(L){ return Math.asin(Math.sin(OBLIQ)*Math.sin(L)); }
function transitJ(ds,M,L){ return J2000 + ds + 0.0053*Math.sin(M) - 0.0069*Math.sin(2*L); }
function sunTimes(date, lat, lon){
  var lw = RAD * -lon, phi = RAD * lat;
  var d = toDays(date), n = Math.round(d - 0.0009 - lw/(2*Math.PI));
  var ds = 0.0009 + lw/(2*Math.PI) + n;
  var M = meanAnomaly(ds), L = eclipticLon(M), dec = declination(L);
  var Jnoon = transitJ(ds, M, L);
  function ev(hDeg){
    var h = hDeg * RAD;
    var cosw = (Math.sin(h) - Math.sin(phi)*Math.sin(dec)) / (Math.cos(phi)*Math.cos(dec));
    if(cosw > 1 || cosw < -1) return null;             /* 백야/극야 */
    var w = Math.acos(cosw);
    var Jset=transitJ(0.0009 + (w + lw)/(2*Math.PI) + n, M, L);
    return {rise:fromJulian(Jnoon-(Jset-Jnoon)),set:fromJulian(Jset)};
  }
  var sun=ev(-0.833), civil=ev(-6);
  return {sunrise:sun&&sun.rise,sunset:sun&&sun.set,
    dawn:civil&&civil.rise,dusk:civil&&civil.set,noon:fromJulian(Jnoon)};
}
/* 오늘(또는 이미 지났으면 내일)의 일몰 시각 */
function nextSunset(now, lat, lon){
  var t = sunTimes(now, lat, lon);
  if(t.sunset && t.sunset.getTime() > now.getTime()) return t;
  var t2 = sunTimes(new Date(now.getTime() + DAYMS), lat, lon);
  t2.tomorrow = true;
  return t2;
}
function sunPhase(now){
  var cs=coordinateStatus();
  if(!cs.ok) return {kind:'unknown',times:null};
  var t=sunTimes(now,cs.lat,cs.lon);
  if(!t.sunrise||!t.sunset) return {kind:'unknown',times:t};
  if(now.getTime()<t.sunrise.getTime()) return {kind:'beforeSunrise',times:t};
  if(now.getTime()>=t.sunset.getTime()) return {kind:'afterSunset',times:t};
  return {kind:'day',times:t};
}

/* ==========================================================================
   S5. 파생 계산
   ========================================================================== */
/* 셀 상태 집계 */
function gridRows(){ return clamp(intv(S.grid.rows,5),1,12); }
function gridCols(){ return clamp(intv(S.grid.cols,6),1,12); }
function gridStats(){
  var n = {0:0,1:0,2:0,3:0};
  var R = gridRows(), C = gridCols(), total = R*C;
  for(var r=0;r<R;r++) for(var c=0;c<C;c++){
    var cel0 = S.grid.cells[cellId(r,c)];
    n[(cel0 && cel0.s) || 0]++;
  }
  return { n:n, total:total, pct: total ? Math.round(n[2]/total*100) : 0 };
}
/* 기체 잔여 비행시간 추정: 100% -> 착륙 유보 25% 구간을 항속시간으로 본다 */
function droneRemainMin(d){
  var end = num(d.endurance, 25);
  var b = num(d.battery, 0);
  if(end <= 0) return 0;
  var rate = 75 / end;            /* %/분 */
  return Math.max(0, Math.round((b - 25) / rate));
}
/* 지속 운용 가능시간(시간) = 충전완료 배터리 x 평균 항속 / 동시 운용대수 */
function endurHours(){
  var b = S.batteries;
  var conc = Math.max(1, intv(b.concurrent,2));
  return (intv(b.ready,0) * num(b.avgFlightMin,25)) / conc / 60;
}
function isNight(now){
  var p=sunPhase(now);
  return p.kind==='unknown'?null:(p.kind!=='day');
}
/* 비행 가능 판정 */
function flightVerdict(now){
  var sf = S.safety, w = S.weather;
  var bad = [], hold = [], warn = [], cs=coordinateStatus();
  if(sf.manned) bad.push('유인기 진입 · 전 기체 즉시 착륙');
  /* 비행 중 기체는 현행 명부의 '조종' 역할과 연결돼야 한다. 공란·미등록·다른 역할을
     정상으로 간주하면 조종자 없는 기체가 '비행 가능'으로 표시되는 fail-open 이 된다. */
  var pilotProblems=[],commloss=[];
  S.drones.forEach(function(d){
    if(d.status!=='flying'&&d.status!=='commloss') return;
    var droneName=d.name||'기체',pilotName=String(d.pilot||'').trim();
    if(d.status==='commloss')commloss.push(droneName);
    var activePilot=!!pilotName&&S.crew.some(function(c){
      var joined=tms(c.inAt);
      return String(c.name||'').trim()===pilotName&&c.role==='조종'&&!c.outAt
        &&joined>0&&joined<=now.getTime()+5*60000;
    });
    if(!activePilot)pilotProblems.push(droneName+(pilotName?' 조종자 현행 투입 확인 불가':' 조종자 미지정'));
  });
  commloss.forEach(function(name){bad.push(name+' 통신불량 · 즉시 착륙·비상절차 적용');});
  pilotProblems.forEach(function(problem){bad.push(problem);});
  if(String(sf.agencies||'').trim()) warn.push('인접기관 동시운용 · 공역 분리 확인');
  if(!cs.ok) hold.push(cs.why); else if(!cs.confirmed) hold.push(cs.why);
  if((sf.noFly||sf.ctrlZone)&&sf.approval!=='done')
    bad.push((sf.noFly?'비행금지구역':'관제권')+' · 승인완료 확인 필요');
  else if(['unknown','none','pending'].indexOf(sf.approval)>=0)
    hold.push('비행승인 '+({unknown:'미확인',none:'미신청',pending:'신청중'}[sf.approval]||'미확인'));
  var ws=cs.ok?weatherStatus(now):{ok:false,why:'현장 기상 확인 미완료'};
  if(!ws.ok) hold.push(ws.why);
  var wind=w.wind, gust=w.gust, lim=num(sf.windLimit,NaN), glim=num(sf.gustLimit,NaN);
  if(!isFinite(lim)||lim<=0) hold.push('지속풍 한계 미설정');
  if(!isFinite(glim)||glim<=0) hold.push('돌풍 한계 미설정');
  if(ws.ok&&isFinite(lim)){
    if(wind>=lim) bad.push('풍속 '+wind+'m/s (한계 '+lim+')');
    else if(wind>=lim*0.8-1e-9)warn.push('풍속 '+wind+'m/s 한계 근접');
  }
  if(ws.ok&&isFinite(glim)){
    if(gust>=glim) bad.push('돌풍 '+gust+'m/s (한계 '+glim+')');
    else if(gust>=glim*0.8-1e-9)warn.push('돌풍 '+gust+'m/s 한계 근접');
  }
  if(ws.ok&&w.rain) bad.push('강수 중');
  else if(ws.ok&&w.precip != null && w.precip >= 60) warn.push('강수확률 '+w.precip+'%');
  var night = isNight(now);
  if(night===null) hold.push('일출·일몰 판정 불가');
  else if(night && !sf.nightApproval) bad.push('야간 · 특별비행승인 없음');
  else if(night) warn.push('야간 비행(승인 보유)');
  if(night===false&&cs.ok){
    var ns = nextSunset(now,cs.lat,cs.lon);
    if(ns.sunset){
      var left = ns.sunset.getTime() - now.getTime();
      if(left > 0 && left <= 30*60000) warn.push('일몰 '+Math.ceil(left/60000)+'분 전');
    }
  }
  function unique(a){return a.filter(function(x,i){return a.indexOf(x)===i;});}
  if(bad.length)return {lv:'danger',txt:'비행 불가',why:unique(bad.concat(hold))};
  if(hold.length)return {lv:'idle',txt:'판정 보류',why:unique(hold)};
  if(warn.length) return { lv:'warn',   txt:'제한 비행', why:warn };
  return { lv:'ok', txt:'비행 가능', why:['제한사항 없음'] };
}
/* ==========================================================================
   S5b. 지도 좌표계 (지오레퍼런스)
   격자는 지금까지 픽셀 좌표계였고, 실제 거리와의 연결은 '지도 가로 실거리' 손입력
   하나뿐이었다. 그래서 무전으로 "C3"는 말할 수 있어도 지상팀 GPS에 찍을 좌표는
   줄 수 없었다. 지도 네 변의 위경도를 알면 모든 칸과 핀에 실제 좌표가 생긴다.
   지도 캡처와 정사영상은 정북 정렬이라 회전은 다루지 않는다.
   ========================================================================== */
var MPD_LAT = 111132;   /* 위도 1도당 미터 (평균) */
function geoOK(){
  var g = S.grid.geo;
  return !!(g && isFinite(g.west) && isFinite(g.east) && isFinite(g.north) && isFinite(g.south)
    && g.west !== g.east && g.north !== g.south);
}
/* 이미지 정규좌표(u,v: 0~1) -> 위경도. v 는 위에서 아래로 증가한다. */
function geoAt(u, v){
  if(!geoOK()) return null;
  var g = S.grid.geo;
  return { lat: g.north + clamp(v,0,1)*(g.south - g.north),
           lon: g.west  + clamp(u,0,1)*(g.east  - g.west) };
}
function cellCenterAt(r, c){ return geoAt((c+0.5)/gridCols(), (r+0.5)/gridRows()); }
function cellCenterById(id){
  var m = /^([A-L])(\d{1,2})$/.exec(String(id||'').toUpperCase());
  if(!m) return null;
  var r = m[1].charCodeAt(0)-65, c = parseInt(m[2],10)-1;
  if(r<0||r>=gridRows()||c<0||c>=gridCols()) return null;
  return cellCenterAt(r, c);
}
function fmtLatLon(p){ return p ? p.lat.toFixed(5)+', '+p.lon.toFixed(5) : ''; }
/* 보정이 있으면 가로 실거리를 계산해서 쓴다. 눈대중 축척 입력보다 정확하다. */
function mapWidthMeters(){
  if(geoOK()){
    var g = S.grid.geo, midLat = (g.north + g.south)/2;
    return Math.abs(g.east - g.west) * MPD_LAT * Math.cos(midLat*RAD);
  }
  return num(S.grid.widthMeters, 2000);
}
/* 네 변 값이 실제로 쓸 만한지 본다. 잘못된 좌표를 지상팀에 넘기면 안 된다. */
function validateGeo(geo){
  if(!geo) return {err:'좌표 계산에 실패했습니다.'};
  var w = Math.abs(geo.east-geo.west), h = Math.abs(geo.north-geo.south);
  if(!isFinite(w)||!isFinite(h)||w<=0||h<=0) return {err:'좌표 계산에 실패했습니다.'};
  if(Math.abs(geo.north)>90||Math.abs(geo.south)>90
     ||Math.abs(geo.west)>180||Math.abs(geo.east)>180)
    return {err:'좌표가 위경도 범위를 벗어났습니다.'};
  if(w > 2 || h > 2)
    return {err:'지도 범위가 비정상적으로 넓습니다(가로 약 '+Math.round(w*100)+'km). 입력값을 확인하세요.'};
  if(w < 0.00002 || h < 0.00002)
    return {err:'지도 범위가 비정상적으로 좁습니다. 입력값을 확인하세요.'};
  if(geo.north <= geo.south)
    return {err:'위쪽 기준점이 아래쪽보다 남쪽입니다. 두 점의 위도를 확인하세요.'};
  return {geo:geo};
}
/* 두 기준점에서 네 변을 유도한다. 두 점은 가로·세로가 모두 충분히 달라야 한다. */
function geoFromRefs(r1, r2){
  if(!r1 || !r2) return {err:'기준점 두 개를 모두 지도에 찍으세요.'};
  var u1=r1.x/100, v1=r1.y/100, u2=r2.x/100, v2=r2.y/100;
  if(Math.abs(u2-u1) < 0.05)
    return {err:'두 기준점의 좌우 간격이 너무 좁습니다. 대각선으로 떨어진 두 점을 쓰세요.'};
  if(Math.abs(v2-v1) < 0.05)
    return {err:'두 기준점의 상하 간격이 너무 좁습니다. 대각선으로 떨어진 두 점을 쓰세요.'};
  var lat1=num(r1.lat,NaN), lon1=num(r1.lon,NaN), lat2=num(r2.lat,NaN), lon2=num(r2.lon,NaN);
  if(!isFinite(lat1)||!isFinite(lon1)||!isFinite(lat2)||!isFinite(lon2))
    return {err:'기준점의 위도·경도를 모두 입력하세요.'};
  var dLon = (lon2-lon1)/(u2-u1), dLat = (lat2-lat1)/(v2-v1);
  var west = lon1 - u1*dLon, north = lat1 - v1*dLat;
  return validateGeo({west:west, north:north, east:west+dLon, south:north+dLat,
    src:'manual', at:Date.now()});
}
function geoSrcLabel(){
  if(!geoOK()) return '미보정';
  return {manual:'수동 2점', world:'좌표 파일(world)', kml:'좌표 파일(KML)',online:'온라인 수색 범위'}[S.grid.geo.src] || '보정됨';
}

/* 실종 경과시간 기반 이동 추정반경(km) */
function moveRadiusKm(now){
  var t = tms(S.subject.missingAt);
  if(!t) return null;
  var h = (now.getTime() - t) / 3600000;
  if(h <= 0) return 0;
  return num(S.subject.walkSpeed,2) * h * num(S.subject.decay,0.35);
}

   S6. 표출 화면 렌더

function setKpi(id, lv){
  var el = $(id); if(!el) return;
  el.className = 'kpi' + (id==='kFlight' ? ' kpi-flight' : '') + ' lv-' + lv;
}
/* --------------------------------------------------------------------------
   상단 KPI 네 개
   표출 화면(대형 모니터)과 조작 패널(기록자 노트북)이 같은 계산을 써야 한다.
   노트북 1대 + 대형 모니터 구성에서 기록자는 조작 패널만 보므로, 이 넷을 보려고
   고개를 돌리게 하면 안 된다. 계산을 여기 한 곳에 두고 양쪽이 나눠 쓴다.
     v = 큰 숫자 · u = 단위 접미사 · s = 부제 · lv = 등급 · dot = 형태 표식 사용
   -------------------------------------------------------------------------- */
function kpiGolden(now){
  var mt = tms(S.subject.missingAt);
  if(!mt) return {v:'--:--', u:'', s:'실종시각 미입력', lv:'idle'};
  var passed = now.getTime() - mt;
  var left = GOLDEN_HOURS*3600000 - passed;
  var ph = passed/3600000;
  return {
    /* 큰 숫자가 현재시각과 비슷하게 읽혀 혼동되므로 단위를 붙인다.
       durHM 은 숫자와 콜론만 만들어내므로 그대로 붙여도 안전하다. */
    v: left <= 0 ? '초과' : durHM(left),
    u: left <= 0 ? '' : '남음',
    s: '실종 후 '+durHM(passed)+' 경과 · 기준 '+GOLDEN_HOURS+'h',
    lv: left <= 0 ? 'crit' : (ph < 8 ? 'ok' : (ph < 16 ? 'warn' : 'danger'))
  };
}
function kpiSunset(now){
  var cs = coordinateStatus(), sp = sunPhase(now);
  if(!(cs.ok && sp.times && sp.times.sunset && sp.times.sunrise))
    return {v:'--:--', u:'', s: cs.why || '일출·일몰 계산 불가', lv:'idle'};
  var nightLv = cs.confirmed ? (S.safety.nightApproval?'warn':'danger') : 'idle';
  if(sp.kind === 'beforeSunrise') return {v:'일출 전', u:'', lv:nightLv,
    s:'일출 '+hhmm(sp.times.sunrise)+' · 일몰 '+hhmm(sp.times.sunset)};
  if(sp.kind === 'afterSunset') return {v:'일몰 후', u:'', lv:nightLv,
    s:'일몰 '+hhmm(sp.times.sunset)+(sp.times.dusk?' · 박명종료 '+hhmm(sp.times.dusk):'')};
  var sl = sp.times.sunset.getTime() - now.getTime();
  return { v:durHM(sl), u:'남음',
    s:'일몰 '+hhmm(sp.times.sunset)+(cs.confirmed?'':' · 좌표 확인 필요'),
    lv: cs.confirmed ? (sl<=30*60000?'warn':'ok') : 'idle' };
}
function kpiFlight(now){
  var v = flightVerdict(now);
  var detail=v.why.join(' · ');
  var visible=v.why.slice(0,2).map(function(x){
    return x.length>48?x.slice(0,47)+'…':x;
  }).join(' · ');
  if(v.why.length>2)visible+=' · 외 '+(v.why.length-2)+'건';
  return {v:v.txt, u:'', s:visible, detail:detail, lv:v.lv, dot:true};
}
function kpiElapsed(now){
  var dt = tms(S.mission.dispatchedAt);
  if(!dt) return {v:'--:--', u:'', s:'출동시각 미입력', lv:'idle'};
  return {v:durHM(now.getTime()-dt), u:'경과', s:'출동 '+hhmm(new Date(dt)), lv:'ok'};
}

  function put(vId, sId, kId, k){
    $(vId).innerHTML = (k.dot ? '<i class="dot '+k.lv+'"></i>' : '')
      + esc(k.v) + (k.u ? '<small>'+esc(k.u)+'</small>' : '');
    var detail=k.detail||k.s;
    $(sId).textContent = k.s;$(sId).title=detail;

}

  painting.before[id] = { s:intv(cur.s,0), by:cur.by||'', existed:!!S.grid.cells[id] };
  if(S.ui.paintS !== null && S.ui.paintS !== undefined) cur.s = intv(S.ui.paintS,0);
  if(S.ui.paintBy !== null && S.ui.paintBy !== undefined) cur.by = S.ui.paintBy;
  if(!painting.after)painting.after={};painting.after[id]=cur;
  painting.touched[id] = true;
  if(cur.s === 2 && !wasDone) painting.done.push(id);
  /* 쓸어내리는 동안 전체를 다시 그리면 끊긴다. 만진 칸만 직접 고친다. */
  el.className = 'gcell s'+(cur.s||0);
  el.setAttribute('aria-label', id+' '+CELL_ST[cur.s||0]+(cur.by?' 담당 '+cur.by:' 담당 없음'));
  var byEl = el.querySelector('.by');
  if(cur.by){
    if(byEl) byEl.textContent = cur.by;
    else { var sp=document.createElement('span'); sp.className='by'; sp.textContent=cur.by; el.appendChild(sp); }
  }else if(byEl) byEl.remove();
}
function finishPaint(){
  if(!painting) return;
  var p = painting; painting = null;
  if(p.state&&p.state!==S||p.epoch&&p.epoch!==SESSION_EPOCH||p.revision!==undefined&&p.revision!==S.meta.revision||!ownsEditorLock())return false;
  var ids = Object.keys(p.touched); if(!ids.length) return;
  ids.forEach(function(id){if(p.after&&p.after[id])S.grid.cells[id]=p.after[id];});
  ids.sort();
  var done = p.done.slice().sort();
  var correctedDone=ids.filter(function(id){
    var before=p.before[id],after=S.grid.cells[id]||{s:0,by:''};
    return before&&before.s===2&&(after.s!==2||(before.by||'')!==(after.by||''));
  });
  /* 한 번의 쓸기는 무전 한 건이다. 칸마다 기록을 남기면 활동일지가 넘친다.
     이미 완료였던 칸은 세지 않으므로 같은 구역을 다시 칠해도 중복 기록이 생기지 않는다. */
  var sweepEventId = null;
  if(done.length||correctedDone.length){
    if(!requireEventSlots(1,'구역 완료 쓸기')){
      restorePaintCells(p.before);renderGridAll();
      mapMsg('이벤트 한도로 쓸기를 적용하지 않았습니다.','warn');return false;
    }
    var eventIndex=S.events.length;
    var evType=done.length?'zone':'correction';
    var evZone=(done[0]||correctedDone[0]||'');
    var evText=done.length
      ? done.join(', ')+' 구역 수색완료'
      : correctedDone.join(', ')+' 완료 구역 상태·담당 변경';
    var zoneStates={};ids.forEach(function(k){zoneStates[k]=(S.grid.cells[k]||{s:0}).s;});
    if(!addEvent(evType,evText,evZone,true,undefined,{stateAction:'zoneState',zoneStates:zoneStates})){
      restorePaintCells(p.before);renderGridAll();return false;
    }
    sweepEventId = S.events[eventIndex].id;
  }
  /* 쓸기 한 번은 여섯 칸을 한꺼번에 바꾼다. 잘못 지나가면 원래 값이 뭐였는지
     기억해야 되돌릴 수 있는데, 무전을 들으면서 그럴 여유는 없다. 직전 한 번만 보관한다. */
  var previousSweep=lastSweep;
  lastSweep = { before:p.before, eventId:sweepEventId, count:ids.length, at:Date.now() };
  /* 방금 칠한 칸을 빠른기록 구역에 물려준다. 이미 입력해 둔 값은 건드리지 않는다.
     commit() 이 조작 패널을 다시 그리므로 그 전에 넣어야 화면에 반영된다. */
  if(!String(quickEv.zone||'').trim()){ quickEv.zone = ids[0]; }
  if(!commit()){
    lastSweep=(epochCurrent()&&ownsEditorLock())?previousSweep:null;
    renderAll();mapMsg('쓸기 내용을 저장하지 못해 이전 상태로 되돌렸습니다.','err');
    return false;
  }
  return true;
}
function undoSweep(){
  if(!ensureEditor()) return false;
  if(!lastSweep){ mapMsg('되돌릴 쓸기가 없습니다.','warn'); return false; }
  if(!requireEventSlots(1,'직전 쓸기 취소'))return false;
  var rec = lastSweep; lastSweep = null;
  var ids = Object.keys(rec.before).sort();
  /* 원래 없던 칸은 없던 대로 되돌린다. 빈 칸을 만들어 두면 저장만 커진다. */
  restorePaintCells(rec.before);
  /* 취소된 완료 기록이 활동일지에 그대로 남으면 사실과 달라진다. 지우지 않고
     무효 처리하는 것이 이 앱의 기록 원칙이다(정정·취소와 같은 방식). */
  if(rec.eventId){
    S.events.forEach(function(e){
      if(e.id === rec.eventId && !e.voided){
        e.voided = true; e.voidedAt = Date.now(); e.voidReason = '쓸기 취소';
      }
    });
  }
  var restoredStates={};ids.forEach(function(k){restoredStates[k]=(S.grid.cells[k]||{s:0}).s;});
  addEvent('correction', ids.join(', ')+' 쓸기 취소 · 이전 상태로 되돌림', ids[0], true,undefined,{stateAction:'zoneState',zoneStates:restoredStates});
  if(!commit()){
    lastSweep=(epochCurrent()&&ownsEditorLock())?rec:null;
    renderAll();mapMsg('되돌리기 기록을 저장하지 못해 쓸기 상태를 유지했습니다.','err');
    return false;
  }
  mapMsg(ids.length+'칸을 되돌렸습니다.','ok');
  return true;
}
function paintTargetsSelected(){
  return (S.ui.paintS !== null && S.ui.paintS !== undefined)
      || (S.ui.paintBy !== null && S.ui.paintBy !== undefined);

function fitMapBox(host){
  if(isOnlineMap()){fitOnlineMap(host);return;}
  var fit=host&&host.querySelector('.mapfit');if(!fit)return;
  var sz=mapBaseSize(host);if(!sz.w||!sz.h)return;
  var v=mapViewState(host),w=sz.w*v.zoom,h=sz.h*v.zoom;
  v.x=clamp(v.x,-Math.max(0,(w-host.clientWidth+16)/2),Math.max(0,(w-host.clientWidth+16)/2));
  v.y=clamp(v.y,-Math.max(0,(h-host.clientHeight+16)/2),Math.max(0,(h-host.clientHeight+16)/2));
  var ws=w.toFixed(2)+'px',hs=h.toFixed(2)+'px';
  if(fit.style.width!==ws)fit.style.width=ws;if(fit.style.height!==hs)fit.style.height=hs;
  fit.style.transform='translate(calc(-50% + '+v.x.toFixed(2)+'px),calc(-50% + '+v.y.toFixed(2)+'px))';
  syncMapInteractionUi(host);layoutMapPins(host);

/* 컨테이너는 안전 카드 높이·창 크기·배율 슬라이더로 계속 변한다. 그때마다 다시 맞춘다. */
function observeMapFit(host){

  host.__fitObserved = true;
  new ResizeObserver(function(){ fitMapBox(host); }).observe(host);
}

function buildGrid(host, interactive){

            + (interactive ? ' title="선택된 동작 실행" tabindex="'+(id===gridFocusId?'0':'-1')+'"' : '')
            + '>'+id+(cel.by ? '<span class="by">'+esc(cel.by)+'</span>' : '')+'</'+tag+'>';
    }
  }
  html += '</div>';
  /* 이동 추정반경 + 핀 */

          + '%;width:'+pct+'%;aspect-ratio:1"></div>';

  /* 좌표가 보정돼 있으면 핀 라벨에 실제 위경도를 붙인다. 지휘부가 무전으로

    + '%"><span class="plb">'+esc(pinLabel('최종목격', g.pinLast))
    + '</span><span class="pdot"></span><span class="stem"></span></div>';
  if(g.pinFound) html += '<div class="pin found" style="left:'+g.pinFound.x+'%;top:'+g.pinFound.y
    + '%"><span class="plb">'+esc(pinLabel('발견', g.pinFound))
    + '</span><span class="pdot"></span><span class="stem"></span></div>';
  if(interactive&&!online){
    ['ref1','ref2'].forEach(function(k,i){

    });
  }

  if(online)html='<div class="online-overlays" hidden>'+html+'</div><div class="online-status" role="status"><span>지도 준비 중…</span><button type="button" class="btn sm" data-online-action="retry">다시 연결</button></div>';
  host.innerHTML = html;
  if(online)mountOnlineMap(host);
  fitMapBox(host); observeMapFit(host);

    var rr=m[1].charCodeAt(0)-65,cc=parseInt(m[2],10)-1;

    if(mapGesture){cancelMapInteraction();return;}

    var gesture=mapGesture={host:host,pointerId:ev.pointerId,pointerType:ev.pointerType,mode:mode,pin:pinMode,
      startX:ev.clientX,startY:ev.clientY,x:v.x,y:v.y,moved:false,state:S,epoch:SESSION_EPOCH,revision:S.meta.revision};
    if(mode==='paint'){

    /* 100% 보기와 핀 모드에서는 브라우저의 세로 스크롤 취소 신호를 그대로 받는다. */

      ev.preventDefault();var c=cellUnder(ev);if(c)setGridFocus(c,true);placeMapPoint(pt.x,pt.y);

  };

  if(typeof updateMapWorkspaceUi==='function')updateMapWorkspaceUi(host);

}

function batteryStamp(d,now){
  var at=num(d.batteryUpdatedAt,0),time=now||Date.now();
  if(!at||at>time+5000)return '배터리 수동 입력 · 확인시각 없음';
  var minutes=Math.max(0,Math.floor((time-at)/60000));
  return '배터리 수동 입력 · '+(minutes===0?'방금':minutes+'분 전')+' 확인';
}
/* 위험 요약은 운용 중인 기체의 확인을 돕는다. 비행 판정이나 기체 등록 순서는 바꾸지 않는다.
   수동 배터리 확인 5분 경과는 재확인 주의이며, 실제 잔량/통신 위험과 구분한다. */
var DRONE_BATTERY_STALE_MS=5*60000;
function droneRiskItems(now){
  var time=now==null?Date.now():now;
  return S.drones.reduce(function(items,d){
    if(d.status!=='flying'&&d.status!=='commloss')return items;
    var reasons=[],level='warn',battery=num(d.battery,0),at=num(d.batteryUpdatedAt,0);
    if(d.status==='commloss'){reasons.push('통신 두절');level='danger';}
    if(d.battery==null||d.battery==='')reasons.push('배터리 잔량 미입력');
    else if(battery<20){reasons.push('저배터리 위험 '+Math.round(battery)+'%');level='danger';}
    else if(battery<30)reasons.push('저배터리 주의 '+Math.round(battery)+'%');
    if(!at||at>time+5000)reasons.push('배터리 확인시각 없음');
    else if(time-at>=DRONE_BATTERY_STALE_MS)reasons.push('배터리 '+Math.floor((time-at)/60000)+'분 전 확인 · 재확인 필요');
    if(reasons.length)items.push({id:d.id,name:d.name||'기체',level:level,reasons:reasons});
    return items;
  },[]);
}
function focusDroneRisk(summary,id){
  var target=null;
  if(summary.getAttribute('data-drone-risk-summary')==='display'){
    var body=$('droneBody');
    body.querySelectorAll('.drone[data-id]').forEach(function(card){if(card.getAttribute('data-id')===id)target=card;});
    if(!target)return;
    body.scrollTop+=target.getBoundingClientRect().top-body.getBoundingClientRect().top;
  }else{
    var root=summary.closest('#consoleRoot, #drawerIn'),index=-1;
    S.drones.forEach(function(d,i){if(d.id===id)index=i;});
    if(root&&index>=0)target=root.querySelector('.item[data-di="'+index+'"]');
    if(!target)return;
    target.scrollIntoView({block:'center',behavior:'instant'});
  }
  target.tabIndex=-1;target.focus({preventScroll:true});
}
function refreshDroneRisks(now){
  var all=droneRiskItems(now),items=all.filter(function(item){return item.level==='danger';}).concat(all.filter(function(item){return item.level!=='danger';}));
  document.querySelectorAll('[data-drone-risk-summary]').forEach(function(summary){
    summary.hidden=!items.length;
    if(!items.length){summary.innerHTML='';return;}
    var heading=summary.querySelector('.drone-risk-heading'),list=summary.querySelector('.drone-risk-list');
    if(!heading){
      heading=document.createElement('p');heading.className='drone-risk-heading';summary.appendChild(heading);
      list=document.createElement('div');list.className='drone-risk-list';summary.appendChild(list);
      summary.onclick=function(ev){var button=ev.target.closest('[data-drone-risk-id]');if(button&&summary.contains(button))focusDroneRisk(summary,button.getAttribute('data-drone-risk-id'));};
    }
    var dangerous=items.filter(function(item){return item.level==='danger';}).length;
    var title='기체 확인 필요 '+items.length+'대'+(dangerous?' · 위험 '+dangerous+'대':'')+' · 선택하여 이동';
    if(heading.textContent!==title)heading.textContent=title;
    var keep=Object.create(null);
    items.forEach(function(item,index){
      keep[item.id]=true;
      var button=null;
      Array.prototype.forEach.call(list.children,function(child){if(child.getAttribute('data-drone-risk-id')===item.id)button=child;});
      if(!button){button=document.createElement('button');button.type='button';button.setAttribute('data-drone-risk-id',item.id);}
      button.className='drone-risk-item '+item.level;
      var text=item.name+' · '+item.reasons.join(' / ');
      if(button.textContent!==text)button.textContent=text;
      if(list.children[index]!==button)list.insertBefore(button,list.children[index]||null);
    });
    Array.prototype.slice.call(list.children).forEach(function(button){if(!keep[button.getAttribute('data-drone-risk-id')])button.remove();});
  });
}
function refreshBatteryStamps(){

/* 비행시간·잔여추정만 1초 주기로 갱신(목록 전체를 다시 그리지 않는다) */
function tickDrones(){
  var now = Date.now();
  var nodes = document.querySelectorAll('.drone');
  for(var i=0;i<nodes.length;i++){
    var el = nodes[i], id = el.getAttribute('data-id');
    var d = null;
    for(var j=0;j<S.drones.length;j++) if(S.drones[j].id === id) d = S.drones[j];

    var stamp=el.querySelector('.battery-stamp'),stampText=batteryStamp(d,now);
    if(stamp&&stamp.textContent!==stampText)stamp.textContent=stampText;
    var t = tms(d.tookOffAt);
    var elEl = el.querySelector('.d-el'), rmEl = el.querySelector('.d-rm');
    if((d.status==='flying'||d.status==='commloss')&&t){
      elEl.textContent = durMS(now - t);

    } else {
      elEl.textContent = '—';
      rmEl.textContent = d.status === 'charging' ? '충전' : '—';
    }
  }
}

/* ==========================================================================
   S7. 경보 (발견 / 유인기 진입) · 비프음은 외부 음원 없이 코드로 생성
   ========================================================================== */
var audioCtx = null, lastBeepFor = 0, AUDIO_ARMED=false, bannerKey='';
function updateAudioArm(){ var b=$('audioArm'); if(b)b.hidden=MODE!=='display'||AUDIO_ARMED; }
function primeAudio(){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var p=audioCtx.resume();
    Promise.resolve(p).then(function(){AUDIO_ARMED=audioCtx.state==='running';updateAudioArm();if(AUDIO_ARMED)beep(1);renderBanner();});
  }catch(e){AUDIO_ARMED=false;updateAudioArm();}
}
function beep(times){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state!=='running'){AUDIO_ARMED=false;updateAudioArm();return false;}
    var t0 = audioCtx.currentTime;
    for(var i=0;i<(times||3);i++){
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type='square'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t0+i*0.36);
      g.gain.exponentialRampToValueAtTime(0.22, t0+i*0.36+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+i*0.36+0.28);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0+i*0.36); o.stop(t0+i*0.36+0.3);
    }
    return true;
  }catch(e){AUDIO_ARMED=false;updateAudioArm();return false;}
}
/* 경보 대상은 "가장 늦게 기록된" 발견이다. 사건 발생시각(t) 기준으로 고르면
   과거 시각으로 소급 입력한 발견이 이미 확인 처리된 기록에 가려 경보가 나가지 않는다.
   recordedAt 은 기록 시점의 Date.now() 라 새 기록일수록 항상 커진다. */
function foundAlarmKey(e){ return num(e.recordedAt, num(e.t,0)); }
function latestFound(){
  var best = null;
  S.events.forEach(function(e){
    if(e.type==='found'&&!e.voided&&(!best||foundAlarmKey(e)>foundAlarmKey(best)))best=e;
  });
  return best;
}
/* renderBanner 는 1초 렌더 루프에 들어 있다. 매초 innerHTML 을 갈아끼우면
   "확인" 버튼이 누르는 순간 사라져 클릭이 유실되고 CSS 애니메이션도 매초 리셋된다.
   내용이 실제로 바뀌었을 때만 다시 그린다. */
/* 배너는 fixed 라 헤더(골든타임·일몰·비행 판정·시계) 위에 그대로 겹친다.
   발견·유인기 경보가 뜬 순간 지휘부에게 가장 필요한 숫자들이므로 그만큼 판을 내린다. */
function setBoardOffset(bn, shown){
  var bd = $('board'); if(!bd) return;
  bd.style.paddingTop = shown ? (bn.offsetHeight + 10) + 'px' : '';
}
function renderBanner(){
  var bn = $('alertBanner'); if(!bn) return;
  if(S.safety.manned){
    if(bannerKey!=='manned'){
      bannerKey='manned';
      bn.className = 'alert-banner manned';
      /* U+26A0 는 변이 선택자가 없으면 플랫폼에 따라 컬러 이모지로 렌더돼
         지휘 화면에서 장난감처럼 보인다. U+FE0E 로 흑백 글리프를 강제한다. */
      bn.innerHTML = '<span class="ab-k">\u26A0\uFE0E 유인기 진입</span>'
        + '<span class="ab-x">전 기체 즉시 착륙 · 공역 분리 유지</span>';
      bn.hidden = false;
    }
    setBoardOffset(bn, true);
    if(MODE==='display'&&lastBeepFor!==-1&&beep(4))lastBeepFor=-1;
    return;
  }
  var f = latestFound();
  var alarmKey=f&&foundAlarmKey(f);
  if(f && S.ui.ackFound < alarmKey){
    var key='found:'+alarmKey+':'+f.zone+':'+f.text;
    if(bannerKey!==key){
      bannerKey=key;
      bn.className = 'alert-banner';
      bn.innerHTML = '<span class="ab-k">발견</span>'
        + '<span class="ab-x">'+(f.zone?'['+esc(f.zone)+'] ':'')+esc(f.text)+'</span>'
        + '<button type="button" id="ackBtn">확인</button>';
      bn.hidden = false;
      $('ackBtn').onclick = function(){
        if(ownsEditorLock()){S.ui.ackFound=alarmKey;commit();return;}
        if(sendPeer({type:'action',action:'ackFound',t:alarmKey}))return;
        /* 창 핸들이 끊기면(상단 "표출 화면 미연결") 이 버튼은 아무 일도 하지 못한다.
           조용히 실패하면 눌렀는데 경보가 그대로인 상태가 되므로 이유를 남긴다.
           대형 스크린 앞에서 alert 를 띄우면 화면이 막히므로 버튼 안에 적는다. */

      };
    }
    setBoardOffset(bn, true);
    if(MODE==='display'&&lastBeepFor!==alarmKey&&beep(5))lastBeepFor=alarmKey;
    return;
  }
  if(bannerKey!==''){ bannerKey=''; bn.hidden = true; bn.innerHTML=''; setBoardOffset(bn, false); }
  if(lastBeepFor === -1) lastBeepFor = 0;
}

function requireEventSlots(count,action,emergency){
  if(emergency)return true;
  count=Math.max(1,intv(count,1));
  if(ordinaryEventCount()+count<=MAX_EVENTS)return true;
  alert('일반 이벤트 '+MAX_EVENTS+'건 한도로 '+(action||'이 작업')+'을 처리할 수 없습니다. JSON을 내보낸 뒤 새 상황으로 시작하세요. 유인기 긴급 경보는 별도 기록으로 계속 사용할 수 있습니다.');
  return false;
}
function addEvent(type, text, zone, silentCommit, eventTime, metadata){
  var meta=normalizeEventMeta(metadata,S.grid.generation||'legacy-grid');
  if(type==='zone'&&!Object.keys(meta.zoneStates).length){
    String(zone||'').toUpperCase().split(/[\s,]+/).forEach(function(k){
      if(/^[A-L](?:[1-9]|1[0-2])$/.test(k))meta.zoneStates[k]=2;
    });
  }
  if(!requireEventSlots(1,'기록 추가',meta.emergency))return false;
  var tm=eventTime instanceof Date?eventTime.getTime():num(eventTime,Date.now());
  S.events.push(Object.assign({id:uid(),t:tm,recordedAt:Date.now(),type:type,text:text||'',zone:zone||'',voided:false,voidedAt:0,voidReason:''},meta));
  if(!silentCommit) return commit();
  return true;
}

    {entityType:'safety',entityId:'manned',stateAction:next?'mannedEnter':'mannedLeave',emergency:true});

}

/* ==========================================================================
   S9. 조작 패널
   입력 필드는 data-path 로 상태 경로를 가리킨다. 예: data-path="mission.title"
   ========================================================================== */
function getPath(path){
  var parts = path.split('.'), o = S;
  for(var i=0;i<parts.length;i++){ if(o==null) return undefined; o = o[parts[i]]; }
  return o;
}
function setPath(path, val){
  var parts = path.split('.'), o = S;
  for(var i=0;i<parts.length-1;i++){
    if(o[parts[i]] == null) o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length-1]] = val;
}
/* 오류 초안은 현재 창에만 유지한다. 출동 전환이나 대상 삭제 뒤 재사용하지 않는다. */
var fieldErrors={},fieldErrorSeq=-1;
function fieldErrorKey(el){
  var path=el.getAttribute('data-path')||el.id;
  var match=/^(drones|crew)\.(\d+)\.(.+)$/.exec(path);
  if(match){var item=S[match[1]][+match[2]];return item?match[1]+'.'+item.id+'.'+match[3]:'';}
  return path;
}
function errorRegistry(){
  if(fieldErrorSeq!==stateLifecycleSeq){fieldErrors={};fieldErrorSeq=stateLifecycleSeq;}
  return fieldErrors;
}
function fieldErrorId(el){return 'error-'+(el.getAttribute('data-path')||el.id).replace(/[^a-zA-Z0-9_-]/g,'-');}
function showFieldError(el,message,focus){
  if(!el)return;
  var key=fieldErrorKey(el),path=el.getAttribute('data-path');
  if(key)errorRegistry()[key]={value:el.value,message:message,canonical:path?getPath(path):undefined};
  el.classList.add('invalid');el.setAttribute('aria-invalid','true');
  var id=fieldErrorId(el),error=document.getElementById(id);
  if(!error){error=document.createElement('span');error.id=id;error.className='field-error';error.setAttribute('role','status');el.insertAdjacentElement('afterend',error);}
  error.textContent=message;
  var described=(el.getAttribute('aria-describedby')||'').split(/\s+/).filter(Boolean);
  if(described.indexOf(id)<0)described.push(id);el.setAttribute('aria-describedby',described.join(' '));
  if(focus){var fold=el.closest('details');if(fold)fold.open=true;el.focus();}
}
function clearFieldError(el){
  if(!el)return;delete errorRegistry()[fieldErrorKey(el)];
  el.classList.remove('invalid');el.removeAttribute('aria-invalid');
  var id=fieldErrorId(el),error=document.getElementById(id);if(error)error.remove();
  var described=(el.getAttribute('aria-describedby')||'').split(/\s+/).filter(function(x){return x&&x!==id;});
  if(described.length)el.setAttribute('aria-describedby',described.join(' '));else el.removeAttribute('aria-describedby');
}
function restoreFieldErrors(root){
  var errors=errorRegistry();
  root.querySelectorAll('input,select,textarea').forEach(function(el){
    var key=fieldErrorKey(el),error=errors[key];if(!error)return;
    if(!ownsEditorLock()){delete errors[fieldErrorKey(el)];return;}
    var path=el.getAttribute('data-path');
    if(path&&getPath(path)!==error.canonical){delete errors[key];return;}
    el.value=error.value;showFieldError(el,error.message,false);
  });
}
function inputErrorMessage(el){
  if(el.validity.rangeOverflow||el.validity.rangeUnderflow)
    return (el.min!==''&&el.max!==''?el.min+'~'+el.max:el.min!==''?el.min+' 이상':el.max+' 이하')+'로 입력하세요. 잘못된 값은 저장하지 않습니다.';
  if(el.validity.stepMismatch)return '입력 간격 '+(el.step||'1')+'에 맞춰 주세요. 잘못된 값은 저장하지 않습니다.';
  return '입력 형식과 값을 확인하세요. 잘못된 값은 저장하지 않습니다.';
}
function fld(label, path, type, attrs){
  var v = getPath(path);
  var a = attrs || '';
  if(type === 'checkbox'){
    return '<label class="chkline"><input type="checkbox" data-path="'+path+'"'
      + (v?' checked':'')+'> '+label+'</label>';
  }
  if(type === 'textarea'){
    return '<label class="f"><span>'+label+'</span><textarea data-path="'+path+'" '+a+'>'
      + esc(v==null?'':v)+'</textarea></label>';
  }
  return '<label class="f"><span>'+label+'</span><input type="'+(type||'text')
    + '" data-path="'+path+'" value="'+esc(v==null?'':v)+'" '+a+'></label>';
}
function sel(label, path, opts){
  var v = getPath(path);
  var o = opts.map(function(p){
    return '<option value="'+esc(p[0])+'"'+(String(v)===String(p[0])?' selected':'')+'>'+esc(p[1])+'</option>';
  }).join('');
  return '<label class="f"><span>'+label+'</span><select data-path="'+path+'">'+o+'</select></label>';
}

/* 조작 패널은 모드에 따라 스크롤 주체가 다르다.
   console 모드는 문서가, 드로어(Ctrl+E)는 겹쳐 열린 패널이 스크롤된다.
   상단 바 높이는 칩 줄바꿈에 따라 달라지므로 고정값 대신 그때그때 잰다. */
function scrollHost(el){
  var p=el.parentNode;
  while(p&&p.nodeType===1){
    /* body 의 overflow-y:auto 는 뷰포트로 전파되므로 computed 값은 auto 인데

    if(p===document.body||p===document.documentElement) break;
    var ov=getComputedStyle(p).overflowY;
    if((ov==='auto'||ov==='scroll')&&p.scrollHeight>p.clientHeight+1) return p;
    p=p.parentNode;
  }
  return null;
}
/* 부드러운 스크롤은 쓰지 않는다. 4,000px 이동에 1초 가까이 걸려 그동안 조작이 막히고,

/* 배열 순번은 삭제·정렬 후 다른 대상을 가리킨다. 렌더 시점의 엔터티 ID와
   버튼 인자를 DOM에 남겨, 상태 변경 뒤에도 같은 조작에만 포커스를 돌린다. */
function stampConsoleFocus(root){
  var seen={};
  root.querySelectorAll('input,textarea,select,button,summary,[data-cell]').forEach(function(el){
    var path=el.getAttribute('data-path')||'',match=/^(drones|crew)\.(\d+)\.(.+)$/.exec(path);
    var kind=match?match[1]:(el.hasAttribute('data-di')?'drones':(el.hasAttribute('data-ci')?'crew':''));
    var index=match?+match[2]:+(el.getAttribute(kind==='drones'?'data-di':'data-ci'));
    var entity=kind&&S[kind][index],entityKey=entity?kind+':'+entity.id:'';
    var sec=el.closest('.sec'),fold=el.closest('details[data-fold]');
    var scope=(sec?sec.id:'console')+(el.closest('#eventHistory')?':history':'');
    var parts=[scope,entityKey,el.tagName];
    if(path)parts.push('path',match?match[3]:path);
    else if(el.id)parts.push('id',el.id);
    else if(el.tagName==='SUMMARY'&&fold)parts.push('fold',fold.dataset.fold);
    else Array.prototype.slice.call(el.attributes).filter(function(a){
      return /^data-/.test(a.name)&&!/^data-(di|ci|focus-)/.test(a.name);
    }).sort(function(a,b){return a.name.localeCompare(b.name);}).forEach(function(a){parts.push(a.name,a.value);});
    var key=JSON.stringify(parts),ordinal=seen[key]||0;seen[key]=ordinal+1;
    el.setAttribute('data-focus-key',key+':'+ordinal);
    if(entityKey){
      el.setAttribute('data-focus-entity',entityKey);
      var item=el.closest('.item');
      if(item){item.setAttribute('data-focus-entity-root',entityKey);item.tabIndex=-1;}
    }
  });
}
function renderConsole(root){
  if(!root) return;
  if(typeof cancelMapInteraction==='function')cancelMapInteraction();
  if(consoleIdleTimer){ clearTimeout(consoleIdleTimer); consoleIdleTimer = null; }
  var scrollTop = root.scrollTop;
  var activeEl=document.activeElement,focusInside=!!(activeEl&&root.contains(activeEl));
  var focusPath = focusInside&&activeEl.getAttribute?activeEl.getAttribute('data-path'):null;
  var focusId=focusInside&&activeEl.id?activeEl.id:'';
  var focusKey=focusInside&&activeEl.getAttribute?activeEl.getAttribute('data-focus-key'):null;
  var focusEntity=focusInside&&activeEl.getAttribute?activeEl.getAttribute('data-focus-entity'):null;
  var focusSection=focusInside&&activeEl.closest?activeEl.closest('.sec'):null;
  var focusSectionId=focusSection?focusSection.id:'';
  var focusSelStart = null,focusSelEnd=null,focusSelDirection=null;
  if(focusPath && document.activeElement.selectionStart != null)
    {focusSelStart=activeEl.selectionStart;focusSelEnd=activeEl.selectionEnd;focusSelDirection=activeEl.selectionDirection;}

  root.querySelectorAll('details[data-fold]').forEach(function(fold){consoleFolds[fold.dataset.fold]=fold.open;});
  root.innerHTML = consoleHtml();
  organizeConsole(root);
  root.hidden = false;
  bindConsole(root);
  if(typeof restoreFieldErrors==='function')restoreFieldErrors(root);
  renderGridAll();
  updatePinModeUi();
  stampConsoleFocus(root);
  if(typeof refreshDroneRisks==='function')refreshDroneRisks();

  root.scrollTop = scrollTop;
  var back=null;
  if(focusKey)root.querySelectorAll('[data-focus-key]').forEach(function(el){if(el.getAttribute('data-focus-key')===focusKey)back=el;});
  if(!back&&!focusKey&&focusId)root.querySelectorAll('[id]').forEach(function(el){if(el.id===focusId)back=el;});
  if(back&&back.disabled)back=null;
  if(!back&&focusEntity)root.querySelectorAll('[data-focus-entity-root]').forEach(function(el){if(el.getAttribute('data-focus-entity-root')===focusEntity)back=el;});
  if(!back&&focusSectionId){var section=root.querySelector('#'+focusSectionId);back=section&&section.querySelector('h2');if(back)back.tabIndex=-1;}
  if(back){
    back.focus({preventScroll:true});
    try{if(focusSelStart!=null)back.setSelectionRange(focusSelStart,focusSelEnd,focusSelDirection);}catch(e){}
  }else if(focusInside&&!$('drawer').hidden&&$('drawer').contains(root)){
    var close=root.querySelector('#btnCloseDrawer');if(close)close.focus();
  }
}

/* --------------------------------------------------------------------------
   기록 ↔ 상태 불일치
   빠른기록으로 남긴 이륙·착륙·구역완료·인원교대는 타임라인에만 들어가고
   기체·격자·인원 상태를 바꾸지 않는다. 자동으로 바꾸면 오기록이 곧바로 상황판에
   퍼지므로, 어긋난 곳을 찾아 보여주고 반영은 운영요원이 직접 누르게 한다.
   새 기록은 기체·인원 ID로 연결하며, 구버전 본문은 정확한 이름이 하나만 일치할 때 연결한다.
   -------------------------------------------------------------------------- */
function legacyEventEntity(e,kind){
  var list=kind==='drone'?S.drones:S.crew,found=[];
  list.forEach(function(item){
    var name=String(item.name||'').trim();if(!name)return;
    var txt=String(e.text||''),at=-1,matched=false;
    while((at=txt.indexOf(name,at+1))>=0){
      var before=at?txt.charAt(at-1):'',after=txt.charAt(at+name.length);
      if(!/[0-9A-Za-z가-힣]/.test(before)&&!/[0-9A-Za-z가-힣]/.test(after)){matched=true;break;}
    }
    if(matched)found.push(item.id);
  });
  return found.length===1?found[0]:'';
}
function eventTargetsEntity(e,kind,id){
  if(e.entityType||e.entityId)return e.entityType===kind&&e.entityId===id;
  return legacyEventEntity(e,kind)===id;
}
function eventZoneStates(e){
  if((e.gridGeneration||'legacy-grid')!==(S.grid.generation||'legacy-grid'))return {};
  if(e.zoneStates&&Object.keys(e.zoneStates).length)return e.zoneStates;
  var states={},isDone=e.type==='zone';
  var isReset=e.type==='correction'&&/(완료 구역 상태·담당 변경|쓸기 취소)/.test(e.text||'');
  if(!isDone&&!isReset)return states;
  var ids=String(e.zone||'').toUpperCase().match(/\b[A-L](?:1[0-2]|[1-9])\b/g)||[];
  /* 구버전 쓸기 기록은 본문에 여러 칸을 담고 zone 에는 첫 칸만 저장했다. */
  var listed=String(e.text||'').match(/^(?:[A-L](?:1[0-2]|[1-9])(?:,\s*|\s+(?=구역|완료|쓸기)))+/);
  if(listed)ids=ids.concat(listed[0].match(/[A-L](?:1[0-2]|[1-9])/g)||[]);
  ids.forEach(function(id){states[id]=isDone?2:0;});return states;
}
function stateMismatches(){
  var out=[],events=S.events.filter(function(e){return !e.voided;}).sort(function(a,b){
    return a.t-b.t||num(a.recordedAt,a.t)-num(b.recordedAt,b.t);
  }),zoneLast={};
  events.forEach(function(e){
    var states=eventZoneStates(e);Object.keys(states).forEach(function(id){zoneLast[id]={event:e,state:states[id]};});
  });
  Object.keys(zoneLast).forEach(function(id){
    var rec=zoneLast[id],s=(S.grid.cells[id]||{}).s||0;
    if(rec.state===2&&(s===0||s===1)&&id.charCodeAt(0)-65<gridRows()&&intv(id.slice(1),0)<=gridCols())out.push({kind:'zone',ref:id,t:rec.event.t,
      generation:S.grid.generation||'legacy-grid',text:id+' 구역완료 기록이 있으나 격자는 '+CELL_ST[s]+'입니다.',btn:id+' 완료로 반영'});
  });
  var droneLast={},crewLast={};
  events.forEach(function(e){
    var kind=(e.type==='takeoff'||e.type==='landing')?'drone'
      :(e.type==='crew'||e.stateAction==='crewResume'||(e.type==='correction'&&/교대 종료 취소/.test(e.text||'')))?'crew':'';
    if(!kind)return;
    var id=(e.entityType||e.entityId)?(e.entityType===kind?e.entityId:''):legacyEventEntity(e,kind);
    if(id)(kind==='drone'?droneLast:crewLast)[id]=e;
  });
  S.drones.forEach(function(d){
    var last=droneLast[d.id];if(!last)return;var air=d.status==='flying'||d.status==='commloss';
    if(last.type==='takeoff'&&!air)out.push({kind:'takeoff',ref:d.id,t:last.t,
      text:d.name+' 이륙 기록 이후 상태가 '+(DRONE_ST[d.status]||d.status)+'입니다.',btn:d.name+' 비행중으로'});
    if(last.type==='landing'&&air)out.push({kind:'landing',ref:d.id,t:last.t,
      text:d.name+' 착륙 기록 이후에도 상태가 '+(DRONE_ST[d.status]||d.status)+'입니다.',btn:d.name+' 배터리교체로'});
  });
  S.crew.forEach(function(c){
    var last=crewLast[c.id];
    if(!c.outAt&&last&&last.type==='crew'&&(!tms(c.inAt)||last.t>=tms(c.inAt)))out.push({kind:'crew',ref:c.id,t:last.t,
      text:c.name+' 교대 종료 기록이 있으나 종료시각이 비어 있습니다.',btn:c.name+' 교대 종료'});
  });
  out.sort(function(a,b){return b.t-a.t;});return out.slice(0,6);
}
/* 반영은 원래 기록을 한 번 더 남기지 않고 '정정'으로만 이력을 남긴다.
   같은 사건이 이륙 2건으로 보이면 활동일지가 사실과 달라진다. */
function syncFromRecord(kind, ref, evTime, generation){
  if(!requireEventSlots(1,'기록에 맞춘 상태 반영'))return false;
  var i, d=null, c=null;
  if(kind==='zone'){
    if(generation&&generation!==(S.grid.generation||'legacy-grid')){alert('격자 구성이 바뀌었습니다. 현재 기록을 다시 확인하세요.');return false;}
    var current=stateMismatches().some(function(x){return x.kind==='zone'&&x.ref===ref;});
    if(!current)return false;
    var cel=S.grid.cells[ref]||{s:0,by:''}; cel.s=2; S.grid.cells[ref]=cel;
    var zoneStates={};zoneStates[ref]=2;
    return addEvent('correction','기록에 맞춰 '+ref+' 구역을 완료로 반영',ref,true,undefined,{stateAction:'zoneState',zoneStates:zoneStates});
  }
  if(kind==='takeoff'||kind==='landing'){
    for(i=0;i<S.drones.length;i++) if(S.drones[i].id===ref) d=S.drones[i];
    if(!d) return false;
    if(kind==='takeoff'){
      /* 이륙시각은 반영을 누른 시각이 아니라 기록된 사건 시각이어야 비행시간이 맞다. */
      d.status='flying'; d.tookOffAt=localDateTime(new Date(num(evTime,Date.now())));
      d.sorties=intv(d.sorties,0)+1;
      return addEvent('correction',(d.name||'기체')+' 이륙 기록에 맞춰 상태를 비행중으로 반영',d.zone,true,undefined,{entityType:'drone',entityId:d.id});
    }
    d.status='swap'; d.tookOffAt='';
    return addEvent('correction',(d.name||'기체')+' 착륙 기록에 맞춰 상태를 배터리교체로 반영',d.zone,true,undefined,{entityType:'drone',entityId:d.id});
  }
  if(kind==='crew'){
    for(i=0;i<S.crew.length;i++) if(S.crew[i].id===ref) c=S.crew[i];
    if(!c) return false;
    var out=localDateTime(new Date(num(evTime,Date.now())));
    if(c.inAt&&tms(out)<tms(c.inAt)){
      alert('교대 기록 시각이 투입시각보다 빠릅니다. 투입시각을 먼저 확인하세요.'); return false;
    }
    c.outAt=out;
    return addEvent('correction',(c.name||'인원')+' 교대 종료 기록에 맞춰 종료시각을 반영','',true,undefined,{entityType:'crew',entityId:c.id});
  }
  return false;
}

/* 좌표 보정 블록. 두 기준점을 지도에 찍고 각 위경도를 넣으면 축척과 원점이 나온다.
   카카오맵·네이버지도는 지도에서 우클릭하면 해당 지점의 위경도를 보여준다. */
/* 빠른기록 구역칸에 들어 있는 칸의 실제 좌표. 무전으로 바로 읽는 값이다. */
function cellGeoLabel(){

function geoPanel(){

function consoleKpiCells(){
  var now = new Date();
  function cell(label, k){
    return '<span class="ck ck-'+k.lv+'" title="'+esc(k.s)+'">'
      + '<em>'+label+'</em>'
      + (k.dot ? '<i class="dot '+k.lv+'"></i>' : '')
      + '<b>'+esc(k.v)+'</b>'
      + (k.u ? '<small>'+esc(k.u)+'</small>' : '')
      + '</span>';
  }
  /* '경과 6:12 경과' 처럼 라벨과 단위가 겹치지 않게 라벨을 고른다. */
  return cell('골든', kpiGolden(now)) + cell('일몰', kpiSunset(now))
       + cell('판정', kpiFlight(now)) + cell('출동', kpiElapsed(now));
}
function verdictDestination(reason){
  if(/좌표|위도|경도|일출·일몰/.test(reason))return {sec:'mission',path:'mission.lat',label:'현장 좌표 확인'};
  if(/조종자|통신불량/.test(reason))return {sec:'drone',path:'',label:'기체·조종자 확인'};
  if(/지속풍 한계/.test(reason))return {sec:'safety',path:'safety.windLimit',label:'지속풍 한계 입력'};
  if(/돌풍 한계/.test(reason))return {sec:'safety',path:'safety.gustLimit',label:'돌풍 한계 입력'};
  if(/기상|풍속|돌풍|강수/.test(reason))return {sec:'safety',path:'weather.wind',label:'현장 기상 확인'};
  return {sec:'safety',path:'',label:'안전·승인 확인'};
}
function verdictReasonsHtml(verdict){
  if(verdict.lv==='ok')return '<p class="note">입력된 제한사항이 없습니다. 실제 승인과 현장 조건을 계속 확인하세요.</p>';
  return '<ul class="verdict-reasons">'+verdict.why.map(function(reason){
    var dest=verdictDestination(reason);
    return '<li><span>'+esc(reason)+'</span><button type="button" class="btn sm" data-act="verdictnav" data-sec="sec-'+dest.sec
      +'" data-path-target="'+dest.path+'">'+dest.label+'</button></li>';
  }).join('')+'</ul>';
}
function verdictHelpHtml(){
  var v=flightVerdict(new Date());
  return '<details class="settings-fold verdict-help" id="verdictHelp" data-fold="verdict-help">'
    +'<summary><span id="consoleVerdictReason">'+esc(v.txt+' · '+v.why[0])+'</span><span class="verdict-count" id="verdictCount">'
    +(v.lv==='ok'?'판정 근거 보기':'확인할 항목 '+v.why.length+'개')+'</span></summary>'
    +'<div id="verdictReasons">'+verdictReasonsHtml(v)+'</div></details>';
}
function refreshVerdictHelp(){
  var v=flightVerdict(new Date()),reason=v.txt+' · '+v.why[0];
  ['consoleVerdictReason','mobileVerdictText'].forEach(function(id){var el=$(id);if(el&&el.textContent!==reason)el.textContent=reason;});
  var count=$('verdictCount');if(count)count.textContent=v.lv==='ok'?'판정 근거 보기':'확인할 항목 '+v.why.length+'개';
  var reasons=$('verdictReasons'),key=JSON.stringify(v);
  if(reasons&&reasons.dataset.key!==key&&!reasons.contains(document.activeElement)){
    reasons.innerHTML=verdictReasonsHtml(v);reasons.dataset.key=key;
  }
}
function refreshConsoleKpi(){
  var host = document.getElementById('ctKpi');
  if(host) host.innerHTML = consoleKpiCells();
  refreshVerdictHelp();refreshMapWorkspaceUi();refreshPriorityInstructions();
}

          ? '<button type="button" class="pb undo" data-act="undosweep">직전 쓸기 취소 ('+intv(lastSweep.count,0)+'칸)</button>'

  return h;
}

   조작 패널 이벤트 결선

function renderDisplayOnly(){
  if($('board').hidden) return;
  renderHeader(); renderSubject(); renderBatteries(); renderCrew();
  renderGridStats(); renderSafety(); renderDrones(); renderLog();
  renderTicker(); renderBanner();
}
/* 타이핑 중에는 조작 패널을 다시 그리지 않는다(포커스 유지) */
function commitLight(){
  if(applying) return;
  var sweepBefore=lastSweep;
  touch(); var ok=persist();
  if(ok){lastSeenUpdated=S.meta.updated;broadcast();applyUi();renderDisplayOnly();refreshPriorityInstructions();}
  else {rollbackStoredState();if(sweepBefore&&epochCurrent()&&ownsEditorLock())lastSweep=sweepBefore;renderAll();}
  return ok;
}

function setDroneStatus(d,next){
  if(!d||!Object.prototype.hasOwnProperty.call(DRONE_ST,next)||d.status===next)return false;
  var prev=d.status, wasAir=!!d.tookOffAt&&(prev==='flying'||prev==='commloss');
  /* 상태 변경은 반드시 타임라인에 남아야 한다. 이벤트 한도에 걸려 기록할 수 없다면
     상태만 조용히 바뀌는 일이 없도록 변경 자체를 거부한다. */
  if(!requireEventSlots(1,'기체 상태 변경'))return false;
  if(next==='flying'){
    if(!wasAir){d.tookOffAt=localDateTime(new Date());d.sorties=intv(d.sorties,0)+1;
      addEvent('takeoff',(d.name||'기체')+' 이륙'+(d.zone?' · '+d.zone+' 구역':''),d.zone,true,undefined,{entityType:'drone',entityId:d.id});}
    else addEvent('note',(d.name||'기체')+' 통신 복구 · 비행 상태 재확인',d.zone,true,undefined,{entityType:'drone',entityId:d.id});
  }else if(next==='commloss'){
    addEvent('accident',(d.name||'기체')+' 통신불량'+(wasAir?' · 비행 중':''),d.zone,true,undefined,{entityType:'drone',entityId:d.id});
  }else if(wasAir){
    d.tookOffAt=''; addEvent('landing',(d.name||'기체')+' 착륙 · '+(DRONE_ST[next]||next),d.zone,true,undefined,{entityType:'drone',entityId:d.id});
  }else addEvent('note',(d.name||'기체')+' 상태 변경: '+(DRONE_ST[prev]||prev)+' → '+(DRONE_ST[next]||next),d.zone,true,undefined,{entityType:'drone',entityId:d.id});
  d.status=next; return true;
}

function readInput(el){
  var t = el.getAttribute('type');
  if(t === 'checkbox') return el.checked;
  if(t === 'number' || t === 'range'){
    if(el.value === '') return null;
    return num(el.value, 0);
  }
  return el.value;
}
function bindConsole(root){
  /* 위임 리스너는 root 당 한 번만 붙인다 (재렌더 시 중복 누적 방지) */
  var first = !root.__delegated;
  root.__delegated = true;

  /* 수동 활성화 탭: 방향키로 메뉴를 살펴보고 Enter/Space로 선택한다. */
  if(first)root.addEventListener('keydown',function(ev){
    var tab=ev.target.closest('[role="tab"]');if(!tab||!root.contains(tab))return;
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(ev.key))return;
    var tabs=Array.prototype.slice.call(tab.parentElement.querySelectorAll('[role="tab"]'));
    var index=tabs.indexOf(tab),next=ev.key==='Home'?0:ev.key==='End'?tabs.length-1:
      (index+(ev.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
    ev.preventDefault();tabs.forEach(function(button,i){button.tabIndex=i===next?0:-1;});
    tabs[next].focus();
  });

  /* 입력 */
  if(first) root.addEventListener('input', function(ev){
    var el = ev.target, path = el.getAttribute && el.getAttribute('data-path');
    var draftKey=el.getAttribute&&el.getAttribute('data-grid-draft');
    if(draftKey){
      if(!ownsEditorLock()){renderConsole(root);return;}
      if(!gridDimensionsDraft||gridDimensionsDraft.generation!==S.grid.generation)
        gridDimensionsDraft={generation:S.grid.generation,rows:S.grid.rows,cols:S.grid.cols};
      gridDimensionsDraft[draftKey]=el.value;return;
    }
    if(!path) return;
    if(!ownsEditorLock()){renderConsole(root);return;}
    if(el.checkValidity&&!el.checkValidity()){
      setPath(path,null);showFieldError(el,inputErrorMessage(el),false);
      var badBattery=path.match(/^drones\.(\d+)\.battery$/);
      if(badBattery&&S.drones[+badBattery[1]])S.drones[+badBattery[1]].batteryUpdatedAt=0;
      if(path==='mission.lat'||path==='mission.lon')invalidateSafetyContext();
      commitLight(); return;
    }
    clearFieldError(el);
    var val=readInput(el);
    if(path==='weather.observedAt')val=tms(val);
    if(path==='weather.rain')val=val==='true'?true:(val==='false'?false:null);
    var co=path.match(/^crew\.(\d+)\.outAt$/);
    if(co&&val&&S.crew[+co[1]]&&S.crew[+co[1]].inAt&&tms(val)<tms(S.crew[+co[1]].inAt)){
      showFieldError(el,'교대 종료시각은 투입시각 이후로 입력하세요.',false);return;
    }
    var sm=path.match(/^drones\.(\d+)\.status$/);
    if(sm){
      if(setDroneStatus(S.drones[+sm[1]],val)) commitLight();
      /* 변경이 거부됐으면(이벤트 한도 등) select 를 실제 상태로 되돌려야 한다. */
      scheduleConsoleRefresh(root);
      return;
    }
    setPath(path,val);
    var batteryInput=path.match(/^drones\.(\d+)\.battery$/);
    if(batteryInput&&S.drones[+batteryInput[1]])S.drones[+batteryInput[1]].batteryUpdatedAt=val===null?0:Date.now();
    if(path==='mission.lat'||path==='mission.lon'){invalidateSafetyContext();cancelWeatherRequest();}
    if(path==='weather.auto'&&!val)cancelWeatherRequest();
    if(/^weather\.(wind|gust|rain|temp|precip|observedAt)$/.test(path)){
      S.weather.src='manual';S.weather.auto=false;S.weather.confirmed=false;S.weather.confirmedAt=0;S.weather.error='';cancelWeatherRequest();
    }
    if(path.indexOf('grid.map') === 0 || path === 'grid.widthMeters'){ renderGridAll(); }
    commitLight();
  });
  if(first) root.addEventListener('change', function(ev){
    var el = ev.target;
    if(!(el.getAttribute && el.getAttribute('data-path'))) return;
    if(!ownsEditorLock()){renderConsole(root);return;}
    if(el.checkValidity&&!el.checkValidity()){el.reportValidity();return;}
    var path=el.getAttribute('data-path');
    if(/^crew\.\d+\.outAt$/.test(path)){
      var ci=+path.split('.')[1],c=S.crew[ci];
      if(c&&c.outAt&&c.inAt&&tms(c.outAt)<tms(c.inAt)){alert('종료시각은 투입시각보다 빠를 수 없습니다.');c.outAt='';renderConsole(root);return;}
    }
    /* commit() 은 renderAll -> renderConsole 로 DOM 을 교체해 지금 누르는 중인
       버튼의 click 을 없앤다. 저장·표출 갱신만 하고 패널은 뒤늦게 그린다. */
    commitLight();
    scheduleConsoleRefresh(root);
  });

  /* 표출 화면 열기 / 드로어 닫기 */
  var od = root.querySelector('#btnOpenDisplay');
  if(od) od.onclick = function(){
    var url = location.href.split('#')[0] + '#display';
    peer = window.open(url, 'stayup_display', 'width=1600,height=900');
    if(!peer){ alert('팝업이 차단되었습니다. 주소창의 팝업 차단을 허용해 주세요.'); return; }
    setTimeout(function(){
      broadcast();
      if(MAPDATA){ try{ peer.postMessage({ch:'stayup',type:'map',data:MAPDATA},PEER_ORIGIN); }catch(e){} }
      renderConsole(MODE==='console' ? $('consoleRoot') : $('drawerIn'));
    }, 700);
  };
  var cd = root.querySelector('#btnCloseDrawer');
  if(cd) cd.onclick = closeDrawer;

  /* 유인기 경보 */
  var mb = root.querySelector('#btnManned');
  if(mb) mb.onclick = function(){
    setMannedAlert(!S.safety.manned);
  };

  /* 이벤트 기록 */
  /* 입력하는 즉시 밖에 보관해야 재렌더로 지워지지 않는다.
     발생시각은 손대기 전까지 "자동"이며, 자동인 동안에는 제출 순간의 현재 시각을 쓴다.
     그래야 입력줄을 오래 열어둔 뒤 기록해도 렌더 시각이 아닌 실제 시각이 남는다. */
  function bindQuick(id, key, upper){
    var el = root.querySelector('#'+id); if(!el) return;
    el.oninput = el.onchange = function(){
      clearFieldError(el);
      quickEv[key] = upper ? el.value.toUpperCase() : el.value;
      if(key === 'time') quickEv.timeAuto = false;
      if(key === 'type'){var wrap=root.querySelector('#evEntityWrap');if(wrap){wrap.innerHTML=quickEntityHtml();bindQuickEntity(root);}}
      if(key === 'zone'){
        var g = root.querySelector('#cellGeo');
        if(g) g.textContent = cellGeoLabel();
      }
    };
  }
  bindQuick('evType','type'); bindQuick('evZone','zone',true); bindQuick('evText','text');
  bindQuick('evTime','time');bindQuickEntity(root);bindEventHistory(root);
  var timeMode=root.querySelector('#evTimeMode');
  if(timeMode)timeMode.onchange=function(){
    quickEv.timeAuto=timeMode.value==='now';
    if(!quickEv.timeAuto&&!quickEv.time)quickEv.time=localDateTime(new Date());
    var timeInput=root.querySelector('#evTime');clearFieldError(timeInput);
    timeInput.value=quickEvTime();root.querySelector('#evTimeLabel').hidden=quickEv.timeAuto;
    if(!quickEv.timeAuto)timeInput.focus();
  };
  var more=root.querySelector('#btnMoreNav');
  if(more)more.onclick=function(){var menu=root.querySelector('#mobileMore');menu.hidden=!menu.hidden;more.setAttribute('aria-expanded',String(!menu.hidden));};
  if(!quickEv.type){ var ty=root.querySelector('#evType'); if(ty) quickEv.type=ty.value; }

  function pushEv(){
    if(!ensureEditor())return;
    var t = quickEv.type || 'note';
    var when = quickEv.timeAuto ? Date.now() : tms(quickEv.time);
    var z = (quickEv.zone||'').trim().toUpperCase();
    var x = (quickEv.text||'').trim();
    var kind=quickEntityKind(),entity=null,metadata={};
    if(kind){
      (kind==='drone'?S.drones:S.crew).forEach(function(item){if(item.id===quickEv.entityId)entity=item;});
      if(!entity){showFieldError(root.querySelector('#evEntity'),kind==='drone'?'기록 대상 기체를 선택하세요.':'기록 대상 인원을 선택하세요.',true);return;}
      metadata.entityType=kind;metadata.entityId=entity.id;
      if(!x)x=(entity.name||'대상')+' '+(t==='crew'?'교대 종료':EV_TYPE[t]);
    }
    if(!x && !z){showFieldError(root.querySelector('#evText'),'기록할 내용 또는 구역을 입력하세요.',true);return;}
    if(!when||when>Date.now()+5*60000){
      root.querySelector('#evTimeLabel').hidden=false;
      showFieldError(root.querySelector('#evTime'),!when?'사건 발생시각을 확인하세요.':'현재보다 5분 이상 미래인 시각은 기록할 수 없습니다.',true);return;
    }
    if(t==='zone'){
      var ids=z.split(/[\s,]+/).filter(Boolean),valid=ids.length&&ids.every(function(id){return /^[A-L](?:1[0-2]|[1-9])$/.test(id)&&id.charCodeAt(0)-65<gridRows()&&intv(id.slice(1),0)<=gridCols();});
      if(!valid){showFieldError(root.querySelector('#evZone'),'현재 격자의 구역을 입력하세요. 예: A1, A2',true);return;}
      metadata.zoneStates={};ids.forEach(function(id){metadata.zoneStates[id]=2;});
    }
    if(!addEvent(t,x||EV_TYPE[t],z,false,when,metadata))return;
    quickEv.zone=''; quickEv.text=''; quickEv.time=''; quickEv.timeAuto=true;
    ['evEntity','evZone','evText','evTime'].forEach(function(id){clearFieldError(root.querySelector('#'+id));});
    var zEl=root.querySelector('#evZone'), xEl=root.querySelector('#evText');
    if(zEl) zEl.value=''; if(xEl) xEl.value='';
    var tEl=root.querySelector('#evTime'); if(tEl) tEl.value=quickEvTime();
    root.querySelector('#evTimeMode').value='now';root.querySelector('#evTimeLabel').hidden=true;
    if(xEl)xEl.focus();
  }
  var ab = root.querySelector('#btnAddEv'); if(ab) ab.onclick = pushEv;
  var et = root.querySelector('#evText');
  if(et) et.onkeydown = function(e){ if(e.key === 'Enter'){ e.preventDefault(); pushEv(); } };

  /* 기체 / 인원 추가 */
  var adr = root.querySelector('#btnAddDrone');
  if(adr) adr.onclick = function(){
    if(!ensureEditor())return;
    S.drones.push({ id:uid(), name:(S.drones.length+1)+'호기', model:'', status:'ready',
      battery:100, tookOffAt:'', endurance:25, zone:'', alt:'', pilot:'', observer:'',
      sorties:0, sensors:['EO','IR'] });
    commit();
  };
  var acr = root.querySelector('#btnAddCrew');
  if(acr) acr.onclick = function(){
    if(!ensureEditor())return;
    S.crew.push({ id:uid(), name:'', role:'조종', inAt: localDateTime(new Date()), outAt:'' });
    commit();
  };

  /* 액션 버튼 위임 */
  if(first) root.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-act]'); if(!b) return;
    var act = b.getAttribute('data-act');
    if(act==='takecontrol'){
      if(acquireEditorLock()){renderAll();}
      else alert(purgeBarrierActive()
        ? '이전 완전삭제가 끝나지 않았습니다. 브라우저 사이트 데이터에서 STAY UP 저장공간을 삭제한 뒤 다시 여세요.'
        : '다른 조작 창의 편집권이 아직 유효합니다. 그 창을 닫고 최대 15초 후 다시 시도하세요.');
      return;
    }
    if(act==='eventpage'){eventHistory.page=intv(b.getAttribute('data-page'),0);renderEventHistory(root);return;}
    if(act==='confirmmapreview'){
      if(!ensureEditor())return;
      if(!confirm('원본 지도에서 구역·핀·좌표 보정값을 실제 위치와 대조했나요? 잘못된 값은 직접 수정해야 하며 이 버튼은 좌표를 자동 보정하지 않습니다.'))return;
      if(!saveRecoveryPoint('지도·표식 재확인 전')){mapMsg('복구본 저장에 실패해 재확인을 중단했습니다.','err');return;}
      S.grid.spatialReview=false;commit();return;
    }
    if(act==='nav'||act==='verdictnav'){
      var menu=root.querySelector('#mobileMore');if(menu)menu.hidden=true;
      var menuButton=root.querySelector('#btnMoreNav');if(menuButton)menuButton.setAttribute('aria-expanded','false');
      var target=root.querySelector('#'+b.getAttribute('data-sec'));

    if(['export','report'].indexOf(act)<0&&!ensureEditor())return;

    if(act === 'confirmbattery' && d){
      var batteryField=root.querySelector('[data-path="drones.'+di+'.battery"]');
      if(d.battery===null||!isFinite(d.battery)||!batteryField||!batteryField.checkValidity()){
        alert('현재 배터리 잔량을 0~100%로 입력한 뒤 확인하세요.');return;
      }
      d.batteryUpdatedAt=Date.now();commit();
    }
    else if(act === 'takeoff' && d){
      if(setDroneStatus(d,'flying'))commit();
    }
    else if(act === 'land' && d&&d.tookOffAt){
      if(setDroneStatus(d,'swap'))commit();
    }
    else if(act === 'deldrone' && d){
      if(confirm((d.name||'기체')+'을 삭제할까요?')){ S.drones.splice(+di,1); commit(); }
    }
    else if(act === 'sens' && d){
      var s = b.getAttribute('data-s');
      d.sensors = d.sensors || [];
      var k = d.sensors.indexOf(s);
      if(k >= 0) d.sensors.splice(k,1); else d.sensors.push(s);
      commit();
    }
    else if(act === 'delcrew' && ci != null){
      var dc=S.crew[+ci]; if(confirm((dc&&dc.name||'해당 인원')+' 기록을 오입력으로 삭제할까요? 정상 교대는 종료 버튼을 사용하세요.')){S.crew.splice(+ci,1);commit();}
    }
    else if(act==='endcrew'&&ci!=null){
      var ec=S.crew[+ci]; if(ec){var out=localDateTime(new Date());
        if(ec.inAt&&tms(out)<tms(ec.inAt)){alert('투입시각이 현재보다 늦습니다. 투입시각을 먼저 수정하세요.');return;}
        if(!requireEventSlots(1,'교대 종료'))return;
        ec.outAt=out;addEvent('crew',(ec.name||'인원')+' 교대 종료', '',true,undefined,{entityType:'crew',entityId:ec.id});commit();}
    }
    else if(act==='resumecrew'&&ci!=null){
      var rc=S.crew[+ci];if(rc){if(!requireEventSlots(1,'교대 종료 취소'))return;
        rc.outAt='';addEvent('correction',(rc.name||'인원')+' 교대 종료 취소','',true,undefined,{entityType:'crew',entityId:rc.id,stateAction:'crewResume'});commit();}
    }
    else if(act === 'batt'){
      var k2 = b.getAttribute('data-k');
      S.batteries[k2] = Math.max(0, intv(S.batteries[k2],0) + intv(b.getAttribute('data-v'),0));
      commit();
    }
    else if(act === 'battswap'){
      if(intv(S.batteries.ready,0) > 0){
        S.batteries.ready--; S.batteries.empty = intv(S.batteries.empty,0)+1; commit();
      }
    }
    else if(act === 'battdone'){
      if(intv(S.batteries.charging,0) > 0){
        S.batteries.charging--; S.batteries.ready = intv(S.batteries.ready,0)+1; commit();
      }

      if(confirm('모든 구역 상태·담당과 기체 담당구역을 초기화할까요? 기존 구역 기록은 이전 수색 이력으로 보관합니다.')){
        if(!saveRecoveryPoint('구역 상태 초기화 전')){alert('복구본을 만들 수 없어 초기화를 중단했습니다.');return;}

      if(age< -5*60000||age>=WEATHER_MAX_AGE_MIN*60000){alert('관측시각은 현재 기준 30분 이내여야 합니다.');return;}

        oe.voided=true;oe.voidedAt=Date.now();oe.voidReason=reason.trim();
        addEvent(oe.type,ntx.trim(),oe.zone,true,oe.t,oe);
        addEvent('correction',shortDateTime(oe.t)+' 기록 정정 · '+reason.trim(),oe.zone,true,undefined,{emergency:oe.emergency===true,gridGeneration:oe.gridGeneration});
      }else{

    }

      if(isOnlineMap())return;
      if(!confirm('좌표 보정을 해제할까요? 격자와 핀의 위경도 표시가 사라집니다.')) return;
      S.grid.geo = null; commit();

    else if(act==='geofile'){ var gfi = root.querySelector('#geoFileInput'); if(gfi) gfi.click(); }
    else if(act==='undosweep'){ undoSweep(); }
    else if(act==='paints'||act==='paintby'){
      /* 같은 버튼을 다시 누르면 해제 = 그 항목은 칠하지 않음 */
      var pv = b.getAttribute('data-v');
      if(act==='paints') S.ui.paintS  = (pv==='') ? null : intv(pv,0);
      else               S.ui.paintBy = (pv==='__keep') ? null : pv;
      /* 바뀐 건 팔레트 하이라이트뿐이다. commit() 으로 패널 전체를 다시 그리면
         지도까지 새로 그려져 칠할 색을 바꿀 때마다 화면이 깜빡이고,
         쓸어내리려던 격자 DOM 이 통째로 교체된다. 버튼 상태만 직접 고친다. */
      var curSel = act==='paints' ? S.ui.paintS : S.ui.paintBy;

        var v = el.getAttribute('data-v');

    else if(act === 'sample'){

        if(!saveRecoveryPoint('샘플 적용 전')){alert('복구본을 만들 수 없어 샘플 적용을 중단했습니다. 저장공간을 확인하세요.');return;}
        loadSample();
      }
    }
    else if(act === 'reset'){
      if(confirm('모든 데이터를 지웁니다. 계속할까요?')){
        if(!saveRecoveryPoint('전체 초기화 전')){alert('복구본을 만들 수 없어 초기화를 중단했습니다.');return;}
        var resetSeq=++fileMutationSeq;
        applyStateWithMap(defaultState(),null,stateLifecycleSeq,SESSION_EPOCH,resetSeq).then(function(ok){
          if(ok) alert('초기화했습니다. 직전 작업은 복구 버튼으로 되돌릴 수 있습니다.');
        });
      }

    else if(act==='purge'){purgeIncidentData();}

  /* 지도 붙여넣기 영역 (실제 드롭 처리는 문서 전역에서 받는다) */
  var pz = root.querySelector('#pasteZone');
  if(pz){

  var gfi2 = root.querySelector('#geoFileInput');
  if(gfi2) gfi2.onchange = function(){
