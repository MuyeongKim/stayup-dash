var painting = null;
var lastSweep = null;   /* 직전 쓸기 한 번분의 원래 값 (되돌리기용) */
var gridFocusId = 'A1'; /* 격자 144칸을 모두 Tab 정지점으로 만들지 않는 roving focus */
function restorePaintCells(before){
  Object.keys(before||{}).forEach(function(id){
    var b=before[id];
    if(!b.existed)delete S.grid.cells[id];
    else S.grid.cells[id]={s:b.s,by:b.by};
  });
}
function paintCell(el){
  if(!painting) return;
  var id = el.getAttribute('data-cell'); if(!id || painting.touched[id]) return;
  var cur = S.grid.cells[id] || {s:0,by:''};
  var wasDone = cur.s === 2;
  /* 고치기 전 값을 남긴다. cur 을 그 자리에서 바꾸므로 반드시 여기서 떠야 한다. */
  painting.before[id] = { s:intv(cur.s,0), by:cur.by||'', existed:!!S.grid.cells[id] };
  if(S.ui.paintS !== null && S.ui.paintS !== undefined) cur.s = intv(S.ui.paintS,0);
  if(S.ui.paintBy !== null && S.ui.paintBy !== undefined) cur.by = S.ui.paintBy;
  S.grid.cells[id] = cur;
  painting.touched[id] = true;
  if(cur.s === 2 && !wasDone) painting.done.push(id);
  /* 쓸어내리는 동안 전체를 다시 그리면 끊긴다. 만진 칸만 직접 고친다. */
  el.className = 'gcell s'+(cur.s||0);
  el.setAttribute('aria-label', id+' '+CELL_ST[cur.s||0]+(cur.by?' 담당 '+cur.by:' 담당 없음'));
  var byEl = el.querySelector('.by');
  if(cur.by){
    if(byEl) byEl.textContent = cur.by;
    else { var sp=document.createElement('span'); sp.className='by'; sp.textContent=cur.by; el.appendChild(sp); }
  }else if(byEl) byEl.remove();
}
function finishPaint(){
  if(!painting) return;
  var p = painting; painting = null;
  var ids = Object.keys(p.touched); if(!ids.length) return;
  ids.sort();
  var done = p.done.slice().sort();
  var correctedDone=ids.filter(function(id){
    var before=p.before[id],after=S.grid.cells[id]||{s:0,by:''};
    return before&&before.s===2&&(after.s!==2||(before.by||'')!==(after.by||''));
  });
  /* 한 번의 쓸기는 무전 한 건이다. 칸마다 기록을 남기면 활동일지가 넘친다.
     이미 완료였던 칸은 세지 않으므로 같은 구역을 다시 칠해도 중복 기록이 생기지 않는다. */
  var sweepEventId = null;
  if(done.length||correctedDone.length){
    if(!requireEventSlots(1,'구역 완료 쓸기')){
      restorePaintCells(p.before);renderGridAll();
      mapMsg('이벤트 한도로 쓸기를 적용하지 않았습니다.','warn');return false;
    }
    var eventIndex=S.events.length;
    var evType=done.length?'zone':'correction';
    var evZone=(done[0]||correctedDone[0]||'');
    var evText=done.length
      ? done.join(', ')+' 구역 수색완료'
      : correctedDone.join(', ')+' 완료 구역 상태·담당 변경';
    var zoneStates={};ids.forEach(function(k){zoneStates[k]=(S.grid.cells[k]||{s:0}).s;});
    if(!addEvent(evType,evText,evZone,true,undefined,{stateAction:'zoneState',zoneStates:zoneStates})){
      restorePaintCells(p.before);renderGridAll();return false;
    }
    sweepEventId = S.events[eventIndex].id;
  }
  /* 쓸기 한 번은 여섯 칸을 한꺼번에 바꾼다. 잘못 지나가면 원래 값이 뭐였는지
     기억해야 되돌릴 수 있는데, 무전을 들으면서 그럴 여유는 없다. 직전 한 번만 보관한다. */
  var previousSweep=lastSweep;
  lastSweep = { before:p.before, eventId:sweepEventId, count:ids.length, at:Date.now() };
  /* 방금 칠한 칸을 빠른기록 구역에 물려준다. 이미 입력해 둔 값은 건드리지 않는다.
     commit() 이 조작 패널을 다시 그리므로 그 전에 넣어야 화면에 반영된다. */
  if(!String(quickEv.zone||'').trim()){ quickEv.zone = ids[0]; }
  if(!commit()){
    lastSweep=(epochCurrent()&&ownsEditorLock())?previousSweep:null;
    renderAll();mapMsg('쓸기 내용을 저장하지 못해 이전 상태로 되돌렸습니다.','err');
    return false;
  }
  return true;
}
function undoSweep(){
  if(!ensureEditor()) return false;
  if(!lastSweep){ mapMsg('되돌릴 쓸기가 없습니다.','warn'); return false; }
  if(!requireEventSlots(1,'직전 쓸기 취소'))return false;
  var rec = lastSweep; lastSweep = null;
  var ids = Object.keys(rec.before).sort();
  /* 원래 없던 칸은 없던 대로 되돌린다. 빈 칸을 만들어 두면 저장만 커진다. */
  restorePaintCells(rec.before);
  /* 취소된 완료 기록이 활동일지에 그대로 남으면 사실과 달라진다. 지우지 않고
     무효 처리하는 것이 이 앱의 기록 원칙이다(정정·취소와 같은 방식). */
  if(rec.eventId){
    S.events.forEach(function(e){
      if(e.id === rec.eventId && !e.voided){
        e.voided = true; e.voidedAt = Date.now(); e.voidReason = '쓸기 취소';
      }
    });
  }
  var restoredStates={};ids.forEach(function(k){restoredStates[k]=(S.grid.cells[k]||{s:0}).s;});
  addEvent('correction', ids.join(', ')+' 쓸기 취소 · 이전 상태로 되돌림', ids[0], true,undefined,{stateAction:'zoneState',zoneStates:restoredStates});
  if(!commit()){
    lastSweep=(epochCurrent()&&ownsEditorLock())?rec:null;
    renderAll();mapMsg('되돌리기 기록을 저장하지 못해 쓸기 상태를 유지했습니다.','err');
    return false;
  }
  mapMsg(ids.length+'칸을 되돌렸습니다.','ok');
  return true;
}
function paintTargetsSelected(){
  return (S.ui.paintS !== null && S.ui.paintS !== undefined)
      || (S.ui.paintBy !== null && S.ui.paintBy !== undefined);
}

function fitMapBox(host){
  var fit = host && host.querySelector('.mapfit'); if(!fit) return;
  var ar = (S.grid.hasMap && S.grid.mapW>0 && S.grid.mapH>0) ? S.grid.mapW/S.grid.mapH : 0;
  var touchEdit=host.classList.contains('cons-map')
    &&typeof matchMedia==='function'&&matchMedia('(pointer:coarse)').matches;
  if(touchEdit){
    var minW=gridCols()*44+4,minH=gridRows()*44+4;
    var tw=Math.max(host.clientWidth,minW),th=Math.max(host.clientHeight,minH);
    if(ar){th=tw/ar;if(th<minH){th=minH;tw=th*ar;}}
    var tws=tw.toFixed(1)+'px',ths=th.toFixed(1)+'px';
    if(fit.style.width!==tws||fit.style.height!==ths){fit.style.width=tws;fit.style.height=ths;}
    return;
  }
  if(!ar){
    if(fit.style.width!=='100%'){ fit.style.width='100%'; fit.style.height='100%'; }
    return;
  }
  /* 숨겨진 창·최소화된 표출 화면에서 그리면 크기가 0으로 읽힌다. 그때는 건너뛰고
     아래 1초 점검에서 다시 맞춘다. 값이 바뀔 때만 써서 레이아웃을 흔들지 않는다. */
  var W = host.clientWidth, H = host.clientHeight;
  if(!W || !H) return;
  var w = W, h = W/ar;
  if(h > H){ h = H; w = H*ar; }
  var ws = w.toFixed(1)+'px', hs = h.toFixed(1)+'px';
  if(fit.style.width !== ws || fit.style.height !== hs){ fit.style.width = ws; fit.style.height = hs; }
}
/* 컨테이너는 안전 카드 높이·창 크기·배율 슬라이더로 계속 변한다. 그때마다 다시 맞춘다. */
function observeMapFit(host){
  if(!host || host.__fitObserved || typeof ResizeObserver === 'undefined') return;
  host.__fitObserved = true;
  new ResizeObserver(function(){ fitMapBox(host); }).observe(host);
}

function buildGrid(host, interactive){
  var g = S.grid;
  var hadGridFocus=!!(interactive&&host.contains(document.activeElement));
  var html = '<div class="mapfit">';
  if(MAPDATA){
    var tf = geoOK() ? 'none' : 'scale('+(num(g.mapZoom,100)/100)+') translate('+num(g.mapX,0)+'%,'+num(g.mapY,0)+'%)';
    html += '<img class="mapimg" alt="" src="'+MAPDATA+'" style="opacity:'
          + num(g.mapOpacity,0.85) + ';transform:'+tf+'">';
  } else if(interactive){
    /* 표출 화면에는 운영요원용 안내문을 띄우지 않는다. 격자 뒤로 비쳐 읽히지도 않고,
       지휘부가 보는 화면에 조작 지시문이 남는다. 지도 미적용 여부는 카드 헤더로 알린다. */
    html += '<div class="mapnote">지도 이미지 없음<br>'
          + '여기에 카카오맵·네이버지도 캡처를 붙여넣으면('+esc(K_PASTE)+') 배경으로 깔립니다</div>';
  }
  var R = gridRows(), C = gridCols();
  var fm=/^([A-L])(\d{1,2})$/.exec(gridFocusId||'');
  if(!fm||fm[1].charCodeAt(0)-65>=R||parseInt(fm[2],10)>C)gridFocusId=cellId(0,0);
  html += '<div class="gridlayer" role="group" aria-label="수색구역 격자 '+R+'행 '+C+'열" '
        + 'style="grid-template-columns:repeat('+C
        + ',1fr);grid-template-rows:repeat('+R+',1fr)">';
  for(var r=0;r<R;r++){
    for(var c=0;c<C;c++){
      var id = cellId(r,c), cel = g.cells[id] || {s:0,by:''};
      var tag=interactive?'button':'div';
      /* role="gridcell" 은 role="grid" 부모 안에서만 유효하다. 표출 격자는 행 요소가
         없는 CSS grid 이므로, aria-label 이 이름으로 노출되는 role="img" 를 쓴다. */
      html += '<'+tag+(interactive?' type="button"':' role="img"')+' class="gcell s'+(cel.s||0)+'" data-cell="'+id+'"'
            + ' aria-label="'+id+' '+CELL_ST[cel.s||0]+(cel.by?' 담당 '+esc(cel.by):' 담당 없음')+'"'
            + (interactive ? ' title="선택된 동작 실행" tabindex="'+(id===gridFocusId?'0':'-1')+'"' : '')
            + '>'+id+(cel.by ? '<span class="by">'+esc(cel.by)+'</span>' : '')+'</'+tag+'>';
    }
  }
  html += '</div>';
  /* 이동 추정반경 + 핀 */
  var rad = moveRadiusKm(new Date());
  var mw = mapWidthMeters();
  if(g.pinLast && rad != null && rad > 0 && mw > 0){
    var pct = Math.min(400, (rad*1000) / mw * 100 * 2);  /* 지름 % (상한 400) */
    html += '<div class="rcircle" style="left:'+g.pinLast.x+'%;top:'+g.pinLast.y
          + '%;width:'+pct+'%;aspect-ratio:1"></div>';
  }
  /* 좌표가 보정돼 있으면 핀 라벨에 실제 위경도를 붙인다. 지휘부가 무전으로
     바로 읽어 지상팀 GPS 에 넘길 수 있어야 한다. */
  function pinLabel(txt, p){
    var c = geoOK() ? geoAt(p.x/100, p.y/100) : null;
    return txt + (c ? ' ' + fmtLatLon(c) : '');
  }
  if(g.pinLast) html += '<div class="pin last" style="left:'+g.pinLast.x+'%;top:'+g.pinLast.y
    + '%"><span class="plb">'+esc(pinLabel('최종목격', g.pinLast))
    + '</span><span class="pdot"></span><span class="stem"></span></div>';
  if(g.pinFound) html += '<div class="pin found" style="left:'+g.pinFound.x+'%;top:'+g.pinFound.y
    + '%"><span class="plb">'+esc(pinLabel('발견', g.pinFound))
    + '</span><span class="pdot"></span><span class="stem"></span></div>';
  if(interactive){
    ['ref1','ref2'].forEach(function(k,i){
      var rp = g[k]; if(!rp) return;
      html += '<div class="refpt" style="left:'+rp.x+'%;top:'+rp.y+'%">'+(i+1)+'</div>';
    });
  }
  html += '</div>';
  host.innerHTML = html;
  fitMapBox(host); observeMapFit(host);

  if(interactive){
    function setGridFocus(el,moveFocus){
      if(!el)return;
      gridFocusId=el.getAttribute('data-cell')||gridFocusId;
      host.querySelectorAll('.gcell').forEach(function(c){c.tabIndex=c===el?0:-1;});
      if(moveFocus)el.focus();
    }
    host.onfocusin=function(ev){
      var c=ev.target.closest&&ev.target.closest('.gcell');if(c&&host.contains(c))setGridFocus(c,false);
    };
    host.onkeydown=function(ev){
      if(!/^Arrow(Up|Down|Left|Right)$/.test(ev.key))return;
      var cur=ev.target.closest&&ev.target.closest('.gcell');if(!cur)return;
      var m=/^([A-L])(\d{1,2})$/.exec(cur.getAttribute('data-cell')||'');if(!m)return;
      var rr=m[1].charCodeAt(0)-65,cc=parseInt(m[2],10)-1;
      if(ev.key==='ArrowUp')rr--;else if(ev.key==='ArrowDown')rr++;
      else if(ev.key==='ArrowLeft')cc--;else cc++;
      rr=clamp(rr,0,R-1);cc=clamp(cc,0,C-1);
      var next=host.querySelector('[data-cell="'+cellId(rr,cc)+'"]');
      if(next){ev.preventDefault();setGridFocus(next,true);}
    };
    function cellUnder(ev){
      var el = document.elementFromPoint(ev.clientX, ev.clientY);
      var c = el && el.closest ? el.closest('.gcell') : null;
      return (c && host.contains(c)) ? c : null;
    }
    host.onpointerdown = function(ev){
      if(ev.button != null && ev.button !== 0) return;
      if(!ensureEditor()) return;
      /* 핀도 격자와 같은 좌표계여야 한다. 컨테이너 기준으로 찍으면 표출 화면에서
         다른 지점에 나타난다. */
      var fitEl = host.querySelector('.mapfit');
      var box = (fitEl || host).getBoundingClientRect();
      if(pinMode){
        var x = clamp((ev.clientX-box.left)/box.width*100, 0, 100);
        var y = clamp((ev.clientY-box.top)/box.height*100, 0, 100);
        if(pinMode === 'ref1' || pinMode === 'ref2'){
          /* 이미 입력해 둔 위경도는 살린다. 위치만 다시 찍는 경우가 많다. */
          var prev = S.grid[pinMode] || {};
          S.grid[pinMode] = {x:+x.toFixed(2), y:+y.toFixed(2),
            lat: prev.lat==null?null:prev.lat, lon: prev.lon==null?null:prev.lon};
        }else{
          S.grid[pinMode === 'last' ? 'pinLast' : 'pinFound'] = {x:+x.toFixed(1), y:+y.toFixed(1)};
        }
        pinMode = null; commit(); return;
      }
      var cellEl = cellUnder(ev); if(!cellEl) return;
      if(!paintTargetsSelected()){ mapMsg('칠할 항목을 먼저 고르세요 (상태 또는 담당).','warn'); return; }
      ev.preventDefault();
      painting = {touched:{}, done:[], before:{}};
      paintCell(cellEl);
      try{ host.setPointerCapture(ev.pointerId); }catch(e){}
    };
    host.onpointermove = function(ev){
      if(!painting) return;
      var el = cellUnder(ev); if(el) paintCell(el);
    };
    host.onpointerup = host.onpointercancel = function(ev){
      if(!painting) return;
      try{ host.releasePointerCapture(ev.pointerId); }catch(e){}
      finishPaint();
    };
    /* 키보드(Enter·Space)는 포인터 없이 click 만 발생한다(detail 0). 그 경로만 여기서 받는다. */
    host.onclick = function(ev){
      if(ev.detail !== 0) return;
      if(!ensureEditor()) return;
      var cellEl = ev.target.closest ? ev.target.closest('.gcell') : null; if(!cellEl) return;
      if(!paintTargetsSelected()){ mapMsg('칠할 항목을 먼저 고르세요 (상태 또는 담당).','warn'); return; }
      var id = cellEl.getAttribute('data-cell');
      painting = {touched:{}, done:[], before:{}};
      paintCell(cellEl); finishPaint();
      setTimeout(function(){var nn=document.querySelector('#consMap [data-cell="'+id+'"]');if(nn)nn.focus();},0);
    };
    if(hadGridFocus)setTimeout(function(){setGridFocus(host.querySelector('[data-cell="'+gridFocusId+'"]'),true);},0);
  }
}
function renderGridAll(){
  if(MODE === 'display' || !$('board').hidden) buildGrid($('mapWrap'), false);
  var cm = $('consMap'); if(cm) buildGrid(cm,ownsEditorLock());
}
function renderGridStats(){
  var st = gridStats(), n = st.n, T = Math.max(1, st.total);
  $('covPct').textContent = st.pct;
  $('cnt0').textContent = n[0]; $('cnt1').textContent = n[1];
  $('cnt2').textContent = n[2]; $('cnt3').textContent = n[3];
  $('covBar').innerHTML =
      '<i class="done" style="width:'+(n[2]/T*100)+'%"></i>'
    + '<i class="doing" style="width:'+(n[1]/T*100)+'%"></i>'
    + '<i class="re" style="width:'+(n[3]/T*100)+'%"></i>';
  var rad = moveRadiusKm(new Date());
  $('radChip').innerHTML = rad == null
    ? '<span class="rl">이동 추정반경<br>실종시각 미입력</span>'
    : '<span class="rl">이동 추정반경<br>보행 '+num(S.subject.walkSpeed,2)+'km/h · 계수 '+num(S.subject.decay,0.35)
      + '</span><span class="rv num">'+rad.toFixed(1)+'<small>km</small></span>';
  $('gridMeta').innerHTML = gridRows()+'×'+gridCols()+' = <b>'+st.total+'</b> 구역'
    + ' · 완료 <b>'+n[2]+'</b> · 지도폭 '+Math.round(mapWidthMeters())+'m'
    + (geoOK()?' · 좌표 <b>보정됨</b>':' · 좌표 미보정')
    + (S.grid.hasMap?'':' · <b>지도 미적용</b>');
}

function renderSafety(){
  var sf = S.safety, w = S.weather, ws=weatherStatus(new Date());
  var windLimit=sanSafetyLimit(sf.windLimit,40,null),gustLimit=sanSafetyLimit(sf.gustLimit,60,null);
  function cell(lb, val, lv, wide, full){
    var attrs=wide?' title="'+esc(full||'')+'" aria-label="'+esc(lb+': '+(full||''))+'"':'';
    return '<div class="sf '+(lv||'')+(wide?' wide':'')+'"'+attrs+'><div class="sl">'+lb+'</div>'
      + '<div class="sv">'+val+'</div></div>';
  }
  var apText = {unknown:'미확인',none:'미신청', pending:'신청중', done:'승인완료', na:'해당없음'}[sf.approval] || '미확인';
  var apLv   = {unknown:'warn',none:'warn', pending:'warn', done:'ok', na:''}[sf.approval] || 'warn';
  var html = '<div class="safety-row">'
    + cell('유인기 진입', sf.manned ? '진입 · 즉시착륙' : '없음', sf.manned ? 'danger' : 'ok')
    + cell('비행승인', apText, apLv)
    + cell('야간 특별승인', sf.nightApproval ? '보유' : '없음', sf.nightApproval ? 'ok' : 'warn')
    + cell('관제권/금지구역',
        (sf.ctrlZone ? '관제권' : '') + (sf.noFly ? (sf.ctrlZone?' + ':'')+'금지구역' : '')
        || '해당없음',
        (sf.noFly ? 'danger' : (sf.ctrlZone ? 'warn' : 'ok')))
    + cell('인접기관 동시운용', esc(sf.agencies || '없음'), sf.agencies ? 'warn' : '', true, sf.agencies || '없음')
    + '</div>'
    + '<div class="wx">'
    + cell('풍속', (w.wind==null?'—':w.wind+' m/s'),
        !ws.ok||windLimit===null?'warn':((w.wind!=null && w.wind >= windLimit) ? 'danger'
        : (w.wind!=null && w.wind >= windLimit*0.8-1e-9 ? 'warn' : 'ok')))
    + cell('돌풍', (w.gust==null?'—':w.gust+' m/s'),
        !ws.ok||gustLimit===null?'warn':((w.gust!=null && w.gust >= gustLimit) ? 'danger'
        : (w.gust!=null && w.gust >= gustLimit*0.8-1e-9 ? 'warn' : 'ok')))
    + cell('기온', (w.temp==null?'—':w.temp+' °C'), '')
    + cell('강수', w.rain===null?'미확인':(w.rain?'있음':(w.precip==null?'없음':w.precip+'%')),
        !ws.ok?'warn':(w.rain ? 'danger' : (w.precip!=null && w.precip>=60 ? 'warn' : 'ok')))

    + '</div>';

    : '기상 미입력'+(w.error?' · '+w.error:'');
}

function batteryStamp(d,now){
  var at=num(d.batteryUpdatedAt,0),time=now||Date.now();
  if(!at||at>time+5000)return '배터리 수동 입력 · 확인시각 없음';
  var minutes=Math.max(0,Math.floor((time-at)/60000));
  return '배터리 수동 입력 · '+(minutes===0?'방금':minutes+'분 전')+' 확인';
}

/* 비행시간·잔여추정만 1초 주기로 갱신(목록 전체를 다시 그리지 않는다) */
function tickDrones(){
  var now = Date.now();
  var nodes = document.querySelectorAll('.drone');
  for(var i=0;i<nodes.length;i++){
    var el = nodes[i], id = el.getAttribute('data-id');
    var d = null;
    for(var j=0;j<S.drones.length;j++) if(S.drones[j].id === id) d = S.drones[j];
    if(!d) continue;
    var stamp=el.querySelector('.battery-stamp'),stampText=batteryStamp(d,now);
    if(stamp&&stamp.textContent!==stampText)stamp.textContent=stampText;
    var t = tms(d.tookOffAt);
    var elEl = el.querySelector('.d-el'), rmEl = el.querySelector('.d-rm');
    if((d.status==='flying'||d.status==='commloss')&&t){
      elEl.textContent = durMS(now - t);
      rmEl.textContent = '~'+droneRemainMin(d)+'분';
    } else {
      elEl.textContent = '—';
      rmEl.textContent = d.status === 'charging' ? '충전' : '—';
    }
  }
}

/* ==========================================================================
   S7. 경보 (발견 / 유인기 진입) · 비프음은 외부 음원 없이 코드로 생성
   ========================================================================== */
var audioCtx = null, lastBeepFor = 0, AUDIO_ARMED=false, bannerKey='';
function updateAudioArm(){ var b=$('audioArm'); if(b)b.hidden=MODE!=='display'||AUDIO_ARMED; }
function primeAudio(){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var p=audioCtx.resume();
    Promise.resolve(p).then(function(){AUDIO_ARMED=audioCtx.state==='running';updateAudioArm();if(AUDIO_ARMED)beep(1);renderBanner();});
  }catch(e){AUDIO_ARMED=false;updateAudioArm();}
}
function beep(times){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state!=='running'){AUDIO_ARMED=false;updateAudioArm();return false;}
    var t0 = audioCtx.currentTime;
    for(var i=0;i<(times||3);i++){
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type='square'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t0+i*0.36);
      g.gain.exponentialRampToValueAtTime(0.22, t0+i*0.36+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+i*0.36+0.28);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0+i*0.36); o.stop(t0+i*0.36+0.3);
    }
    return true;
  }catch(e){AUDIO_ARMED=false;updateAudioArm();return false;}
}
/* 경보 대상은 "가장 늦게 기록된" 발견이다. 사건 발생시각(t) 기준으로 고르면
   과거 시각으로 소급 입력한 발견이 이미 확인 처리된 기록에 가려 경보가 나가지 않는다.
   recordedAt 은 기록 시점의 Date.now() 라 새 기록일수록 항상 커진다. */
function foundAlarmKey(e){ return num(e.recordedAt, num(e.t,0)); }
function latestFound(){
  var best = null;
  S.events.forEach(function(e){
    if(e.type==='found'&&!e.voided&&(!best||foundAlarmKey(e)>foundAlarmKey(best)))best=e;
  });
  return best;
}
/* renderBanner 는 1초 렌더 루프에 들어 있다. 매초 innerHTML 을 갈아끼우면
   "확인" 버튼이 누르는 순간 사라져 클릭이 유실되고 CSS 애니메이션도 매초 리셋된다.
   내용이 실제로 바뀌었을 때만 다시 그린다. */
/* 배너는 fixed 라 헤더(골든타임·일몰·비행 판정·시계) 위에 그대로 겹친다.
   발견·유인기 경보가 뜬 순간 지휘부에게 가장 필요한 숫자들이므로 그만큼 판을 내린다. */
function setBoardOffset(bn, shown){
  var bd = $('board'); if(!bd) return;
  bd.style.paddingTop = shown ? (bn.offsetHeight + 10) + 'px' : '';
}
function renderBanner(){
  var bn = $('alertBanner'); if(!bn) return;
  if(S.safety.manned){
    if(bannerKey!=='manned'){
      bannerKey='manned';
      bn.className = 'alert-banner manned';
      /* U+26A0 는 변이 선택자가 없으면 플랫폼에 따라 컬러 이모지로 렌더돼
         지휘 화면에서 장난감처럼 보인다. U+FE0E 로 흑백 글리프를 강제한다. */
      bn.innerHTML = '<span class="ab-k">\u26A0\uFE0E 유인기 진입</span>'
        + '<span class="ab-x">전 기체 즉시 착륙 · 공역 분리 유지</span>';
      bn.hidden = false;
    }
    setBoardOffset(bn, true);
    if(MODE==='display'&&lastBeepFor!==-1&&beep(4))lastBeepFor=-1;
    return;
  }
  var f = latestFound();
  var alarmKey=f&&foundAlarmKey(f);
  if(f && S.ui.ackFound < alarmKey){
    var key='found:'+alarmKey+':'+f.zone+':'+f.text;
    if(bannerKey!==key){
      bannerKey=key;
      bn.className = 'alert-banner';
      bn.innerHTML = '<span class="ab-k">발견</span>'
        + '<span class="ab-x">'+(f.zone?'['+esc(f.zone)+'] ':'')+esc(f.text)+'</span>'
        + '<button type="button" id="ackBtn">확인</button>';
      bn.hidden = false;
      $('ackBtn').onclick = function(){
        if(ownsEditorLock()){S.ui.ackFound=alarmKey;commit();return;}
        if(sendPeer({type:'action',action:'ackFound',t:alarmKey}))return;
        /* 창 핸들이 끊기면(상단 "표출 화면 미연결") 이 버튼은 아무 일도 하지 못한다.
           조용히 실패하면 눌렀는데 경보가 그대로인 상태가 되므로 이유를 남긴다.
           대형 스크린 앞에서 alert 를 띄우면 화면이 막히므로 버튼 안에 적는다. */
        var b=$('ackBtn'); if(!b)return;
        b.textContent='조작 패널에서 확인하세요';
        setTimeout(function(){ if($('ackBtn')===b) b.textContent='확인'; },6000);
      };
    }
    setBoardOffset(bn, true);
    if(MODE==='display'&&lastBeepFor!==alarmKey&&beep(5))lastBeepFor=alarmKey;
    return;
  }
  if(bannerKey!==''){ bannerKey=''; bn.hidden = true; bn.innerHTML=''; setBoardOffset(bn, false); }
  if(lastBeepFor === -1) lastBeepFor = 0;
}

function requireEventSlots(count,action,emergency){
  if(emergency)return true;
  count=Math.max(1,intv(count,1));
  if(ordinaryEventCount()+count<=MAX_EVENTS)return true;
  alert('일반 이벤트 '+MAX_EVENTS+'건 한도로 '+(action||'이 작업')+'을 처리할 수 없습니다. JSON을 내보낸 뒤 새 상황으로 시작하세요. 유인기 긴급 경보는 별도 기록으로 계속 사용할 수 있습니다.');
  return false;
}
function addEvent(type, text, zone, silentCommit, eventTime, metadata){
  var meta=normalizeEventMeta(metadata,S.grid.generation||'legacy-grid');
  if(type==='zone'&&!Object.keys(meta.zoneStates).length){
    String(zone||'').toUpperCase().split(/[\s,]+/).forEach(function(k){
      if(/^[A-L](?:[1-9]|1[0-2])$/.test(k))meta.zoneStates[k]=2;
    });
  }
  if(!requireEventSlots(1,'기록 추가',meta.emergency))return false;
  var tm=eventTime instanceof Date?eventTime.getTime():num(eventTime,Date.now());
  S.events.push(Object.assign({id:uid(),t:tm,recordedAt:Date.now(),type:type,text:text||'',zone:zone||'',voided:false,voidedAt:0,voidReason:''},meta));
  if(!silentCommit) return commit();
  return true;
}
function setMannedAlert(next){
  if(!ensureEditor())return false;
  next=!!next;if(S.safety.manned===next)return true;
  S.safety.manned=next;
  addEvent('accident',next?'유인기 진입 · 전 기체 즉시 착륙 지시':'유인기 이탈 · 다른 비행조건 재확인 필요','',true,undefined,
    {entityType:'safety',entityId:'manned',stateAction:next?'mannedEnter':'mannedLeave',emergency:true});
  lastBeepFor=0;
  var saved=commit();
  if(!saved)alert('유인기 경보 변경을 저장·전달하지 못했습니다. 화면 상태를 확인하고 무전 등 현장 연락수단으로 즉시 알리세요.');
  return saved;
}
function emergencyHistoryNotice(){
  var n=S.events.length-ordinaryEventCount();
  if(n<EMERGENCY_EVENT_RESERVE)return '';
  return '<div class="warn-strip danger" role="status">긴급 기록 '+n+'건 · 예약 기준 '+EMERGENCY_EVENT_RESERVE+'건에 도달했습니다. '
    +'긴급 경보와 기록은 계속 보존합니다. 저장공간이 부족해지기 전에 JSON을 내보내고 새 상황으로 전환하세요.</div>';
}
function handlePeerAction(m){
  if(!m||!ownsEditorLock())return;
  if(m.action==='ackFound'){S.ui.ackFound=Math.max(num(S.ui.ackFound,0),num(m.t,0));commit();}
  else if(m.action==='scale'){
    S.ui.scale=clamp(num(S.ui.scale,1)+clamp(num(m.delta,0),-0.1,0.1),0.75,1.5);commit();
  }
}

/* ==========================================================================
   S9. 조작 패널
   입력 필드는 data-path 로 상태 경로를 가리킨다. 예: data-path="mission.title"
   ========================================================================== */
function getPath(path){
  var parts = path.split('.'), o = S;
  for(var i=0;i<parts.length;i++){ if(o==null) return undefined; o = o[parts[i]]; }
  return o;
}
function setPath(path, val){
  var parts = path.split('.'), o = S;
  for(var i=0;i<parts.length-1;i++){
    if(o[parts[i]] == null) o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length-1]] = val;
}
function fld(label, path, type, attrs){
  var v = getPath(path);
  var a = attrs || '';
  if(type === 'checkbox'){
    return '<label class="chkline"><input type="checkbox" data-path="'+path+'"'
      + (v?' checked':'')+'> '+label+'</label>';
  }
  if(type === 'textarea'){
    return '<label class="f"><span>'+label+'</span><textarea data-path="'+path+'" '+a+'>'
      + esc(v==null?'':v)+'</textarea></label>';
  }
  return '<label class="f"><span>'+label+'</span><input type="'+(type||'text')
    + '" data-path="'+path+'" value="'+esc(v==null?'':v)+'" '+a+'></label>';
}
function sel(label, path, opts){
  var v = getPath(path);
  var o = opts.map(function(p){
    return '<option value="'+esc(p[0])+'"'+(String(v)===String(p[0])?' selected':'')+'>'+esc(p[1])+'</option>';
  }).join('');
  return '<label class="f"><span>'+label+'</span><select data-path="'+path+'">'+o+'</select></label>';
}

/* 조작 패널은 모드에 따라 스크롤 주체가 다르다.
   console 모드는 문서가, 드로어(Ctrl+E)는 겹쳐 열린 패널이 스크롤된다.
   상단 바 높이는 칩 줄바꿈에 따라 달라지므로 고정값 대신 그때그때 잰다. */
function scrollHost(el){
  var p=el.parentNode;
  while(p&&p.nodeType===1){
    /* body 의 overflow-y:auto 는 뷰포트로 전파되므로 computed 값은 auto 인데
       body.scrollTo() 는 아무 일도 하지 않는다. 여기까지 오면 문서 스크롤이다. */
    if(p===document.body||p===document.documentElement) break;
    var ov=getComputedStyle(p).overflowY;
    if((ov==='auto'||ov==='scroll')&&p.scrollHeight>p.clientHeight+1) return p;
    p=p.parentNode;
  }
  return null;
}
/* 부드러운 스크롤은 쓰지 않는다. 4,000px 이동에 1초 가까이 걸려 그동안 조작이 막히고,
   모션 축소 설정이나 애니메이션을 지원하지 않는 환경에서는 아예 이동하지 않는다. */
/* 조작 패널 재렌더 타이밍
   change 는 버튼을 누르는 mousedown(blur) 시점에 발생한다. 그 자리에서 패널을 다시
   그리면 mouseup 이 교체된 DOM 위에서 일어나 click 이 성립하지 않는다.
   현장에서는 "입력하고 나서 누른 첫 버튼이 안 먹는다"로 나타난다.
   그래서 change 에서는 저장·표출 갱신만 하고, 패널은 포인터가 떨어진 뒤에 그린다. */
var pointerHeld = false;
document.addEventListener('pointerdown',   function(){ pointerHeld = true;  }, true);
document.addEventListener('pointerup',     function(){ pointerHeld = false; }, true);
document.addEventListener('pointercancel', function(){ pointerHeld = false; }, true);
var consoleIdleTimer = null;
function scheduleConsoleRefresh(root){
  if(consoleIdleTimer) clearTimeout(consoleIdleTimer);
  consoleIdleTimer = setTimeout(function(){
    consoleIdleTimer = null;

   ['crew','인원 관리','투입 · 교대 종료 · 역할'],
   ['data','화면 설정 · 데이터 관리','표출 배율 · 보관 파일 · 내보내기 · 복구']].forEach(function(p){

      +'<div class="row-tools"><button class="btn" data-act="nav" data-sec="sec-mission">상황·좌표 입력</button>'
      +'<button class="btn" data-act="nav" data-sec="sec-subject">실종자 정보 입력</button></div>';

function scrollToSection(root,target){
  for(var parent=target.parentElement;parent&&parent!==root;parent=parent.parentElement){
    if(parent.tagName==='DETAILS'){parent.open=true;if(parent.dataset.fold)consoleFolds[parent.dataset.fold]=true;}
  }
  var bar=root.querySelector('.cons-top');
  var pad=(bar&&getComputedStyle(bar).position==='sticky'?bar.getBoundingClientRect().height:0)+10;
  var host=scrollHost(target), tTop=target.getBoundingClientRect().top;
  if(host) host.scrollTop=Math.max(0,host.scrollTop+tTop-host.getBoundingClientRect().top-pad);
  else window.scrollTo(0,Math.max(0,window.scrollY+tTop-pad));
  var heading=target.querySelector('h2');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}
  root.querySelectorAll('.ct-nav button').forEach(function(b){
    if(b.getAttribute('data-sec')===target.id)b.setAttribute('aria-current','location');else b.removeAttribute('aria-current');
  });

function renderConsole(root){
  if(!root) return;
  if(consoleIdleTimer){ clearTimeout(consoleIdleTimer); consoleIdleTimer = null; }
  var scrollTop = root.scrollTop;
  var activeEl=document.activeElement,focusInside=!!(activeEl&&root.contains(activeEl));
  var focusPath = focusInside&&activeEl.getAttribute?activeEl.getAttribute('data-path'):null;
  var focusId=focusInside&&activeEl.id?activeEl.id:'';
  var focusAct=focusInside&&activeEl.getAttribute?activeEl.getAttribute('data-act'):null;
  var focusSelStart = null;
  if(focusPath && document.activeElement.selectionStart != null)
    focusSelStart = document.activeElement.selectionStart;

  root.querySelectorAll('details[data-fold]').forEach(function(fold){consoleFolds[fold.dataset.fold]=fold.open;});
  root.innerHTML = consoleHtml();
  organizeConsole(root);
  root.hidden = false;
  bindConsole(root);
  renderGridAll();

  root.scrollTop = scrollTop;
  var back=focusPath?root.querySelector('[data-path="'+focusPath+'"]'):null;
  if(!back&&focusId)back=root.querySelector('#'+(typeof CSS!=='undefined'&&CSS.escape?CSS.escape(focusId):focusId));
  if(!back&&focusAct)back=root.querySelector('[data-act="'+focusAct+'"]');
  if(back){
    back.focus();
    try{if(focusSelStart!=null)back.setSelectionRange(focusSelStart,focusSelStart);}catch(e){}
  }else if(focusInside&&!$('drawer').hidden&&$('drawer').contains(root)){
    var close=root.querySelector('#btnCloseDrawer');if(close)close.focus();
  }
}

/* --------------------------------------------------------------------------
   기록 ↔ 상태 불일치
   빠른기록으로 남긴 이륙·착륙·구역완료·인원교대는 타임라인에만 들어가고
   기체·격자·인원 상태를 바꾸지 않는다. 자동으로 바꾸면 오기록이 곧바로 상황판에
   퍼지므로, 어긋난 곳을 찾아 보여주고 반영은 운영요원이 직접 누르게 한다.
   새 기록은 기체·인원 ID로 연결하며, 구버전 본문은 정확한 이름이 하나만 일치할 때 연결한다.
   -------------------------------------------------------------------------- */
function legacyEventEntity(e,kind){
  var list=kind==='drone'?S.drones:S.crew,found=[];
  list.forEach(function(item){
    var name=String(item.name||'').trim();if(!name)return;
    var txt=String(e.text||''),at=-1,matched=false;
    while((at=txt.indexOf(name,at+1))>=0){
      var before=at?txt.charAt(at-1):'',after=txt.charAt(at+name.length);
      if(!/[0-9A-Za-z가-힣]/.test(before)&&!/[0-9A-Za-z가-힣]/.test(after)){matched=true;break;}
    }
    if(matched)found.push(item.id);
  });
  return found.length===1?found[0]:'';
}
function eventTargetsEntity(e,kind,id){
  if(e.entityType||e.entityId)return e.entityType===kind&&e.entityId===id;
  return legacyEventEntity(e,kind)===id;
}
function eventZoneStates(e){
  if((e.gridGeneration||'legacy-grid')!==(S.grid.generation||'legacy-grid'))return {};
  if(e.zoneStates&&Object.keys(e.zoneStates).length)return e.zoneStates;
  var states={},isDone=e.type==='zone';
  var isReset=e.type==='correction'&&/(완료 구역 상태·담당 변경|쓸기 취소)/.test(e.text||'');
  if(!isDone&&!isReset)return states;
  var ids=String(e.zone||'').toUpperCase().match(/\b[A-L](?:1[0-2]|[1-9])\b/g)||[];
  /* 구버전 쓸기 기록은 본문에 여러 칸을 담고 zone 에는 첫 칸만 저장했다. */
  var listed=String(e.text||'').match(/^(?:[A-L](?:1[0-2]|[1-9])(?:,\s*|\s+(?=구역|완료|쓸기)))+/);
  if(listed)ids=ids.concat(listed[0].match(/[A-L](?:1[0-2]|[1-9])/g)||[]);
  ids.forEach(function(id){states[id]=isDone?2:0;});return states;
}
function stateMismatches(){
  var out=[],events=S.events.filter(function(e){return !e.voided;}).sort(function(a,b){
    return a.t-b.t||num(a.recordedAt,a.t)-num(b.recordedAt,b.t);
  }),zoneLast={};
  events.forEach(function(e){
    var states=eventZoneStates(e);Object.keys(states).forEach(function(id){zoneLast[id]={event:e,state:states[id]};});
  });
  Object.keys(zoneLast).forEach(function(id){
    var rec=zoneLast[id],s=(S.grid.cells[id]||{}).s||0;
    if(rec.state===2&&(s===0||s===1)&&id.charCodeAt(0)-65<gridRows()&&intv(id.slice(1),0)<=gridCols())out.push({kind:'zone',ref:id,t:rec.event.t,
      generation:S.grid.generation||'legacy-grid',text:id+' 구역완료 기록이 있으나 격자는 '+CELL_ST[s]+'입니다.',btn:id+' 완료로 반영'});
  });
  var droneLast={},crewLast={};
  events.forEach(function(e){
    var kind=(e.type==='takeoff'||e.type==='landing')?'drone'
      :(e.type==='crew'||e.stateAction==='crewResume'||(e.type==='correction'&&/교대 종료 취소/.test(e.text||'')))?'crew':'';
    if(!kind)return;
    var id=(e.entityType||e.entityId)?(e.entityType===kind?e.entityId:''):legacyEventEntity(e,kind);
    if(id)(kind==='drone'?droneLast:crewLast)[id]=e;
  });
  S.drones.forEach(function(d){
    var last=droneLast[d.id];if(!last)return;var air=d.status==='flying'||d.status==='commloss';
    if(last.type==='takeoff'&&!air)out.push({kind:'takeoff',ref:d.id,t:last.t,
      text:d.name+' 이륙 기록 이후 상태가 '+(DRONE_ST[d.status]||d.status)+'입니다.',btn:d.name+' 비행중으로'});
    if(last.type==='landing'&&air)out.push({kind:'landing',ref:d.id,t:last.t,
      text:d.name+' 착륙 기록 이후에도 상태가 '+(DRONE_ST[d.status]||d.status)+'입니다.',btn:d.name+' 배터리교체로'});
  });
  S.crew.forEach(function(c){
    var last=crewLast[c.id];
    if(!c.outAt&&last&&last.type==='crew'&&(!tms(c.inAt)||last.t>=tms(c.inAt)))out.push({kind:'crew',ref:c.id,t:last.t,
      text:c.name+' 교대 종료 기록이 있으나 종료시각이 비어 있습니다.',btn:c.name+' 교대 종료'});
  });
  out.sort(function(a,b){return b.t-a.t;});return out.slice(0,6);
}
/* 반영은 원래 기록을 한 번 더 남기지 않고 '정정'으로만 이력을 남긴다.
   같은 사건이 이륙 2건으로 보이면 활동일지가 사실과 달라진다. */
function syncFromRecord(kind, ref, evTime, generation){
  if(!requireEventSlots(1,'기록에 맞춘 상태 반영'))return false;
  var i, d=null, c=null;
  if(kind==='zone'){
    if(generation&&generation!==(S.grid.generation||'legacy-grid')){alert('격자 구성이 바뀌었습니다. 현재 기록을 다시 확인하세요.');return false;}
    var current=stateMismatches().some(function(x){return x.kind==='zone'&&x.ref===ref;});
    if(!current)return false;
    var cel=S.grid.cells[ref]||{s:0,by:''}; cel.s=2; S.grid.cells[ref]=cel;
    var zoneStates={};zoneStates[ref]=2;
    return addEvent('correction','기록에 맞춰 '+ref+' 구역을 완료로 반영',ref,true,undefined,{stateAction:'zoneState',zoneStates:zoneStates});
  }
  if(kind==='takeoff'||kind==='landing'){
    for(i=0;i<S.drones.length;i++) if(S.drones[i].id===ref) d=S.drones[i];
    if(!d) return false;
    if(kind==='takeoff'){
      /* 이륙시각은 반영을 누른 시각이 아니라 기록된 사건 시각이어야 비행시간이 맞다. */
      d.status='flying'; d.tookOffAt=localDateTime(new Date(num(evTime,Date.now())));
      d.sorties=intv(d.sorties,0)+1;
      return addEvent('correction',(d.name||'기체')+' 이륙 기록에 맞춰 상태를 비행중으로 반영',d.zone,true,undefined,{entityType:'drone',entityId:d.id});
    }
    d.status='swap'; d.tookOffAt='';
    return addEvent('correction',(d.name||'기체')+' 착륙 기록에 맞춰 상태를 배터리교체로 반영',d.zone,true,undefined,{entityType:'drone',entityId:d.id});
  }
  if(kind==='crew'){
    for(i=0;i<S.crew.length;i++) if(S.crew[i].id===ref) c=S.crew[i];
    if(!c) return false;
    var out=localDateTime(new Date(num(evTime,Date.now())));
    if(c.inAt&&tms(out)<tms(c.inAt)){
      alert('교대 기록 시각이 투입시각보다 빠릅니다. 투입시각을 먼저 확인하세요.'); return false;
    }
    c.outAt=out;
    return addEvent('correction',(c.name||'인원')+' 교대 종료 기록에 맞춰 종료시각을 반영','',true,undefined,{entityType:'crew',entityId:c.id});
  }
  return false;
}

function eventHistoryRows(){

      &&(eventHistory.status==='all'||(eventHistory.status==='voided'?e.voided:!e.voided))

  }).sort(function(a,b){return b.t-a.t||num(b.recordedAt,b.t)-num(a.recordedAt,a.t);});

    +(filtered.length?filtered.slice(start,start+EVENT_PAGE_SIZE).map(eventRowHtml).join(''):'<div class="note">조건에 맞는 기록이 없습니다.</div>')

function renderDisplayOnly(){
  if($('board').hidden) return;
  renderHeader(); renderSubject(); renderBatteries(); renderCrew();
  renderGridStats(); renderSafety(); renderDrones(); renderLog();
  renderTicker(); renderBanner();

/* 타이핑 중에는 조작 패널을 다시 그리지 않는다(포커스 유지) */
function commitLight(){
  if(applying) return;
  var sweepBefore=lastSweep;
  touch(); var ok=persist();
  if(ok){lastSeenUpdated=S.meta.updated;broadcast();applyUi();renderDisplayOnly();}
  else {rollbackStoredState();if(sweepBefore&&epochCurrent()&&ownsEditorLock())lastSweep=sweepBefore;renderAll();}
  return ok;
}

function setDroneStatus(d,next){
  if(!d||!Object.prototype.hasOwnProperty.call(DRONE_ST,next)||d.status===next)return false;
  var prev=d.status, wasAir=!!d.tookOffAt&&(prev==='flying'||prev==='commloss');
  /* 상태 변경은 반드시 타임라인에 남아야 한다. 이벤트 한도에 걸려 기록할 수 없다면
     상태만 조용히 바뀌는 일이 없도록 변경 자체를 거부한다. */
  if(!requireEventSlots(1,'기체 상태 변경'))return false;
  if(next==='flying'){
    if(!wasAir){d.tookOffAt=localDateTime(new Date());d.sorties=intv(d.sorties,0)+1;
      addEvent('takeoff',(d.name||'기체')+' 이륙'+(d.zone?' · '+d.zone+' 구역':''),d.zone,true,undefined,{entityType:'drone',entityId:d.id});}
    else addEvent('note',(d.name||'기체')+' 통신 복구 · 비행 상태 재확인',d.zone,true,undefined,{entityType:'drone',entityId:d.id});
  }else if(next==='commloss'){
    addEvent('accident',(d.name||'기체')+' 통신불량'+(wasAir?' · 비행 중':''),d.zone,true,undefined,{entityType:'drone',entityId:d.id});
  }else if(wasAir){
    d.tookOffAt=''; addEvent('landing',(d.name||'기체')+' 착륙 · '+(DRONE_ST[next]||next),d.zone,true,undefined,{entityType:'drone',entityId:d.id});
  }else addEvent('note',(d.name||'기체')+' 상태 변경: '+(DRONE_ST[prev]||prev)+' → '+(DRONE_ST[next]||next),d.zone,true,undefined,{entityType:'drone',entityId:d.id});
  d.status=next; return true;
}

function readInput(el){
  var t = el.getAttribute('type');
  if(t === 'checkbox') return el.checked;
  if(t === 'number' || t === 'range'){
    if(el.value === '') return null;
    return num(el.value, 0);
  }
  return el.value;
}
function bindConsole(root){
  /* 위임 리스너는 root 당 한 번만 붙인다 (재렌더 시 중복 누적 방지) */
  var first = !root.__delegated;
  root.__delegated = true;

  /* 입력 */
  if(first) root.addEventListener('input', function(ev){
    var el = ev.target, path = el.getAttribute && el.getAttribute('data-path');
    var draftKey=el.getAttribute&&el.getAttribute('data-grid-draft');
    if(draftKey){
      if(!ownsEditorLock()){renderConsole(root);return;}
      if(!gridDimensionsDraft||gridDimensionsDraft.generation!==S.grid.generation)
        gridDimensionsDraft={generation:S.grid.generation,rows:S.grid.rows,cols:S.grid.cols};
      gridDimensionsDraft[draftKey]=el.value;return;
    }
    if(!path) return;
    if(!ownsEditorLock()){renderConsole(root);return;}
    if(el.checkValidity&&!el.checkValidity()){
      el.classList.add('invalid'); setPath(path,null);
      var badBattery=path.match(/^drones\.(\d+)\.battery$/);
      if(badBattery&&S.drones[+badBattery[1]])S.drones[+badBattery[1]].batteryUpdatedAt=0;
      if(path==='mission.lat'||path==='mission.lon')invalidateSafetyContext();
      commitLight(); return;
    }
    el.classList.remove('invalid');
    var val=readInput(el);
    if(path==='weather.observedAt')val=tms(val);
    if(path==='weather.rain')val=val==='true'?true:(val==='false'?false:null);
    var co=path.match(/^crew\.(\d+)\.outAt$/);
    if(co&&val&&S.crew[+co[1]]&&S.crew[+co[1]].inAt&&tms(val)<tms(S.crew[+co[1]].inAt)){
      el.classList.add('invalid');return;
    }
    var sm=path.match(/^drones\.(\d+)\.status$/);
    if(sm){
      if(setDroneStatus(S.drones[+sm[1]],val)) commitLight();
      /* 변경이 거부됐으면(이벤트 한도 등) select 를 실제 상태로 되돌려야 한다. */
      scheduleConsoleRefresh(root);
      return;
    }
    setPath(path,val);
    var batteryInput=path.match(/^drones\.(\d+)\.battery$/);
    if(batteryInput&&S.drones[+batteryInput[1]])S.drones[+batteryInput[1]].batteryUpdatedAt=val===null?0:Date.now();
    if(path==='mission.lat'||path==='mission.lon'){invalidateSafetyContext();cancelWeatherRequest();}
    if(path==='weather.auto'&&!val)cancelWeatherRequest();
    if(/^weather\.(wind|gust|rain|temp|precip|observedAt)$/.test(path)){
      S.weather.src='manual';S.weather.auto=false;S.weather.confirmed=false;S.weather.confirmedAt=0;S.weather.error='';cancelWeatherRequest();
    }
    if(path.indexOf('grid.map') === 0 || path === 'grid.widthMeters'){ renderGridAll(); }
    commitLight();
  });
  if(first) root.addEventListener('change', function(ev){
    var el = ev.target;
    if(!(el.getAttribute && el.getAttribute('data-path'))) return;
    if(!ownsEditorLock()){renderConsole(root);return;}
    if(el.checkValidity&&!el.checkValidity()){el.reportValidity();return;}
    var path=el.getAttribute('data-path');
    if(/^crew\.\d+\.outAt$/.test(path)){
      var ci=+path.split('.')[1],c=S.crew[ci];
      if(c&&c.outAt&&c.inAt&&tms(c.outAt)<tms(c.inAt)){alert('종료시각은 투입시각보다 빠를 수 없습니다.');c.outAt='';renderConsole(root);return;}
    }
    /* commit() 은 renderAll -> renderConsole 로 DOM 을 교체해 지금 누르는 중인
       버튼의 click 을 없앤다. 저장·표출 갱신만 하고 패널은 뒤늦게 그린다. */
    commitLight();
    scheduleConsoleRefresh(root);
  });

  /* 표출 화면 열기 / 드로어 닫기 */
  var od = root.querySelector('#btnOpenDisplay');
  if(od) od.onclick = function(){
    var url = location.href.split('#')[0] + '#display';
    peer = window.open(url, 'stayup_display', 'width=1600,height=900');
    if(!peer){ alert('팝업이 차단되었습니다. 주소창의 팝업 차단을 허용해 주세요.'); return; }
    setTimeout(function(){
      broadcast();
      if(MAPDATA){ try{ peer.postMessage({ch:'stayup',type:'map',data:MAPDATA},PEER_ORIGIN); }catch(e){} }
      renderConsole(MODE==='console' ? $('consoleRoot') : $('drawerIn'));
    }, 700);
  };
  var cd = root.querySelector('#btnCloseDrawer');
  if(cd) cd.onclick = closeDrawer;

  /* 유인기 경보 */
  var mb = root.querySelector('#btnManned');
  if(mb) mb.onclick = function(){
    setMannedAlert(!S.safety.manned);
  };

  /* 이벤트 기록 */
  /* 입력하는 즉시 밖에 보관해야 재렌더로 지워지지 않는다.
     발생시각은 손대기 전까지 "자동"이며, 자동인 동안에는 제출 순간의 현재 시각을 쓴다.
     그래야 입력줄을 오래 열어둔 뒤 기록해도 렌더 시각이 아닌 실제 시각이 남는다. */
  function bindQuick(id, key, upper){
    var el = root.querySelector('#'+id); if(!el) return;
    el.oninput = el.onchange = function(){
      quickEv[key] = upper ? el.value.toUpperCase() : el.value;
      if(key === 'time') quickEv.timeAuto = false;
      if(key === 'type'){var wrap=root.querySelector('#evEntityWrap');if(wrap){wrap.innerHTML=quickEntityHtml();bindQuickEntity(root);}}
      if(key === 'zone'){
        var g = root.querySelector('#cellGeo');
        if(g) g.textContent = cellGeoLabel();
      }
    };
  }
  bindQuick('evType','type'); bindQuick('evZone','zone',true); bindQuick('evText','text');
  bindQuick('evTime','time');bindQuickEntity(root);bindEventHistory(root);
  if(!quickEv.type){ var ty=root.querySelector('#evType'); if(ty) quickEv.type=ty.value; }

  function pushEv(){
    if(!ensureEditor())return;
    var t = quickEv.type || 'note';
    var when = quickEv.timeAuto ? Date.now() : tms(quickEv.time);
    var z = (quickEv.zone||'').trim().toUpperCase();
    var x = (quickEv.text||'').trim();
    var kind=quickEntityKind(),entity=null,metadata={};
    if(kind){
      (kind==='drone'?S.drones:S.crew).forEach(function(item){if(item.id===quickEv.entityId)entity=item;});
      if(!entity){alert(kind==='drone'?'기록 대상 기체를 선택하세요.':'기록 대상 인원을 선택하세요.');return;}
      metadata.entityType=kind;metadata.entityId=entity.id;
      if(!x)x=(entity.name||'대상')+' '+(t==='crew'?'교대 종료':EV_TYPE[t]);
    }
    if(!x && !z){ return; }
    if(!when){alert('사건 발생시각을 확인하세요.');return;}
    if(when>Date.now()+5*60000){alert('사건 발생시각이 현재보다 5분 이상 미래입니다.');return;}
    if(t==='zone'){
      var ids=z.split(/[\s,]+/).filter(Boolean),valid=ids.length&&ids.every(function(id){return /^[A-L](?:1[0-2]|[1-9])$/.test(id)&&id.charCodeAt(0)-65<gridRows()&&intv(id.slice(1),0)<=gridCols();});
      if(!valid){alert('현재 격자의 구역을 입력하세요. 여러 구역은 A1, A2처럼 쉼표로 나눕니다.');return;}
      metadata.zoneStates={};ids.forEach(function(id){metadata.zoneStates[id]=2;});
    }
    if(!addEvent(t,x||EV_TYPE[t],z,false,when,metadata))return;
    quickEv.zone=''; quickEv.text=''; quickEv.time=''; quickEv.timeAuto=true;
    var zEl=root.querySelector('#evZone'), xEl=root.querySelector('#evText');
    if(zEl) zEl.value=''; if(xEl) xEl.value='';
    var tEl=root.querySelector('#evTime'); if(tEl) tEl.value=quickEvTime();
  }
  var ab = root.querySelector('#btnAddEv'); if(ab) ab.onclick = pushEv;
  var et = root.querySelector('#evText');
  if(et) et.onkeydown = function(e){ if(e.key === 'Enter'){ e.preventDefault(); pushEv(); } };

  /* 기체 / 인원 추가 */
  var adr = root.querySelector('#btnAddDrone');
  if(adr) adr.onclick = function(){
    if(!ensureEditor())return;
    S.drones.push({ id:uid(), name:(S.drones.length+1)+'호기', model:'', status:'ready',
      battery:100, tookOffAt:'', endurance:25, zone:'', alt:'', pilot:'', observer:'',
      sorties:0, sensors:['EO','IR'] });
    commit();
  };
  var acr = root.querySelector('#btnAddCrew');
  if(acr) acr.onclick = function(){
    if(!ensureEditor())return;
    S.crew.push({ id:uid(), name:'', role:'조종', inAt: localDateTime(new Date()), outAt:'' });
    commit();
  };

  /* 액션 버튼 위임 */
  if(first) root.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-act]'); if(!b) return;
    var act = b.getAttribute('data-act');
    if(act==='takecontrol'){
      if(acquireEditorLock()){renderAll();}
      else alert(purgeBarrierActive()
        ? '이전 완전삭제가 끝나지 않았습니다. 브라우저 사이트 데이터에서 STAY UP 저장공간을 삭제한 뒤 다시 여세요.'
        : '다른 조작 창의 편집권이 아직 유효합니다. 그 창을 닫고 최대 15초 후 다시 시도하세요.');
      return;
    }
    if(act==='eventpage'){eventHistory.page=intv(b.getAttribute('data-page'),0);renderEventHistory(root);return;}
    if(act==='nav'){
      var target=root.querySelector('#'+b.getAttribute('data-sec'));
      if(target)scrollToSection(root,target);
      return;
    }
    if(['export','report'].indexOf(act)<0&&!ensureEditor())return;
    var di = b.getAttribute('data-di'), ci = b.getAttribute('data-ci');
    var d = di != null ? S.drones[+di] : null;

    if(act === 'confirmbattery' && d){
      var batteryField=root.querySelector('[data-path="drones.'+di+'.battery"]');
      if(d.battery===null||!isFinite(d.battery)||!batteryField||!batteryField.checkValidity()){
        alert('현재 배터리 잔량을 0~100%로 입력한 뒤 확인하세요.');return;
      }
      d.batteryUpdatedAt=Date.now();commit();
    }
    else if(act === 'takeoff' && d){
      if(setDroneStatus(d,'flying'))commit();
    }
    else if(act === 'land' && d&&d.tookOffAt){
      if(setDroneStatus(d,'swap'))commit();
    }
    else if(act === 'deldrone' && d){
      if(confirm((d.name||'기체')+'을 삭제할까요?')){ S.drones.splice(+di,1); commit(); }
    }
    else if(act === 'sens' && d){
      var s = b.getAttribute('data-s');
      d.sensors = d.sensors || [];
      var k = d.sensors.indexOf(s);
      if(k >= 0) d.sensors.splice(k,1); else d.sensors.push(s);
      commit();
    }
    else if(act === 'delcrew' && ci != null){
      var dc=S.crew[+ci]; if(confirm((dc&&dc.name||'해당 인원')+' 기록을 오입력으로 삭제할까요? 정상 교대는 종료 버튼을 사용하세요.')){S.crew.splice(+ci,1);commit();}
    }
    else if(act==='endcrew'&&ci!=null){
      var ec=S.crew[+ci]; if(ec){var out=localDateTime(new Date());
        if(ec.inAt&&tms(out)<tms(ec.inAt)){alert('투입시각이 현재보다 늦습니다. 투입시각을 먼저 수정하세요.');return;}
        if(!requireEventSlots(1,'교대 종료'))return;
        ec.outAt=out;addEvent('crew',(ec.name||'인원')+' 교대 종료', '',true,undefined,{entityType:'crew',entityId:ec.id});commit();}
    }
    else if(act==='resumecrew'&&ci!=null){
      var rc=S.crew[+ci];if(rc){if(!requireEventSlots(1,'교대 종료 취소'))return;
        rc.outAt='';addEvent('correction',(rc.name||'인원')+' 교대 종료 취소','',true,undefined,{entityType:'crew',entityId:rc.id,stateAction:'crewResume'});commit();}
    }
    else if(act === 'batt'){
      var k2 = b.getAttribute('data-k');
      S.batteries[k2] = Math.max(0, intv(S.batteries[k2],0) + intv(b.getAttribute('data-v'),0));
      commit();
    }
    else if(act === 'battswap'){
      if(intv(S.batteries.ready,0) > 0){
        S.batteries.ready--; S.batteries.empty = intv(S.batteries.empty,0)+1; commit();
      }
    }
    else if(act === 'battdone'){
      if(intv(S.batteries.charging,0) > 0){
        S.batteries.charging--; S.batteries.ready = intv(S.batteries.ready,0)+1; commit();
      }
    }
    else if(act === 'pin'){
      pinMode = b.getAttribute('data-p');
      b.textContent = '지도를 클릭하세요…';
    }
    else if(act === 'clearpins'){ S.grid.pinLast = null; S.grid.pinFound = null; commit(); }
    else if(act === 'clearcells'){
      if(confirm('모든 구역 상태·담당과 기체 담당구역을 초기화할까요? 기존 구역 기록은 이전 수색 이력으로 보관합니다.')){
        if(!saveRecoveryPoint('구역 상태 초기화 전')){alert('복구본을 만들 수 없어 초기화를 중단했습니다.');return;}
        var cleared=migrate(S);resetSpatialGrid(cleared,false);touchState(cleared);
        if(persistCandidate(cleared)){fileMutationSeq++;S=cleared;lastSweep=null;painting=null;gridDimensionsDraft=null;lastSeenUpdated=S.meta.updated;broadcast();renderAll();}
      }
    }
    else if(act==='applygrid'){applyGridDimensions(root.querySelector('#gridRowsDraft').value,root.querySelector('#gridColsDraft').value);}
    else if(act === 'mapfile'){ root.querySelector('#mapFileInput').click(); }
    else if(act === 'delmap'){ saveMap(null); }
    else if(act === 'wxnow'){ fetchWeather(true); }
    else if(act==='confirmcoords'){
      var cs=coordinateStatus(); if(!cs.ok){alert(cs.why);return;}
      S.mission.coordsConfirmedAt=Date.now();commit();
    }
    else if(act==='confirmweather'){
      var cst=coordinateStatus();if(!cst.ok||!cst.confirmed){alert(cst.why||'현장 좌표를 먼저 확인하세요.');return;}
      var w=S.weather,age=Date.now()-num(w.observedAt,0);
      if(w.wind==null||w.gust==null||typeof w.rain!=='boolean'||!w.observedAt){alert('풍속·돌풍·강수·관측시각을 모두 입력하세요.');return;}
      if(age< -5*60000||age>=WEATHER_MAX_AGE_MIN*60000){alert('관측시각은 현재 기준 30분 이내여야 합니다.');return;}
      w.lat=cst.lat;w.lon=cst.lon;w.confirmed=true;w.confirmedAt=Date.now();w.error='';commit();
    }
    else if(act==='voidevent'||act==='correctevent'){
      var eid=b.getAttribute('data-eid'),oe=null;
      S.events.forEach(function(e){if(e.id===eid)oe=e;});if(!oe||oe.voided)return;
      if(!requireEventSlots(act==='correctevent'?2:1,act==='correctevent'?'기록 정정':'기록 취소',oe.emergency===true))return;
      var reason=prompt(act==='correctevent'?'정정 사유를 입력하세요.':'취소 사유를 입력하세요.','오입력');
      if(!reason||!reason.trim()){alert('감사기록을 위해 사유가 필요합니다.');return;}
      if(act==='correctevent'){
        var ntx=prompt('올바른 내용을 입력하세요. 대상·시각·구역 변경은 취소 후 새로 기록하세요.',oe.text);if(ntx==null||!ntx.trim())return;
        oe.voided=true;oe.voidedAt=Date.now();oe.voidReason=reason.trim();
        addEvent(oe.type,ntx.trim(),oe.zone,true,oe.t,oe);
        addEvent('correction',shortDateTime(oe.t)+' 기록 정정 · '+reason.trim(),oe.zone,true,undefined,{emergency:oe.emergency===true,gridGeneration:oe.gridGeneration});
      }else{
        oe.voided=true;oe.voidedAt=Date.now();oe.voidReason=reason.trim();
        addEvent('correction',shortDateTime(oe.t)+' 기록 취소 · '+reason.trim(),oe.zone,true,undefined,{emergency:oe.emergency===true,gridGeneration:oe.gridGeneration});
      }
      commit();
    }
    else if(act==='refpick'){ pinMode = b.getAttribute('data-r'); renderConsole(root); }
    else if(act==='geoapply'){
      var gr = geoFromRefs(S.grid.ref1, S.grid.ref2);
      if(gr.err){ alert(gr.err); return; }
      S.grid.geo = gr.geo;S.grid.mapZoom=100;S.grid.mapX=0;S.grid.mapY=0;commit();
      mapMsg('2점 보정을 적용했습니다 · 지도 가로 '+Math.round(mapWidthMeters())+'m','ok');
    }
    else if(act==='geoclear'){
      if(!confirm('좌표 보정을 해제할까요? 격자와 핀의 위경도 표시가 사라집니다.')) return;
      S.grid.geo = null; commit();
      mapMsg('좌표 보정을 해제했습니다.','warn');
    }
    else if(act==='geofile'){ var gfi = root.querySelector('#geoFileInput'); if(gfi) gfi.click(); }
    else if(act==='undosweep'){ undoSweep(); }
    else if(act==='paints'||act==='paintby'){
      /* 같은 버튼을 다시 누르면 해제 = 그 항목은 칠하지 않음 */
      var pv = b.getAttribute('data-v');
      if(act==='paints') S.ui.paintS  = (pv==='') ? null : intv(pv,0);
      else               S.ui.paintBy = (pv==='__keep') ? null : pv;
      /* 바뀐 건 팔레트 하이라이트뿐이다. commit() 으로 패널 전체를 다시 그리면
         지도까지 새로 그려져 칠할 색을 바꿀 때마다 화면이 깜빡이고,
         쓸어내리려던 격자 DOM 이 통째로 교체된다. 버튼 상태만 직접 고친다. */
      var curSel = act==='paints' ? S.ui.paintS : S.ui.paintBy;
      root.querySelectorAll('[data-act="'+act+'"]').forEach(function(el){
        var v = el.getAttribute('data-v');
        var keep = (v==='' && act==='paints') || v==='__keep';
        var selected=keep ? (curSel===null||curSel===undefined)
                          : (curSel!==null&&curSel!==undefined&&String(curSel)===v);
        el.classList.toggle('on',selected);el.setAttribute('aria-pressed',selected?'true':'false');
      });
      commitLight();
    }
    else if(act==='syncstate'){
      if(syncFromRecord(b.getAttribute('data-kind'),b.getAttribute('data-ref'),intv(b.getAttribute('data-t'),0),b.getAttribute('data-generation')))commit();
    }
    else if(act === 'autofile'){ pickAutoSaveFile(); }
    else if(act === 'export'){ exportJson(); }
    else if(act === 'import'){ root.querySelector('#importFile').click(); }
    else if(act === 'report'){ copyReport(); }
    else if(act === 'recover'){
      var recoveryPick=root.querySelector('#recoveryPick');
      restoreRecovery(recoveryPick&&recoveryPick.value);
    }
    else if(act === 'sample'){
      if(confirm('현재 내용을 샘플 상황으로 덮어씁니다. 계속할까요?')){
        if(!saveRecoveryPoint('샘플 적용 전')){alert('복구본을 만들 수 없어 샘플 적용을 중단했습니다. 저장공간을 확인하세요.');return;}
        loadSample();
      }
    }
    else if(act === 'reset'){
      if(confirm('모든 데이터를 지웁니다. 계속할까요?')){
        if(!saveRecoveryPoint('전체 초기화 전')){alert('복구본을 만들 수 없어 초기화를 중단했습니다.');return;}
        var resetSeq=++fileMutationSeq;
        applyStateWithMap(defaultState(),null,stateLifecycleSeq,SESSION_EPOCH,resetSeq).then(function(ok){
          if(ok) alert('초기화했습니다. 직전 작업은 복구 버튼으로 되돌릴 수 있습니다.');
        });
      }
    }
    else if(act==='purge'){purgeIncidentData();}
  });

  /* 지도 붙여넣기 영역 (실제 드롭 처리는 문서 전역에서 받는다) */
  var pz = root.querySelector('#pasteZone');

  var gfi2 = root.querySelector('#geoFileInput');
  if(gfi2) gfi2.onchange = function(){
    var f = gfi2.files && gfi2.files[0];
    gfi2.value = '';
    if(f) applyGeoFile(f);
  };
  var imp = root.querySelector('#importFile');
  if(imp) imp.onchange = function(){
    var f = imp.files && imp.files[0]; if(!f) return;
    imp.value='';
    if(!ensureEditor())return;
    var opSeq=stateLifecycleSeq,opEpoch=SESSION_EPOCH,fileSeq=++fileMutationSeq;
    if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq))return;
    if(f.size>MAX_IMPORT_BYTES){alert('가져오기 파일이 '+Math.round(MAX_IMPORT_BYTES/1048576)+'MB 한도를 초과합니다. 원본을 별도 보관하고 지도를 축소하세요.');return;}
    var fr = new FileReader();
    fr.onerror=function(){if(lifecycleCurrent(opSeq,opEpoch)&&fileMutationCurrent(fileSeq))alert('파일을 읽지 못했습니다. 기존 데이터는 변경되지 않았습니다.');};
    fr.onload = function(){
      if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq)||!ownsEditorLock())return;
      try{
        var o = JSON.parse(fr.result);
        validateImportPackage(o);
        if(!confirm('현재 상황을 이 파일로 교체할까요? 작업 전 복구본을 먼저 만듭니다.'))return;
        if(!saveRecoveryPoint('JSON 가져오기 전'))throw new Error('복구본을 만들 수 없어 가져오기를 중단했습니다.');
        applyStateWithMap(o,o.map||null,opSeq,opEpoch,fileSeq).then(function(ok){
          if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq))return;
          alert(ok ? '검증 후 안전하게 불러왔습니다.'
            : '가져오기 실패: 저장공간 부족 또는 저장 충돌로 적용하지 못했습니다.\n기존 데이터는 유지됩니다.');
        });
      }catch(e){ alert('가져오기 실패: '+(e&&e.message?e.message:'JSON 형식 또는 구조를 확인하세요.')+'\n기존 데이터는 유지됩니다.'); }
    };
    fr.readAsText(f);
  };
  if(!ownsEditorLock()){
    root.querySelectorAll('input,textarea,select,button').forEach(function(el){
      var act=el.getAttribute('data-act');
      var safe=act==='takecontrol'||act==='export'||act==='report'||act==='nav'||act==='eventpage'
        ||['eventSearch','eventTypeFilter','eventStatusFilter'].indexOf(el.id)>=0
        ||el.id==='btnOpenDisplay'||el.id==='btnCloseDrawer';
      if(!safe)el.disabled=true;
    });
  }
}

/* --------------------------------------------------------------------------
   클립보드 붙여넣기 (문서 전역 - 어디에 포커스가 있어도 받는다)
   -------------------------------------------------------------------------- */
document.addEventListener('paste', function(ev){
  var dt = ev.clipboardData;
  var items = dt && dt.items;
  var f = null;

  if(items){
    for(var i=0;i<items.length;i++){
      if(items[i].type && items[i].type.indexOf('image') === 0){
        f = items[i].getAsFile();
        break;
      }
    }
  }
  /* 일부 환경은 items 대신 files 로만 넘어온다 */
  if(!f && dt && dt.files && dt.files.length){
    for(var j=0;j<dt.files.length;j++){
      if(/^image\//.test(dt.files[j].type)){ f = dt.files[j]; break; }
    }
  }

  if(f){ ev.preventDefault(); fileToMap(f); return; }

  /* 붙여넣기 영역에 대고 눌렀는데 이미지가 없으면 이유를 알려준다.
     (입력칸에 텍스트를 붙여넣는 정상 동작은 건드리지 않는다) */
  var onZone = ev.target && ev.target.closest && ev.target.closest('.paste-zone');
  if(onZone){
    ev.preventDefault();
    mapMsg('클립보드에 이미지가 없습니다. '
      + (IS_MAC ? '⌘⇧4 는 바탕화면에 파일로 저장됩니다 — ⌘+Control+Shift+4 로 캡처하거나 아래 「이미지 파일 선택」을 쓰세요.'
                : 'Win+Shift+S 로 캡처한 뒤 다시 붙여넣거나 아래 「이미지 파일 선택」을 쓰세요.'), 'warn');
  }
});

/* --------------------------------------------------------------------------
   드래그앤드롭 (문서 전역)
   좁은 영역만 받으면 살짝 빗나간 순간 브라우저가 그 이미지 파일로 이동해
   상황판이 날아간다. 창 전체에서 받고, 그 외의 드롭은 막는다.
   -------------------------------------------------------------------------- */
document.addEventListener('dragover', function(ev){
  ev.preventDefault();
  var pz = document.getElementById('pasteZone');
  if(pz) pz.classList.add('hot');
});
document.addEventListener('dragleave', function(ev){
  if(ev.relatedTarget) return;
  var pz = document.getElementById('pasteZone');
  if(pz) pz.classList.remove('hot');
});
document.addEventListener('drop', function(ev){
  ev.preventDefault();
  var pz = document.getElementById('pasteZone');
  if(pz) pz.classList.remove('hot');
  var files = ev.dataTransfer && ev.dataTransfer.files;
  if(!files || !files.length){ mapMsg('끌어다 놓은 항목에서 파일을 찾지 못했습니다.', 'warn'); return; }
  var f = null, gf = null;
  for(var i=0;i<files.length;i++){
    if(!f && /^image\//.test(files[i].type)) f = files[i];
    else if(!gf && isGeoFileName(files[i].name)) gf = files[i];
  }
  /* 정사영상은 보통 이미지와 좌표 파일이 한 쌍이다. 같이 놓으면 같이 적용한다. */
  if(f) fileToMap(f, gf);
  else if(gf) applyGeoFile(gf);
  else mapMsg('이미지 또는 좌표 파일(.jgw/.tfw/.kml)이 아닙니다 ('
    + (files[0].type || files[0].name) + ').', 'warn');
});

/* --------------------------------------------------------------------------
   좌표 파일 읽기
   world file(.jgw/.tfw/.pgw/.wld) 은 숫자 6줄 텍스트다. KML GroundOverlay 는
   <LatLonBox> 에 사방 좌표를 담는다. 둘 다 외부 라이브러리가 필요 없다.
   GeoTIFF 는 브라우저가 디코딩하지 못해 지원하지 않는다.
   -------------------------------------------------------------------------- */
function parseWorldFile(text, imgW, imgH){
  var v = String(text).trim().split(/[\r\n]+/).map(function(s){ return parseFloat(String(s).trim()); });
  if(v.length < 6 || v.slice(0,6).some(function(x){ return !isFinite(x); }))
    return {err:'world file 형식이 아닙니다. 숫자 6줄이어야 합니다.'};
  var A=v[0], D=v[1], B=v[2], E=v[3], C=v[4], F=v[5];
  if(Math.abs(D) > 1e-9 || Math.abs(B) > 1e-9)
    return {err:'회전이 포함된 좌표 파일은 지원하지 않습니다. 정북 정렬로 다시 내보내세요.'};
  if(!imgW || !imgH)
    return {err:'지도 원본 크기를 알 수 없습니다. 지도를 다시 불러온 뒤 적용하세요.'};
  /* 미터 좌표계(UTM·TM 등)는 투영 역변환이 필요하다. 잘못 변환한 좌표를 지상팀에
     넘기는 것보다 거부하는 편이 안전하다. */
  if(Math.abs(C) > 180 || Math.abs(F) > 90)
    return {err:'미터 좌표계(UTM·TM 등)로 보입니다. 매핑 소프트웨어에서 WGS84 경위도로 내보내거나 수동 2점 보정을 쓰세요.'};
  var west = C - A/2, north = F - E/2;
  return validateGeo({west:west, north:north,
    east:west + A*imgW, south:north + E*imgH, src:'world', at:Date.now()});
}
function parseKmlOverlay(text){
  var doc = null;
  try{ doc = new DOMParser().parseFromString(String(text), 'application/xml'); }
  catch(e){ return {err:'KML 을 읽지 못했습니다.'}; }
  if(!doc || doc.getElementsByTagName('parsererror').length)
    return {err:'KML 형식이 올바르지 않습니다.'};
  var box = doc.getElementsByTagName('LatLonBox')[0];
  if(!box) return {err:'KML 에 GroundOverlay 의 LatLonBox 가 없습니다. 정사영상 오버레이 KML 인지 확인하세요.'};
  function val(tag){
    var e = box.getElementsByTagName(tag)[0];
    return e ? parseFloat(String(e.textContent).trim()) : NaN;
  }
  var rot = val('rotation');
  if(isFinite(rot) && Math.abs(rot) > 0.5)
    return {err:'회전('+rot.toFixed(1)+'도)이 있는 오버레이는 지원하지 않습니다.'};
  return validateGeo({west:val('west'), east:val('east'),
    north:val('north'), south:val('south'), src:'kml', at:Date.now()});
}
function isGeoFileName(name){ return /\.(jgw|tfw|pgw|wld|kml)$/i.test(String(name||'')); }
function applyGeoFile(file,opSeq,opEpoch,fileSeq,targetMapId,targetMapVer){
  if(opSeq===undefined)opSeq=stateLifecycleSeq;
  if(opEpoch===undefined)opEpoch=SESSION_EPOCH;
  if(fileSeq===undefined)fileSeq=++fileMutationSeq;
  if(!ensureEditor() || !file) return;
  if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq))return;
  if(file.size > 2*1024*1024){ mapMsg('좌표 파일이 너무 큽니다.','err'); return; }
  if(!S.grid.hasMap){ mapMsg('먼저 지도 이미지를 넣은 뒤 좌표 파일을 적용하세요.','err'); return; }
  if(targetMapId===undefined)targetMapId=S.grid.mapId;
  if(targetMapVer===undefined)targetMapVer=S.grid.mapVer;
  var targetNatW=S.grid.mapNatW,targetNatH=S.grid.mapNatH;
  function sameTarget(){return lifecycleCurrent(opSeq,opEpoch)&&fileMutationCurrent(fileSeq)
    &&S.grid.hasMap&&S.grid.mapId===targetMapId&&S.grid.mapVer===targetMapVer;}
  var fr = new FileReader();
  fr.onerror = function(){if(sameTarget())mapMsg('좌표 파일을 읽지 못했습니다.','err');};
  fr.onload = function(){
    if(!sameTarget()||!ownsEditorLock()){if(fileMutationCurrent(fileSeq))mapMsg('지도가 바뀌어 이전 좌표 파일 적용을 취소했습니다.','warn');return;}
    var res = /\.kml$/i.test(String(file.name||''))
      ? parseKmlOverlay(fr.result)
      : parseWorldFile(fr.result,targetNatW,targetNatH);
    if(res.err){ mapMsg(res.err,'err'); return; }
    S.grid.geo = res.geo; S.grid.ref1 = null; S.grid.ref2 = null;
    S.grid.mapZoom=100;S.grid.mapX=0;S.grid.mapY=0;commit();
    mapMsg('좌표를 적용했습니다 · '+geoSrcLabel()+' · 지도 가로 '
      + Math.round(mapWidthMeters()) + 'm', 'ok');
  };
  fr.readAsText(file);
}

/* --------------------------------------------------------------------------
   이미지 -> 최대폭 1600px JPEG 로 축소 (localStorage 용량 확보)
   -------------------------------------------------------------------------- */
function fileToMap(file, geoFile){
  var opSeq=stateLifecycleSeq,opEpoch=SESSION_EPOCH,fileSeq=++fileMutationSeq;
  if(!ensureEditor())return;
  if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq))return;
  if(!file){ mapMsg('이미지를 찾지 못했습니다.', 'err'); return; }
  if(file.type && file.type.indexOf('image') !== 0){
    mapMsg('이미지 파일이 아닙니다 ('+file.type+').', 'err'); return;
  }
  /* 축소는 읽기가 끝난 뒤에 일어난다. 원본을 통째로 base64 로 올리는 단계에서
     수십 MB 사진이면 탭이 메모리 압박을 받는다. 읽기 전에 막는다. */
  if(file.size > MAX_IMAGE_BYTES){
    mapMsg('이미지가 너무 큽니다 ('+Math.round(file.size/1048576)+'MB). '
      + Math.round(MAX_IMAGE_BYTES/1048576)+'MB 이하로 줄여 다시 시도하세요.', 'err'); return;
  }
  mapMsg('지도 이미지를 처리하는 중…', 'warn');
  var fr = new FileReader();
  fr.onerror = function(){if(lifecycleCurrent(opSeq,opEpoch)&&fileMutationCurrent(fileSeq))mapMsg('파일을 읽지 못했습니다.', 'err');};
  fr.onload = function(){
    if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq)||!ownsEditorLock())return;
    var img = new Image();
    img.onload = function(){
      if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq)||!ownsEditorLock())return;
      if(!img.width || !img.height){ mapMsg('이미지 크기를 읽지 못했습니다.', 'err'); return; }
      try{
        /* IndexedDB 가 살아 있으면 정사영상을 쓸 만한 해상도까지 남긴다. */
        var maxW = mapPxCap();
        var sc = Math.min(1, maxW / img.width);
        var cv = document.createElement('canvas');
        cv.width  = Math.round(img.width * sc);
        cv.height = Math.round(img.height * sc);
        var cx = cv.getContext('2d');
        cx.fillStyle = '#0B1219'; cx.fillRect(0,0,cv.width,cv.height);
        cx.drawImage(img, 0, 0, cv.width, cv.height);
        /* world file 은 원본 픽셀 크기를 기준으로 해석해야 한다. 축소 전 값을 남긴다. */
        saveMap(cv.toDataURL('image/jpeg', 0.82),
          {w:cv.width, h:cv.height, natW:img.width, natH:img.height},opSeq,opEpoch,fileSeq)
          /* 이미지와 좌표 파일을 함께 끌어다 놓은 경우, 지도가 들어간 뒤에 적용한다. */
          .then(function(okSave){
            if(okSave&&geoFile&&lifecycleCurrent(opSeq,opEpoch)&&fileMutationCurrent(fileSeq))
              applyGeoFile(geoFile,opSeq,opEpoch,fileSeq,S.grid.mapId,S.grid.mapVer);
          });
      }catch(e){
        mapMsg('이미지 변환에 실패했습니다: '+(e && e.name ? e.name : e), 'err');
      }
    };
    img.onerror = function(){
      if(lifecycleCurrent(opSeq,opEpoch)&&fileMutationCurrent(fileSeq))mapMsg('이 형식은 브라우저가 읽지 못합니다. PNG 또는 JPG로 저장해 다시 시도하세요 (HEIC 등은 지원되지 않습니다).', 'err');
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ==========================================================================
   S10. 기상 자동 갱신 (Open-Meteo · API 키 불필요 · CORS 허용)
        통신이 안 되면 조용히 실패하고 수동 입력값을 유지한다.
   ========================================================================== */
var wxBusy=false,wxRequestSeq=0,wxController=null;
function cancelWeatherRequest(){
  wxRequestSeq++;
  if(wxController)try{wxController.abort();}catch(e){}
  wxController=null;wxBusy=false;
}
function fetchWeather(manualTrigger){
  if(!ownsEditorLock())return;
  if(wxBusy){if(manualTrigger)alert('기상 갱신이 이미 진행 중입니다.');return;}
  if(!manualTrigger&&!S.weather.auto)return;
  if(!manualTrigger&&S.weather.src==='manual'&&S.weather.confirmed)return;
  var cs=coordinateStatus();
  if(!cs.ok||!cs.confirmed){if(manualTrigger)alert(cs.why||'현장 좌표를 먼저 확인하세요.');return;}
  if(!navigator.onLine){if(manualTrigger)alert('오프라인입니다. 수동 관측값을 입력하세요.');return;}
  if(manualTrigger&&S.weather.src==='manual'&&S.weather.confirmed
      &&!confirm('확정된 수동 관측값을 자동 모델값으로 교체할까요?'))return;
  var lat=cs.lat,lon=cs.lon,seq=++wxRequestSeq;
  var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon
    +'&current=temperature_2m,precipitation,wind_speed_10m,wind_gusts_10m'
    +'&hourly=precipitation_probability&wind_speed_unit=ms&timezone=Asia%2FSeoul&timeformat=unixtime&forecast_days=1';
  wxBusy=true;S.weather.lastAttemptAt=Date.now();S.weather.error='';
  if(commitLight()===false){wxBusy=false;return;}
  var controller=typeof AbortController!=='undefined'?new AbortController():null;
  wxController=controller;
  var timer=setTimeout(function(){if(controller)controller.abort();},12000);
  fetch(url,{cache:'no-store',signal:controller?controller.signal:undefined})
    .then(function(r){if(!r.ok)throw new Error(String(r.status));return r.json();})
    .then(function(j){
      if(seq!==wxRequestSeq||!ownsEditorLock())return;
      var nowCs=coordinateStatus();
      if(!nowCs.ok||Math.abs(nowCs.lat-lat)>0.000001||Math.abs(nowCs.lon-lon)>0.000001)return;
      var c=j.current||{},temp=num(c.temperature_2m,NaN),wind=num(c.wind_speed_10m,NaN);
      var gust=num(c.wind_gusts_10m,NaN),rainAmt=num(c.precipitation,NaN);
      var observed=typeof c.time==='number'?c.time*1000:Date.parse(c.time||'');
      if(!isFinite(temp)||!isFinite(wind)||!isFinite(gust)||!isFinite(rainAmt)||!isFinite(observed))throw new Error('응답 필수값 누락');
      var precip=null,best=Infinity;
      if(j.hourly&&j.hourly.time&&j.hourly.precipitation_probability){
        for(var i=0;i<j.hourly.time.length;i++){
          var ht=typeof j.hourly.time[i]==='number'?j.hourly.time[i]*1000:Date.parse(j.hourly.time[i]);
          if(isFinite(ht)&&Math.abs(ht-observed)<best){best=Math.abs(ht-observed);precip=num(j.hourly.precipitation_probability[i],null);}
        }
      }
      var w=S.weather;
      var next={rain:rainAmt>0.05,wind:Math.round(wind*10)/10,
                gust:Math.round(gust*10)/10,precip:precip};
      var reconfirm=weatherNeedsReconfirm(
        {confirmed:w.confirmed,src:w.src,rain:w.rain,wind:w.wind,gust:w.gust,precip:w.precip}, next);
      w.temp=Math.round(temp*10)/10;w.wind=next.wind;w.gust=next.gust;
      w.rain=next.rain;w.precip=next.precip;
      w.observedAt=observed;w.stamp=localDateTime(new Date(observed));
      w.src='auto';w.lat=lat;w.lon=lon;
      if(reconfirm){ w.confirmed=false; w.confirmedAt=0; }
      w.error='';commit();
    })
    .catch(function(e){
      if(seq!==wxRequestSeq||!ownsEditorLock())return;
      S.weather.lastAttemptAt=Date.now();S.weather.error='자동 갱신 실패: '+(e&&e.name==='AbortError'?'시간 초과':(e&&e.message||'통신 오류'));
      commit();if(manualTrigger)alert('기상 자동 갱신 실패 — 기존 관측값은 유지했습니다.\n'+S.weather.error);
    })
    /* .then 으로 두면 앞선 .catch 핸들러가 던졌을 때 실행되지 않아
       wxBusy 가 true 로 굳고 이후 모든 기상 갱신이 조용히 막힌다. */
    .finally(function(){
      clearTimeout(timer);
      if(seq===wxRequestSeq){wxBusy=false;if(wxController===controller)wxController=null;}
    });
}

/* ==========================================================================
   S11. 내보내기 · 활동일지 · 샘플
   ========================================================================== */
function download(name, text, type){
  var blob = new Blob([text], {type: type || 'application/json;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function stampName(){
  var n = new Date();
  return n.getFullYear()+p2(n.getMonth()+1)+p2(n.getDate())+'-'+p2(n.getHours())+p2(n.getMinutes());
}
/* 보관 파일 한 개만 있어도 복원 가능해야 한다. 지도 참조만 들어간 JSON은 상태상
   '지도 있음'인데 본체가 없어, 가장 최신 파일일수록 오히려 복원할 수 없게 된다. */
function exportPayload(includeMap){
  var out = JSON.parse(JSON.stringify(S));
  out.appVersion = APP_VERSION;
  if(includeMap !== false && MAPDATA) out.map = MAPDATA;
  return JSON.stringify(out, null, 1);
}
function mapPayloadReady(){
  if(!S.grid.hasMap)return true;
  return mapVerLoaded===S.grid.mapVer
    &&mapIdLoaded===(S.grid.mapId||'legacy')&&validMapData(MAPDATA);
}
function exportJson(){
  if(!mapPayloadReady()){
    alert('지도 데이터를 아직 읽지 못해 완전한 JSON을 만들 수 없습니다. 잠시 후 다시 시도하세요.');
    return false;
  }
  download('stayup-'+stampName()+'.json', exportPayload(true));return true;
}

/* ==========================================================================
   S11b. 자동 보관
   활동 타임라인은 그대로 보고서가 되는데, 지금까지는 운영요원이 'JSON 내보내기'를
   누르기 전까지 브라우저 저장소에만 존재했다. 프로필 초기화·브라우저 변경·파일 경로
   이동 한 번이면 출동 기록이 통째로 사라지고, 자동 복구본도 같은 저장소라 함께 없어진다.
     1순위 - 파일 하나를 지정받아 조용히 덮어쓴다 (File System Access).
     2순위 - 그게 막힌 환경(file:// 등)에서는 주기적으로 다운로드한다.
   ========================================================================== */
var AUTOSAVE_MIN = 10;        /* 다운로드 폴백 주기(분) */
var AUTOSAVE_FILE_MS = 20000; /* 파일 덮어쓰기 최소 간격 */
var autoSaveHandle = null;    /* 세션 한정. 새로고침하면 다시 지정해야 한다 */
var autoSaveAt = 0, autoSaveErr = '', autoSaveBusy = false, lastAutoSavedRev = -1;
var autoSavedMapVer = -1;     /* 지도를 마지막으로 보관에 포함한 판 번호 */
var autoSaveGeneration=0;
function resetAutoSaveSession(){
  /* 다른 상황의 기록을 이전 출동의 지정 파일에 덮지 않는다. 진행 중 쓰기는
     다음 비동기 경계에서 중단하고, 그 작업이 끝날 때까지 새 쓰기를 기다린다. */
  autoSaveGeneration++;autoSaveHandle=null;autoSaveAt=0;autoSaveErr='';lastAutoSavedRev=-1;autoSavedMapVer=-1;
  refreshAutoSavePill();
}

function autoSaveWorth(){
  return !!(sanInt(S.meta.revision,0,Number.MAX_SAFE_INTEGER,0)>0
    || S.events.length || S.grid.hasMap || String(S.mission.title||'').trim()
    || S.drones.length || S.crew.length || S.subject.name);
}
function autoSaveLabel(){
  if(!S.ui.autoSave) return '자동 보관 꺼짐';
  if(autoSaveErr) return '자동 보관 실패 · '+autoSaveErr;
  var how = autoSaveHandle ? '파일' : '다운로드';
  if(!autoSaveAt) return '자동 보관 대기 · '+how;
  var m = Math.floor((Date.now()-autoSaveAt)/60000);
  return '보관 '+(m<1?'방금':m+'분 전')+' · '+how;
}
function refreshAutoSavePill(){
  var el = document.getElementById('autoSavePill'); if(!el) return;
  el.textContent = autoSaveLabel();
  el.className = 'save-pill' + ((!S.ui.autoSave || autoSaveErr) ? ' bad' : '');
}
function pickAutoSaveFile(){
  if(typeof window.showSaveFilePicker !== 'function'){
    alert('이 환경에서는 보관 파일을 지정할 수 없습니다. 자동 보관은 다운로드로 진행됩니다.');
    return;
  }
  var pickerGeneration=autoSaveGeneration;
  window.showSaveFilePicker({
    suggestedName:'stayup-'+stampName()+'.json',
    types:[{description:'STAY UP 상황 데이터',accept:{'application/json':['.json']}}]
  }).then(function(h){
    if(pickerGeneration!==autoSaveGeneration||!ownsEditorLock())return;
    resetAutoSaveSession();
    autoSaveHandle=h; autoSaveErr=''; lastAutoSavedRev=-1; autoSaveAt=0;
    autoSaveTick(); refreshAutoSavePill();
    alert('보관 파일을 지정했습니다. 이후 변경은 이 파일에 자동으로 덮어씁니다.\n창을 새로고침하면 다시 지정해야 합니다.');
  }, function(e){
    if(pickerGeneration!==autoSaveGeneration)return;
    if(e && e.name==='AbortError') return;   /* 사용자가 취소 */
    autoSaveErr=(e&&e.name)?e.name:String(e); refreshAutoSavePill();
    alert('보관 파일을 지정하지 못했습니다. 자동 보관은 다운로드로 진행됩니다.');
  });
}
function autoSaveTick(){
  /* 편집권을 가진 창만 보관한다. 두 창이 동시에 쓰면 파일이 서로를 덮는다. */
  if(!S.ui.autoSave || autoSaveBusy || !ownsEditorLock() || !autoSaveWorth()) return;
  var rev = S.meta.revision, now = Date.now();
  if(rev === lastAutoSavedRev) return;      /* 바뀐 게 없으면 쓰지 않는다 */
  if(!mapPayloadReady()){
    autoSaveErr='지도 데이터를 읽지 못해 보관 중단';refreshAutoSavePill();return;
  }
  if(autoSaveHandle){
    if(now - autoSaveAt < AUTOSAVE_FILE_MS) return;
    autoSaveBusy = true;
    var body = exportPayload(true),generation=autoSaveGeneration,handle=autoSaveHandle,writer=null;
    function current(){return generation===autoSaveGeneration&&handle===autoSaveHandle&&ownsEditorLock();}
    function abortWriter(){
      try{if(writer&&typeof writer.abort==='function')return Promise.resolve(writer.abort()).catch(function(){});}catch(e){}
      return Promise.resolve();
    }
    Promise.resolve().then(function(){
      if(!current())return null;
      return handle.createWritable();
    }).then(function(w){
      writer=w;if(!w)return false;
      if(!current())return abortWriter().then(function(){return false;});
      return w.write(body).then(function(){
        if(!current())return abortWriter().then(function(){return false;});
        return w.close().then(function(){return true;});
      });
    }).then(function(saved){
      if(!saved||!current())return;
      autoSaveAt = Date.now(); lastAutoSavedRev = rev; autoSaveErr = '';
      autoSavedMapVer = S.grid.mapVer;
    }, function(e){
      /* 권한이 끊기거나 파일이 사라지면 다운로드 방식으로 되돌아간다. */
      if(current()){autoSaveErr = (e&&e.name)?e.name:String(e); autoSaveHandle = null;}
      return abortWriter();
    }).then(function(){ autoSaveBusy = false; refreshAutoSavePill(); });
    return;
  }
  if(autoSaveAt && now - autoSaveAt < AUTOSAVE_MIN*60000) return;
  try{
    download('stayup-자동보관-'+stampName()+'.json', exportPayload(true));
    autoSaveAt = now; lastAutoSavedRev = rev; autoSaveErr = '';
    autoSavedMapVer = S.grid.mapVer;
  }catch(e){ autoSaveErr = (e&&e.name)?e.name:String(e); }
  refreshAutoSavePill();
}

var drawerLastFocus=null;
function drawerFocusable(){
  return Array.prototype.slice.call($('drawer').querySelectorAll(
    'summary,button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
  )).filter(function(el){return !el.hidden&&el.getClientRects().length>0;});

function openDrawer(){
  drawerLastFocus=document.activeElement;
  $('drawer').hidden = false;
  renderConsole($('drawerIn'));
  setTimeout(function(){var b=$('drawerIn').querySelector('#btnCloseDrawer');if(b)b.focus();},0);
}
function closeDrawer(){
  $('drawer').hidden = true;
  $('drawerIn').innerHTML = '';
  var back=drawerLastFocus;drawerLastFocus=null;
  if(back&&back.focus&&document.contains(back))back.focus();
}
function toggleDrawer(){ $('drawer').hidden ? openDrawer() : closeDrawer(); }

$('drawer').addEventListener('click', function(ev){
  if(ev.target === $('drawer')) closeDrawer();
});

document.addEventListener('keydown', function(ev){
  if(ev.key==='Tab'&&!$('drawer').hidden){
    var fs=drawerFocusable();
    if(fs.length){
      var first=fs[0],last=fs[fs.length-1],active=document.activeElement;
      if(ev.shiftKey&&(active===first||!$('drawer').contains(active))){ev.preventDefault();last.focus();}
      else if(!ev.shiftKey&&(active===last||!$('drawer').contains(active))){ev.preventDefault();first.focus();}
    }
    return;
  }
  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName||''));
  if((ev.ctrlKey || ev.metaKey) && (ev.key === 'e' || ev.key === 'E')){
    ev.preventDefault();
    if(MODE === 'display') toggleDrawer();
    return;
  }
  if(ev.key === 'Escape' && !$('drawer').hidden){ closeDrawer(); return; }
  if(typing) return;
  /* 쓸다가 잘못 지나가는 경우가 가장 흔하다. 입력칸에 있을 때는 동작하지 않는다. */
  if((ev.ctrlKey || ev.metaKey) && (ev.key === 'z' || ev.key === 'Z')){
    if(lastSweep){ ev.preventDefault(); undoSweep(); }
    return;
  }
  if(ev.key === 'f' || ev.key === 'F'){
    if(document.fullscreenElement) document.exitFullscreen();
    else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }
  if(ev.key==='+'||ev.key==='='){
    if(ownsEditorLock()){S.ui.scale=clamp(num(S.ui.scale,1)+0.05,0.75,1.5);commit();}
    else if(MODE==='display')sendPeer({type:'action',action:'scale',delta:0.05});
  }
  if(ev.key==='-'||ev.key==='_'){
    if(ownsEditorLock()){S.ui.scale=clamp(num(S.ui.scale,1)-0.05,0.75,1.5);commit();}
    else if(MODE==='display')sendPeer({type:'action',action:'scale',delta:-0.05});
  }
});

    /* 절전·모달로 5초 갱신이 멈춰 임대가 만료되면, 다른 창이 가져가지 않은 한
       같은 창이 스스로 편집권을 회수한다. 그러지 않으면 노트북을 덮었다 열 때마다
       조작 패널이 읽기 전용으로 잠겨 버튼을 한 번 더 눌러야 한다. */
    if(ownsEditorLock()){ refreshEditorLock(); heldEditorLock=true; return; }
    if(heldEditorLock){
      if(acquireEditorLock()) renderAll();      /* 만료된 자기 임대 회수 */
      else { heldEditorLock=false; renderAll(); }    /* 다른 창이 정당하게 가져감 */
    }
  },5000);
  /* 연결 상태 표시 갱신 */
  setInterval(function(){
    var pill = document.getElementById('syncPill');
    if(!pill) return;
    var on = peerConnected();
    pill.className = 'sync-pill' + (on ? '' : ' off');
    pill.textContent = on ? '표출 화면 연결됨' : '표출 화면 미연결';
    var save=document.getElementById('savePill');if(save){save.className='save-pill'+(SAVE_STATUS.ok&&SAVE_STATUS.backupOk?'':' bad');
      save.textContent=SAVE_STATUS.ok?(SAVE_STATUS.backupOk?'저장·복구 정상':'저장 정상 · 복구본 실패'):'저장 실패';}
    refreshAutoSavePill();
  }, 2000);

  /* 표출 화면을 닫을 때 마지막 상태를 확실히 남긴다 */
  window.addEventListener('beforeunload',function(){if(ownsEditorLock())persist();releaseEditorLock();});
}
boot();
</script>
</body>
</html>
