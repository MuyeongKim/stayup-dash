function renderDisplayOnly(){
  if($('board').hidden) return;
  renderHeader(); renderSubject(); renderBatteries(); renderCrew();
  renderGridStats(); renderSafety(); renderDrones(); renderLog();
  renderTicker(); renderBanner();
}
/* 타이핑 중에는 조작 패널을 다시 그리지 않는다(포커스 유지) */
function commitLight(){
  if(applying) return;
  touch(); var ok=persist(); lastSeenUpdated = S.meta.updated;
  broadcast(); applyUi(); renderDisplayOnly();
  return ok;
}

function setDroneStatus(d,next){
  if(!d||!Object.prototype.hasOwnProperty.call(DRONE_ST,next)||d.status===next)return false;
  var prev=d.status, wasAir=!!d.tookOffAt&&(prev==='flying'||prev==='commloss');
  if(next==='flying'){
    if(!wasAir){d.tookOffAt=localDateTime(new Date());d.sorties=intv(d.sorties,0)+1;
      addEvent('takeoff',(d.name||'기체')+' 이륙'+(d.zone?' · '+d.zone+' 구역':''),d.zone,true);}
  }else if(next==='commloss'){
    addEvent('accident',(d.name||'기체')+' 통신불량'+(wasAir?' · 비행 중':''),d.zone,true);
  }else if(wasAir){
    d.tookOffAt=''; addEvent('landing',(d.name||'기체')+' 착륙 · '+(DRONE_ST[next]||next),d.zone,true);
  }else addEvent('note',(d.name||'기체')+' 상태 변경: '+(DRONE_ST[prev]||prev)+' → '+(DRONE_ST[next]||next),d.zone,true);
  d.status=next; return true;
}

function readInput(el){
  var t = el.getAttribute('type');
  if(t === 'checkbox') return el.checked;
  if(t === 'number' || t === 'range'){
    if(el.value === '') return null;
    return num(el.value, 0);
  }
  return el.value;
}
function bindConsole(root){
  /* 위임 리스너는 root 당 한 번만 붙인다 (재렌더 시 중복 누적 방지) */
  var first = !root.__delegated;
  root.__delegated = true;

  /* 입력 */
  if(first) root.addEventListener('input', function(ev){
    var el = ev.target, path = el.getAttribute && el.getAttribute('data-path');
    if(!path) return;
    if(!ownsEditorLock()){renderConsole(root);return;}
    if(el.checkValidity&&!el.checkValidity()){
      el.classList.add('invalid'); setPath(path,null);
      if(path==='mission.lat'||path==='mission.lon')invalidateSafetyContext();
      commitLight(); return;
    }
    el.classList.remove('invalid');
    var val=readInput(el);
    if(path==='weather.observedAt')val=tms(val);
    if(path==='weather.rain')val=val==='true'?true:(val==='false'?false:null);
    var co=path.match(/^crew\.(\d+)\.outAt$/);
    if(co&&val&&S.crew[+co[1]]&&S.crew[+co[1]].inAt&&tms(val)<tms(S.crew[+co[1]].inAt)){
      el.classList.add('invalid');return;
    }
    var sm=path.match(/^drones\.(\d+)\.status$/);
    if(sm){if(setDroneStatus(S.drones[+sm[1]],val))commit();return;}
    setPath(path,val);
    if(path==='mission.lat'||path==='mission.lon'){invalidateSafetyContext();wxRequestSeq++;}
    if(/^weather\.(wind|gust|rain|temp|precip|observedAt)$/.test(path)){
      S.weather.src='manual';S.weather.auto=false;S.weather.confirmed=false;S.weather.confirmedAt=0;S.weather.error='';wxRequestSeq++;
    }
    if(path === 'grid.rows' || path === 'grid.cols'){ renderGridAll(); }
    if(path.indexOf('grid.map') === 0 || path === 'grid.widthMeters'){ renderGridAll(); }
    commitLight();
  });
  if(first) root.addEventListener('change', function(ev){
    var el = ev.target;
    if(!(el.getAttribute && el.getAttribute('data-path'))) return;
    if(!ownsEditorLock()){renderConsole(root);return;}
    if(el.checkValidity&&!el.checkValidity()){el.reportValidity();return;}
    var path=el.getAttribute('data-path');
    if(/^crew\.\d+\.outAt$/.test(path)){
      var ci=+path.split('.')[1],c=S.crew[ci];
      if(c&&c.outAt&&c.inAt&&tms(c.outAt)<tms(c.inAt)){alert('종료시각은 투입시각보다 빠를 수 없습니다.');c.outAt='';renderConsole(root);return;}
    }
    commit();               /* 포커스를 떠날 때 전체 갱신 */
  });

  /* 표출 화면 열기 / 드로어 닫기 */
  var od = root.querySelector('#btnOpenDisplay');
  if(od) od.onclick = function(){
    var url = location.href.split('#')[0] + '#display';
    peer = window.open(url, 'stayup_display', 'width=1600,height=900');
    if(!peer){ alert('팝업이 차단되었습니다. 주소창의 팝업 차단을 허용해 주세요.'); return; }
    setTimeout(function(){
      broadcast();
      if(MAPDATA){ try{ peer.postMessage({ch:'stayup',type:'map',data:MAPDATA},'*'); }catch(e){} }
      renderConsole(MODE==='console' ? $('consoleRoot') : $('drawerIn'));
    }, 700);
  };
  var cd = root.querySelector('#btnCloseDrawer');
  if(cd) cd.onclick = closeDrawer;

  /* 유인기 경보 */
  var mb = root.querySelector('#btnManned');
  if(mb) mb.onclick = function(){
    if(!ensureEditor())return;
    S.safety.manned = !S.safety.manned;
    addEvent('accident', S.safety.manned ? '유인기 진입 · 전 기체 즉시 착륙 지시' : '유인기 이탈 · 다른 비행조건 재확인 필요', '', true);
    lastBeepFor = 0;
    commit();
  };

  /* 이벤트 기록 */
  function pushEv(){
    if(!ensureEditor())return;
    var t = root.querySelector('#evType').value;
    var when=tms(root.querySelector('#evTime').value);
    var z = root.querySelector('#evZone').value.trim().toUpperCase();
    var x = root.querySelector('#evText').value.trim();
    if(!x && !z){ return; }
    if(!when){alert('사건 발생시각을 확인하세요.');return;}
    if(when>Date.now()+5*60000){alert('사건 발생시각이 현재보다 5분 이상 미래입니다.');return;}
    if(!addEvent(t,x||EV_TYPE[t],z,false,when))return;
    root.querySelector('#evText').value = '';
    root.querySelector('#evZone').value = '';
  }
  var ab = root.querySelector('#btnAddEv'); if(ab) ab.onclick = pushEv;
  var et = root.querySelector('#evText');
  if(et) et.onkeydown = function(e){ if(e.key === 'Enter'){ e.preventDefault(); pushEv(); } };

  /* 기체 / 인원 추가 */
  var adr = root.querySelector('#btnAddDrone');
  if(adr) adr.onclick = function(){
    if(!ensureEditor())return;
    S.drones.push({ id:uid(), name:(S.drones.length+1)+'호기', model:'', status:'ready',
      battery:100, tookOffAt:'', endurance:25, zone:'', alt:'', pilot:'', observer:'',
      sorties:0, sensors:['EO','IR'] });
    commit();
  };
  var acr = root.querySelector('#btnAddCrew');
  if(acr) acr.onclick = function(){
    if(!ensureEditor())return;
    var d = new Date(), local = d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())
      +'T'+p2(d.getHours())+':'+p2(d.getMinutes());
    S.crew.push({ id:uid(), name:'', role:'조종', inAt: local, outAt:'' });
    commit();
  };

  /* 액션 버튼 위임 */
  if(first) root.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-act]'); if(!b) return;
    var act = b.getAttribute('data-act');
    if(act==='takecontrol'){
      if(acquireEditorLock(false)){renderAll();}
      else alert('다른 조작 창의 편집권이 아직 유효합니다. 그 창을 닫고 최대 15초 후 다시 시도하세요.');
      return;
    }
    if(['export','report'].indexOf(act)<0&&!ensureEditor())return;
    var di = b.getAttribute('data-di'), ci = b.getAttribute('data-ci');
    var d = di != null ? S.drones[+di] : null;

    if(act === 'takeoff' && d){
      if(setDroneStatus(d,'flying'))commit();
    }
    else if(act === 'land' && d&&d.tookOffAt){
      if(setDroneStatus(d,'swap'))commit();
    }
    else if(act === 'deldrone' && d){
      if(confirm((d.name||'기체')+'을 삭제할까요?')){ S.drones.splice(+di,1); commit(); }
    }
    else if(act === 'sens' && d){
      var s = b.getAttribute('data-s');
      d.sensors = d.sensors || [];
      var k = d.sensors.indexOf(s);
      if(k >= 0) d.sensors.splice(k,1); else d.sensors.push(s);
      commit();
    }
    else if(act === 'delcrew' && ci != null){
      var dc=S.crew[+ci]; if(confirm((dc&&dc.name||'해당 인원')+' 기록을 오입력으로 삭제할까요? 정상 교대는 종료 버튼을 사용하세요.')){S.crew.splice(+ci,1);commit();}
    }
    else if(act==='endcrew'&&ci!=null){
      var ec=S.crew[+ci]; if(ec){var out=localDateTime(new Date());
        if(ec.inAt&&tms(out)<tms(ec.inAt)){alert('투입시각이 현재보다 늦습니다. 투입시각을 먼저 수정하세요.');return;}
        ec.outAt=out;addEvent('crew',(ec.name||'인원')+' 교대 종료', '',true);commit();}
    }
    else if(act==='resumecrew'&&ci!=null){
      var rc=S.crew[+ci];if(rc){rc.outAt='';addEvent('correction',(rc.name||'인원')+' 교대 종료 취소','',true);commit();}
    }
    else if(act === 'batt'){
      var k2 = b.getAttribute('data-k');
      S.batteries[k2] = Math.max(0, intv(S.batteries[k2],0) + intv(b.getAttribute('data-v'),0));
      commit();
    }
    else if(act === 'battswap'){
      if(intv(S.batteries.ready,0) > 0){
        S.batteries.ready--; S.batteries.empty = intv(S.batteries.empty,0)+1; commit();
      }
    }
    else if(act === 'battdone'){
      if(intv(S.batteries.charging,0) > 0){
        S.batteries.charging--; S.batteries.ready = intv(S.batteries.ready,0)+1; commit();
      }
    }
    else if(act === 'pin'){
      pinMode = b.getAttribute('data-p');
      b.textContent = '지도를 클릭하세요…';
    }
    else if(act === 'clearpins'){ S.grid.pinLast = null; S.grid.pinFound = null; commit(); }
    else if(act === 'clearcells'){
      if(confirm('모든 구역 상태를 미수색으로 되돌릴까요?')){ S.grid.cells = {}; commit(); }
    }
    else if(act === 'mapfile'){ root.querySelector('#mapFileInput').click(); }
    else if(act === 'delmap'){ if(confirm('지도 이미지를 삭제할까요?')) saveMap(null); }
    else if(act === 'wxnow'){ fetchWeather(true); }
    else if(act==='confirmcoords'){
      var cs=coordinateStatus(); if(!cs.ok){alert(cs.why);return;}
      S.mission.coordsConfirmedAt=Date.now();commit();
    }
    else if(act==='confirmweather'){
      var cst=coordinateStatus();if(!cst.ok||!cst.confirmed){alert(cst.why||'현장 좌표를 먼저 확인하세요.');return;}
      var w=S.weather,age=Date.now()-num(w.observedAt,0);
      if(w.wind==null||w.gust==null||typeof w.rain!=='boolean'||!w.observedAt){alert('풍속·돌풍·강수·관측시각을 모두 입력하세요.');return;}
      if(age< -5*60000||age>=WEATHER_MAX_AGE_MIN*60000){alert('관측시각은 현재 기준 30분 이내여야 합니다.');return;}
      w.lat=cst.lat;w.lon=cst.lon;w.confirmed=true;w.confirmedAt=Date.now();w.error='';commit();
    }
    else if(act==='voidevent'||act==='correctevent'){
      var eid=b.getAttribute('data-eid'),oe=null;
      S.events.forEach(function(e){if(e.id===eid)oe=e;});if(!oe||oe.voided)return;
      var reason=prompt(act==='correctevent'?'정정 사유를 입력하세요.':'취소 사유를 입력하세요.','오입력');
      if(!reason||!reason.trim()){alert('감사기록을 위해 사유가 필요합니다.');return;}
      if(act==='correctevent'){
        var ntx=prompt('올바른 내용을 입력하세요.',oe.text);if(ntx==null||!ntx.trim())return;
        oe.voided=true;oe.voidedAt=Date.now();oe.voidReason=reason.trim();
        addEvent(oe.type,ntx.trim(),oe.zone,true,oe.t);
        addEvent('correction',shortDateTime(oe.t)+' 기록 정정 · '+reason.trim(),oe.zone,true);
      }else{
        oe.voided=true;oe.voidedAt=Date.now();oe.voidReason=reason.trim();
        addEvent('correction',shortDateTime(oe.t)+' 기록 취소 · '+reason.trim(),oe.zone,true);
      }
      commit();
    }
    else if(act === 'export'){ exportJson(); }
    else if(act === 'import'){ root.querySelector('#importFile').click(); }
    else if(act === 'report'){ copyReport(); }
    else if(act === 'recover'){ restoreRecovery(); }
    else if(act === 'sample'){ if(confirm('현재 내용을 샘플 상황으로 덮어씁니다. 계속할까요?')){saveRecoveryPoint('샘플 적용 전');loadSample();} }
    else if(act === 'reset'){
      if(confirm('모든 데이터를 지웁니다. 계속할까요?')){
        if(!saveRecoveryPoint('전체 초기화 전')){alert('복구본을 만들 수 없어 초기화를 중단했습니다.');return;}
        if(applyStateTransaction(defaultState(),null))alert('초기화했습니다. 직전 작업은 복구 버튼으로 되돌릴 수 있습니다.');
      }
    }
    else if(act==='purge'){purgeIncidentData();}
  });

  /* 지도 붙여넣기 영역 (실제 드롭 처리는 문서 전역에서 받는다) */
  var pz = root.querySelector('#pasteZone');
  if(pz){
    pz.onclick = function(){ pz.focus(); pz.classList.add('hot'); };
    pz.onblur  = function(){ pz.classList.remove('hot'); };
  }
  var mfi = root.querySelector('#mapFileInput');
  if(mfi) mfi.onchange = function(){
    var f = mfi.files && mfi.files[0];
    mfi.value = '';                       /* 같은 파일을 다시 골라도 동작하도록 */
    if(f) fileToMap(f);
  };
  var imp = root.querySelector('#importFile');
  if(imp) imp.onchange = function(){
    var f = imp.files && imp.files[0]; if(!f) return;
    imp.value='';
    if(!ensureEditor())return;
    if(f.size>MAX_IMPORT_BYTES){alert('가져오기 파일이 6MB 한도를 초과합니다. 원본을 별도 보관하고 지도를 축소하세요.');return;}
    var fr = new FileReader();
    fr.onerror=function(){alert('파일을 읽지 못했습니다. 기존 데이터는 변경되지 않았습니다.');};
    fr.onload = function(){
      try{
        var o = JSON.parse(fr.result);
        validateImportPackage(o);
        if(!confirm('현재 상황을 이 파일로 교체할까요? 작업 전 복구본을 먼저 만듭니다.'))return;
        if(!saveRecoveryPoint('JSON 가져오기 전'))throw new Error('복구본을 만들 수 없어 가져오기를 중단했습니다.');
        if(!applyStateTransaction(migrate(o),o.map||null))throw new Error('저장공간 부족 또는 저장 충돌로 적용하지 못했습니다.');
        alert('검증 후 안전하게 불러왔습니다.');
      }catch(e){ alert('가져오기 실패: '+(e&&e.message?e.message:'JSON 형식 또는 구조를 확인하세요.')+'\n기존 데이터는 유지됩니다.'); }
    };
    fr.readAsText(f);
  };
  if(!ownsEditorLock()){
    root.querySelectorAll('input,textarea,select,button').forEach(function(el){
      var act=el.getAttribute('data-act');
      var safe=act==='takecontrol'||act==='export'||act==='report'||el.id==='btnOpenDisplay'||el.id==='btnCloseDrawer';
      if(!safe)el.disabled=true;
    });
  }
}

/* --------------------------------------------------------------------------
   클립보드 붙여넣기 (문서 전역 - 어디에 포커스가 있어도 받는다)
   -------------------------------------------------------------------------- */
document.addEventListener('paste', function(ev){
  var dt = ev.clipboardData;
  var items = dt && dt.items;
  var f = null;

  if(items){
    for(var i=0;i<items.length;i++){
      if(items[i].type && items[i].type.indexOf('image') === 0){
        f = items[i].getAsFile();
        break;
      }
    }
  }
  /* 일부 환경은 items 대신 files 로만 넘어온다 */
  if(!f && dt && dt.files && dt.files.length){
    for(var j=0;j<dt.files.length;j++){
      if(/^image\//.test(dt.files[j].type)){ f = dt.files[j]; break; }
    }
  }

  if(f){ ev.preventDefault(); fileToMap(f); return; }

  /* 붙여넣기 영역에 대고 눌렀는데 이미지가 없으면 이유를 알려준다.
     (입력칸에 텍스트를 붙여넣는 정상 동작은 건드리지 않는다) */
  var onZone = ev.target && ev.target.closest && ev.target.closest('.paste-zone');
  if(onZone){
    ev.preventDefault();
    mapMsg('클립보드에 이미지가 없습니다. '
      + (IS_MAC ? '⌘⇧4 는 바탕화면에 파일로 저장됩니다 — ⌘+Control+Shift+4 로 캡처하거나 아래 「이미지 파일 선택」을 쓰세요.'
                : 'Win+Shift+S 로 캡처한 뒤 다시 붙여넣거나 아래 「이미지 파일 선택」을 쓰세요.'), 'warn');
  }
});

/* --------------------------------------------------------------------------
   드래그앤드롭 (문서 전역)
   좁은 영역만 받으면 살짝 빗나간 순간 브라우저가 그 이미지 파일로 이동해
   상황판이 날아간다. 창 전체에서 받고, 그 외의 드롭은 막는다.
   -------------------------------------------------------------------------- */
document.addEventListener('dragover', function(ev){
  ev.preventDefault();
  var pz = document.getElementById('pasteZone');
  if(pz) pz.classList.add('hot');
});
document.addEventListener('dragleave', function(ev){
  if(ev.relatedTarget) return;
  var pz = document.getElementById('pasteZone');
  if(pz) pz.classList.remove('hot');
});
document.addEventListener('drop', function(ev){
  ev.preventDefault();
  var pz = document.getElementById('pasteZone');
  if(pz) pz.classList.remove('hot');
  var files = ev.dataTransfer && ev.dataTransfer.files;
  if(!files || !files.length){ mapMsg('끌어다 놓은 항목에서 파일을 찾지 못했습니다.', 'warn'); return; }
  var f = null;
  for(var i=0;i<files.length;i++) if(/^image\//.test(files[i].type)){ f = files[i]; break; }
  if(f) fileToMap(f);
  else mapMsg('이미지 파일이 아닙니다 (' + (files[0].type || files[0].name) + ').', 'warn');
});

/* --------------------------------------------------------------------------
   이미지 -> 최대폭 1600px JPEG 로 축소 (localStorage 용량 확보)
   -------------------------------------------------------------------------- */
function fileToMap(file){
  if(!ensureEditor())return;
  if(!file){ mapMsg('이미지를 찾지 못했습니다.', 'err'); return; }
  if(file.type && file.type.indexOf('image') !== 0){
    mapMsg('이미지 파일이 아닙니다 ('+file.type+').', 'err'); return;
  }
  mapMsg('지도 이미지를 처리하는 중…', 'warn');
  var fr = new FileReader();
  fr.onerror = function(){ mapMsg('파일을 읽지 못했습니다.', 'err'); };
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      if(!img.width || !img.height){ mapMsg('이미지 크기를 읽지 못했습니다.', 'err'); return; }
      try{
        var maxW = 1600;
        var sc = Math.min(1, maxW / img.width);
        var cv = document.createElement('canvas');
        cv.width  = Math.round(img.width * sc);
        cv.height = Math.round(img.height * sc);
        var cx = cv.getContext('2d');
        cx.fillStyle = '#0B1219'; cx.fillRect(0,0,cv.width,cv.height);
        cx.drawImage(img, 0, 0, cv.width, cv.height);
        saveMap(cv.toDataURL('image/jpeg', 0.82), {w:cv.width, h:cv.height});
      }catch(e){
        mapMsg('이미지 변환에 실패했습니다: '+(e && e.name ? e.name : e), 'err');
      }
    };
    img.onerror = function(){
      mapMsg('이 형식은 브라우저가 읽지 못합니다. PNG 또는 JPG로 저장해 다시 시도하세요 (HEIC 등은 지원되지 않습니다).', 'err');
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ==========================================================================
   S10. 기상 자동 갱신 (Open-Meteo · API 키 불필요 · CORS 허용)
        통신이 안 되면 조용히 실패하고 수동 입력값을 유지한다.
   ========================================================================== */
var wxBusy=false,wxRequestSeq=0;
function fetchWeather(manualTrigger){
  if(!ownsEditorLock())return;
  if(wxBusy){if(manualTrigger)alert('기상 갱신이 이미 진행 중입니다.');return;}
  if(!manualTrigger&&!S.weather.auto)return;
  if(!manualTrigger&&S.weather.src==='manual'&&S.weather.confirmed)return;
  var cs=coordinateStatus();
  if(!cs.ok||!cs.confirmed){if(manualTrigger)alert(cs.why||'현장 좌표를 먼저 확인하세요.');return;}
  if(!navigator.onLine){if(manualTrigger)alert('오프라인입니다. 수동 관측값을 입력하세요.');return;}
  if(manualTrigger&&S.weather.src==='manual'&&S.weather.confirmed
      &&!confirm('확정된 수동 관측값을 자동 모델값으로 교체할까요?'))return;
  var lat=cs.lat,lon=cs.lon,seq=++wxRequestSeq;
  var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon
    +'&current=temperature_2m,precipitation,wind_speed_10m,wind_gusts_10m'
    +'&hourly=precipitation_probability&wind_speed_unit=ms&timezone=Asia%2FSeoul&timeformat=unixtime&forecast_days=1';
  wxBusy=true;S.weather.lastAttemptAt=Date.now();S.weather.error='';commitLight();
  var controller=typeof AbortController!=='undefined'?new AbortController():null;
  var timer=setTimeout(function(){if(controller)controller.abort();},12000);
  fetch(url,{cache:'no-store',signal:controller?controller.signal:undefined})
    .then(function(r){if(!r.ok)throw new Error(String(r.status));return r.json();})
    .then(function(j){
      if(seq!==wxRequestSeq)return;
      var nowCs=coordinateStatus();
      if(!nowCs.ok||Math.abs(nowCs.lat-lat)>0.000001||Math.abs(nowCs.lon-lon)>0.000001)return;
      var c=j.current||{},temp=num(c.temperature_2m,NaN),wind=num(c.wind_speed_10m,NaN);
      var gust=num(c.wind_gusts_10m,NaN),rainAmt=num(c.precipitation,NaN);
      var observed=typeof c.time==='number'?c.time*1000:Date.parse(c.time||'');
      if(!isFinite(temp)||!isFinite(wind)||!isFinite(gust)||!isFinite(rainAmt)||!isFinite(observed))throw new Error('응답 필수값 누락');
      var precip=null,best=Infinity;
      if(j.hourly&&j.hourly.time&&j.hourly.precipitation_probability){
        for(var i=0;i<j.hourly.time.length;i++){
          var ht=typeof j.hourly.time[i]==='number'?j.hourly.time[i]*1000:Date.parse(j.hourly.time[i]);
          if(isFinite(ht)&&Math.abs(ht-observed)<best){best=Math.abs(ht-observed);precip=num(j.hourly.precipitation_probability[i],null);}
        }
      }
      var w=S.weather;
      w.temp=Math.round(temp*10)/10;w.wind=Math.round(wind*10)/10;w.gust=Math.round(gust*10)/10;
      w.rain=rainAmt>0.05;w.precip=precip;w.observedAt=observed;w.stamp=localDateTime(new Date(observed));
      w.src='auto';w.lat=lat;w.lon=lon;w.confirmed=false;w.confirmedAt=0;w.error='';commit();
    })
    .catch(function(e){
      if(seq!==wxRequestSeq)return;
      S.weather.lastAttemptAt=Date.now();S.weather.error='자동 갱신 실패: '+(e&&e.name==='AbortError'?'시간 초과':(e&&e.message||'통신 오류'));
      commit();if(manualTrigger)alert('기상 자동 갱신 실패 — 기존 관측값은 유지했습니다.\n'+S.weather.error);
    })
    .then(function(){clearTimeout(timer);wxBusy=false;});
}

function download(name, text, type){
  var blob = new Blob([text], {type: type || 'application/json;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function stampName(){
  var n = new Date();
  return n.getFullYear()+p2(n.getMonth()+1)+p2(n.getDate())+'-'+p2(n.getHours())+p2(n.getMinutes());
}
function exportJson(){
  var out = JSON.parse(JSON.stringify(S));
  out.appVersion = APP_VERSION;

  download('stayup-'+stampName()+'.json', JSON.stringify(out, null, 1));
}

  var f = latestFound();

    +' / 관측 '+(S.weather.observedAt?shortDateTime(S.weather.observedAt):'-')+' / 현장확인 '+(S.weather.confirmed?'완료':'미완료'));
  if(S.safety.agencies) lines.push('  · 인접기관 : '+S.safety.agencies);
  return lines.join('\n');
}
function copyReport(){
  var txt = buildReport();
  function ok(){ alert('활동일지를 클립보드에 복사했습니다.\n보고서에 붙여넣으세요.'); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, function(){ fallback(); });
  } else fallback();
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); ok(); }

}

/* ==========================================================================
   S12. 드로어 (표출 화면 위에 조작 패널 겹쳐 열기 · 화면이 하나뿐일 때)
   ========================================================================== */
function openDrawer(){
  $('drawer').hidden = false;
  renderConsole($('drawerIn'));
}
function closeDrawer(){
  $('drawer').hidden = true;
  $('drawerIn').innerHTML = '';
}
function toggleDrawer(){ $('drawer').hidden ? openDrawer() : closeDrawer(); }

$('drawer').addEventListener('click', function(ev){
  if(ev.target === $('drawer')) closeDrawer();
});

document.addEventListener('keydown', function(ev){
  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName||''));
  if((ev.ctrlKey || ev.metaKey) && (ev.key === 'e' || ev.key === 'E')){
    ev.preventDefault();
    if(MODE === 'display') toggleDrawer();
    return;
  }
  if(ev.key === 'Escape' && !$('drawer').hidden){ closeDrawer(); return; }
  if(typing) return;
  if(ev.key === 'f' || ev.key === 'F'){
    if(document.fullscreenElement) document.exitFullscreen();
    else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }
  if(ev.key==='+'||ev.key==='='){
    if(ownsEditorLock()){S.ui.scale=clamp(num(S.ui.scale,1)+0.05,0.75,1.5);commit();}
    else if(MODE==='display')sendPeer({type:'action',action:'scale',delta:0.05});
  }
  if(ev.key==='-'||ev.key==='_'){
    if(ownsEditorLock()){S.ui.scale=clamp(num(S.ui.scale,1)-0.05,0.75,1.5);commit();}
    else if(MODE==='display')sendPeer({type:'action',action:'scale',delta:-0.05});
  }
});

/* ==========================================================================
   S13. 부팅
   ========================================================================== */
function boot(){
  loadLocal();
  document.documentElement.setAttribute('data-app-version', APP_VERSION);
  var versionEl = $('appVersion');
  if(versionEl) versionEl.textContent = 'v'+APP_VERSION;

  if(MODE === 'display'){
    document.body.className = 'mode-display';
    document.title = 'STAY UP v'+APP_VERSION+' — 표출';
    $('board').hidden = false;
    $('consoleRoot').hidden = true;
    /* 조작 패널(부모 창)에 존재를 알리고 최신 상태를 요청 */
    try{
      if(window.opener && !window.opener.closed){
        peer = window.opener;
        window.opener.postMessage({ch:'stayup', type:'hello'}, '*');
      }
    }catch(e){}
  } else {
    document.body.className = 'mode-console';
    document.title = 'STAY UP v'+APP_VERSION+' — 조작 패널';
    $('board').hidden = true;
    acquireEditorLock(false);
    renderConsole($('consoleRoot'));
  }

  applyUi();
  renderAll();
  if(STARTUP_WARNINGS.length)showSystemAlert(STARTUP_WARNINGS.join(' · '));
  var arm=$('audioArm');if(arm){arm.onclick=primeAudio;updateAudioArm();}

  /* 1초: 시계·카운트다운·비행시간 / 0.5초: 창간 동기화 폴링 */
  setInterval(function(){
    if(!$('board').hidden){renderHeader();renderSafety();tickDrones();renderBanner();}
  }, 1000);
  setInterval(pollStore, 500);
  /* 30초: 최근 5세대 자동 복구본 */
  setInterval(function(){createSnapshot('자동');},30000);
  /* 10분: 기상 자동 갱신 */
  fetchWeather(false);
  setInterval(function(){ fetchWeather(false); }, 600000);
  setInterval(function(){sendPeer({type:'ping'});},2000);
  setInterval(function(){
    if(ownsEditorLock())refreshEditorLock();
  },5000);
  /* 연결 상태 표시 갱신 */
  setInterval(function(){
    var pill = document.getElementById('syncPill');
    if(!pill) return;
    var on = peerConnected();
    pill.className = 'sync-pill' + (on ? '' : ' off');
    pill.textContent = on ? '표출 화면 연결됨' : '표출 화면 미연결';
    var save=document.getElementById('savePill');if(save){save.className='save-pill'+(SAVE_STATUS.ok&&SAVE_STATUS.backupOk?'':' bad');
      save.textContent=SAVE_STATUS.ok?(SAVE_STATUS.backupOk?'저장·복구 정상':'저장 정상 · 복구본 실패'):'저장 실패';}
  }, 2000);

  /* 표출 화면을 닫을 때 마지막 상태를 확실히 남긴다 */
  window.addEventListener('beforeunload',function(){if(ownsEditorLock())persist();releaseEditorLock();});
}
boot();
