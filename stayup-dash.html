<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STAY UP 현장 상황판</title>

  ============================================================================
  STAY UP 현장 상황판 (전북소방 드론팀 실종자 수색 현장 대시보드)
  단일 HTML 파일 · 외부 의존성 없음 · file:// 로 직접 열어 사용

  사용법
    - 이 파일을 더블클릭하면 [조작 패널]이 열립니다 (운영요원 노트북)
    - 상단 "표출 화면 열기" 버튼 -> 대형 스크린용 [표출 화면]이 새 창으로 열림
    - 표출 화면을 대형 모니터로 옮기고 F11 (전체화면)
    - 화면이 하나뿐이면 표출 화면에서 Ctrl+E 로 조작 패널을 겹쳐 열 수 있음
  권장 브라우저: Chrome / Edge
  ============================================================================

<style>
/* ==========================================================================
   1. 색·타이포 토큰
   ========================================================================== */
:root{
  --bg:#070A0E;
  --surface:#101720;
  --surface2:#18212C;
  --surface3:#1F2A38;
  --border:#22303F;
  --border2:#2E3E51;
  --control-border:#526A82;
  --text:#E9F0F7;
  --muted:#8FA3B8;
  /* 작은 안내문도 WCAG AA 대비를 넘도록 보조색을 한 단계 밝힌다. */
  --muted2:#7890A7;
  /* 액센트(소방 주황)와 경고(앰버)가 색상환에서 17도밖에 안 떨어져 있어,
     대형 스크린에서 브랜드 표시와 경고 신호가 같은 것으로 읽혔다.
     경고를 노랑 쪽으로 24도 더 밀어 둘을 분리한다. 액센트는 정체성 전용이며
     상태 표시에는 쓰지 않는다. */
  --accent:#FF6A1A;
  --ok:#22C55E;
  --warn:#E8B931;
  --danger:#EF4444;
  --info:#38BDF8;
  --s:1;          /* 배율 슬라이더 */
  --dim:0;        /* 야간 밝기 저감 */
  --fw-num:700;
}
*,*::before,*::after{box-sizing:border-box}

button:focus-visible,[tabindex]:focus-visible,a:focus-visible{
  outline:3px solid #7DD3FC;outline-offset:2px;
}

/* hidden 속성은 브라우저 기본 스타일([hidden]{display:none})로 걸리는데,
   아래의 .board{display:grid} / .drawer{display:flex} 같은 작성자 규칙이 그것을 이긴다.
   그러면 숨겨야 할 드로어 오버레이와 배너가 계속 깔려 클릭이 막힌다. 반드시 !important 로 못박는다. */
[hidden]{display:none !important}

/* 표출 화면의 모든 크기는 rem 기반.
   1rem = 16px @1920x1080 이며 화면 크기에 따라 자동 스케일된다.
   min() 을 쓰므로 4K·프로젝터·와이드 모두 한 화면에 들어온다. */
html{
  font-size:calc(min(100vw / 120, 100vh / 67.5) * var(--s));
  -webkit-text-size-adjust:100%;
}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Pretendard','Pretendard Variable','Apple SD Gothic Neo',
              'Malgun Gothic','맑은 고딕','Noto Sans KR',system-ui,sans-serif;
  font-size:1.25rem; line-height:1.35;
  -webkit-font-smoothing:antialiased;
}
body.mode-display{height:100vh;overflow:hidden}
body.mode-console{min-height:100vh;overflow-y:auto;background:#0A0F15}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-0.01em}
b,strong{font-weight:700}

/* 야간 밝기 저감 오버레이 */
#dimmer{
  position:fixed;inset:0;background:#000;pointer-events:none;z-index:9000;
  opacity:calc(var(--dim) * 0.55);transition:opacity .3s;
}

/* ==========================================================================
   2. 표출 화면 - 전체 골격
   ========================================================================== */
.board{
  display:grid; height:100vh;
  grid-template-rows:auto 1fr auto;
  gap:.55rem; padding:.65rem .75rem .6rem;
}
.board.manned-alert{background:
  repeating-linear-gradient(135deg,#1a0505 0 40px,#230707 40px 80px);}

/* ---- 헤더 ---- */
.hdr{
  display:grid; grid-template-columns:22.5rem 1fr 13.5rem;
  gap:.75rem; align-items:stretch;
}
.hdr-id{
  background:var(--surface); border:1px solid var(--border);
  border-left:.32rem solid var(--accent); border-radius:.55rem;
  padding:.62rem .85rem; display:flex; flex-direction:column; justify-content:center;
  min-width:0;
}
.brand{
  font-size:1.6rem; font-weight:800; letter-spacing:.01em; line-height:1.1;
  display:flex; align-items:center; gap:.45rem; white-space:nowrap;
}
.brand .su{color:var(--accent)}
.brand .sep{color:var(--border2);font-weight:400}
.brand .app-version{
  color:var(--muted);font-size:.88rem;font-weight:700;letter-spacing:.03em;
  background:var(--surface2);border:1px solid var(--border2);border-radius:99px;
  padding:.08rem .4rem;
}
.mission{
  font-size:1.55rem;font-weight:700;margin-top:.28rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mission-sub{
  font-size:1.15rem;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
.kpi{
  background:var(--surface);border:1px solid var(--border);border-radius:.55rem;
  padding:.5rem .8rem .55rem; position:relative; overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;min-width:0;
}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.22rem;background:var(--border2)}
.kpi-l{font-size:1.08rem;color:var(--muted);font-weight:600;letter-spacing:.02em;white-space:nowrap}
.kpi-v{font-size:4.3rem;font-weight:800;line-height:1.02;white-space:nowrap}
.kpi-v small{font-size:1.5rem;font-weight:700;color:var(--muted);margin-left:.2rem}
.kpi-s{font-size:.98rem;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.lv-ok::before{background:var(--ok)}      .kpi.lv-ok    .kpi-v{color:var(--ok)}
.kpi.lv-warn::before{background:var(--warn)}  .kpi.lv-warn  .kpi-v{color:var(--warn)}
.kpi.lv-danger::before{background:var(--danger)} .kpi.lv-danger .kpi-v{color:var(--danger)}
.kpi.lv-crit{background:#2A0B0B;border-color:#7F1D1D;animation:critpulse 1.6s ease-in-out infinite}
.kpi.lv-crit::before{background:var(--danger)} .kpi.lv-crit .kpi-v{color:#FF6B6B}
@keyframes critpulse{0%,100%{background:#2A0B0B}50%{background:#3D0F0F}}
.kpi.lv-idle .kpi-v{color:var(--muted2)}

.kpi-flight .kpi-v{font-size:3.1rem;display:flex;align-items:center;gap:.4rem}
.kpi-flight .kpi-s{
  white-space:normal;line-height:1.12;max-height:2.25em;overflow:hidden;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
}
/* 색만으로 구분하면 적록색약(한국 남성 5~6%)에게 '비행 가능'과 '비행 불가'가
   같은 회색 점이 된다. 프로젝터 색 재현이 나쁠 때도 마찬가지다.
   화면 전체에서 같은 형태 어법을 쓴다: ● 가능 / ▲ 제한 / ■ 불가 / ○ 보류.
   drop-shadow 는 box-shadow 와 달리 clip-path 를 따라간다. */
.dot{width:1.5rem;height:1.5rem;flex:0 0 auto;filter:drop-shadow(0 0 .35rem currentColor)}
.dot.ok{background:var(--ok);color:var(--ok);border-radius:50%}
.dot.warn{background:var(--warn);color:var(--warn);clip-path:polygon(50% 3%,100% 97%,0 97%)}
.dot.danger{background:var(--danger);color:var(--danger);border-radius:.1rem}
.dot.idle{background:transparent;color:var(--muted2);border:.28rem solid var(--muted2);
  border-radius:50%;filter:none}

.hdr-clock{
  background:var(--surface);border:1px solid var(--border);border-radius:.55rem;
  padding:.5rem .7rem;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.clock{font-size:3.05rem;font-weight:800;line-height:1}
.cdate{font-size:1.05rem;color:var(--muted)}

/* ---- 3열 본문 ---- */
.cols{display:grid;grid-template-columns:21.5rem 1fr 25.5rem;gap:.6rem;min-height:0}
.col{display:flex;flex-direction:column;gap:.6rem;min-height:0;min-width:0}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:.55rem;
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.card-h{
  display:flex;align-items:center;gap:.5rem;
  padding:.42rem .7rem;border-bottom:1px solid var(--border);
  background:var(--surface2);flex:0 0 auto;
}
.card-h h2{
  margin:0;font-size:1.25rem;font-weight:700;letter-spacing:.02em;
  color:#CFDCE9;white-space:nowrap;
}
.card-h .h-right{margin-left:auto;font-size:1.1rem;color:var(--muted);white-space:nowrap}
.card-b{padding:.6rem .7rem;overflow:auto;min-height:0;flex:1 1 auto}
.card-b::-webkit-scrollbar{width:.4rem}
.card-b::-webkit-scrollbar-thumb{background:var(--border2);border-radius:.2rem}
.empty{color:var(--muted2);font-size:1.05rem;padding:.6rem .2rem;text-align:center}

/* ==========================================================================
   3. 좌열 - 실종자 / 배터리 자원 / 인원
   ========================================================================== */
.subj-name{
  display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;
  padding-bottom:.4rem;margin-bottom:.45rem;border-bottom:1px solid var(--border);
}
.subj-name .nm{font-size:2.35rem;font-weight:800;line-height:1}
/* 나이는 상태가 아니라 정보다. 소방 주황으로 칠하면 경고로 읽힌다. */
.subj-name .ag{font-size:1.5rem;font-weight:700;color:var(--muted)}
.subj-name .sx{font-size:1.2rem;color:var(--muted)}

/* 인상착의: 열화상/주광 판독 중 반복 확인하므로 색상칩을 크게 */
.wear{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.45rem}
.wear-row{display:flex;align-items:center;gap:.5rem}
.wear-lb{
  flex:0 0 2.5rem;font-size:1rem;color:var(--muted);font-weight:700;
  background:var(--surface3);border-radius:.25rem;text-align:center;padding:.15rem 0;
}
.chip{
  width:2.1rem;height:2.1rem;border-radius:.3rem;flex:0 0 auto;
  border:1px solid rgba(255,255,255,.35);box-shadow:0 0 0 1px rgba(0,0,0,.5) inset;
}
.wear-tx{font-size:1.34rem;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.kv{display:grid;grid-template-columns:4.9rem 1fr;gap:.18rem .5rem;font-size:1.25rem}
.kv dt{color:var(--muted);font-size:1.06rem;padding-top:.14rem}
.kv dd{margin:0;font-weight:600;word-break:break-all}
.tagline{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.5rem}
.tag{
  font-size:1.02rem;font-weight:700;padding:.12rem .45rem;border-radius:.25rem;
  background:var(--surface3);border:1px solid var(--border2);color:#C3D2E1;
}
.tag.hot{background:#3B1010;border-color:#7F1D1D;color:#FCA5A5}
.tag.cool{background:#0C2A3A;border-color:#155E75;color:#7DD3FC}
.radchip{
  flex:0 0 auto;display:flex;align-items:center;gap:.5rem;
  padding:.22rem .6rem;border-radius:.35rem;
  background:var(--surface2);border:1px solid var(--border);border-left:.2rem solid var(--info);
}
.radchip .rl{font-size:1rem;color:var(--muted);line-height:1.15;white-space:nowrap}
.radchip .rv{font-size:2rem;font-weight:800;color:var(--info);line-height:1}
.radchip .rv small{font-size:1rem;font-weight:700;color:var(--muted);margin-left:.1rem}

/* 배터리 자원 */
.batt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;text-align:center}
.batt-cell{background:var(--surface2);border:1px solid var(--border);border-radius:.35rem;padding:.35rem .2rem}
.batt-cell .bn{font-size:2.1rem;font-weight:800;line-height:1.05}
.batt-cell .bl{font-size:.95rem;color:var(--muted)}
.batt-cell.ready .bn{color:var(--ok)}
.batt-cell.charging .bn{color:var(--warn)}
.batt-cell.empty .bn{color:var(--muted2)}
.endur{
  margin-top:.5rem;padding:.42rem .6rem;border-radius:.35rem;
  background:var(--surface2);border:1px solid var(--border);border-left:.22rem solid var(--info);
  display:flex;align-items:center;justify-content:space-between;
}
.endur.warn{border-left-color:var(--warn)}
.endur.danger{border-left-color:var(--danger)}
.endur .el{font-size:1rem;color:var(--muted)}
.endur .ev{font-size:2.1rem;font-weight:800}
.endur.warn .ev{color:var(--warn)} .endur.danger .ev{color:var(--danger)}

/* 인원 */
.crew-list{display:flex;flex-direction:column;gap:.16rem}
.crew-row{
  display:grid;grid-template-columns:1fr auto auto;gap:.4rem;align-items:center;
  font-size:1.2rem;padding:.08rem .3rem;border-radius:.25rem;background:var(--surface2);
}
.crew-row .cn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crew-row .cr{font-size:1rem;color:#9FB6CB;background:var(--surface3);padding:.05rem .35rem;border-radius:.2rem;white-space:nowrap}
.crew-row .ct{font-size:1.12rem;color:var(--muted);font-weight:600}
.crew-row.tired{background:#33210A;box-shadow:inset 0 0 0 1px #7C4A0A}
.crew-row.tired .ct{color:var(--warn)}

/* ==========================================================================
   4. 중앙열 - 수색구역(지도+격자) / 안전·규제
   ========================================================================== */
.card-grid{flex:1 1 auto}
.card-grid .card-b{display:flex;flex-direction:column;gap:.5rem;padding:.55rem .6rem;overflow:hidden}
.mapwrap{
  position:relative;flex:1 1 auto;min-height:0;border-radius:.4rem;overflow:hidden;
  background:
    linear-gradient(0deg,#0B1219,#0B1219),
    repeating-linear-gradient(45deg,#0E151D 0 12px,#101922 12px 24px);
  border:1px solid var(--border);
}
/* 격자·핀·추정반경은 컨테이너가 아니라 지도 이미지의 좌표계에 고정한다.
   컨테이너 종횡비는 화면마다 다르고(조작 패널 1.60 고정 / 표출 1.70~2.14) 해상도와
   안전 카드 높이에 따라 계속 변한다. 격자를 컨테이너에 붙여 두면 object-fit:cover 의
   크롭량이 화면마다 달라져, 같은 칸이 두 화면에서 서로 다른 지형을 가리킨다.
   상자 크기는 fitMapBox() 가 px 로 계산한다. CSS 만으로는 "비율 유지하며 최대로 맞추기"가
   컨테이너 축에 따라 안정적으로 풀리지 않는다. */
.mapfit{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:100%;height:100%;overflow:hidden;border-radius:.2rem;
}
.mapimg{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transform-origin:center center;pointer-events:none;user-select:none;
}
.mapnote{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--muted2);font-size:1.08rem;text-align:center;padding:1rem;line-height:1.5;
}
.gridlayer{position:absolute;inset:0;display:grid;gap:2px;padding:2px}
.gcell{
  position:relative;border-radius:.2rem;display:flex;align-items:center;justify-content:center;
  font-size:1.18rem;font-weight:800;letter-spacing:.02em;
  border:1px solid rgba(143,163,184,.28);
  background:rgba(7,10,14,.16);color:rgba(233,240,247,.62);
  transition:background .15s,border-color .15s;
  padding:0;font-family:inherit;
}
/* 네 상태를 채움 밀도와 무늬로 구분해, 색 없이도 순서가 읽히게 한다.
   미수색 = 비어 있음(점선) · 수색중 = 진행(사선) · 완료 = 닫힘(진한 채움) · 재수색 = 다시 열림(이중선) */
.gcell.s0{border-style:dashed}
.gcell.s1{background-color:rgba(232,185,49,.28);border-color:var(--warn);color:#FBEBC0;
  background-image:repeating-linear-gradient(45deg,rgba(0,0,0,0) 0 .26rem,rgba(255,255,255,.15) .26rem .52rem)}
.gcell.s2{background:rgba(34,197,94,.42);border-color:var(--ok);color:#DFFBE9}
.gcell.s3{background:rgba(239,68,68,.22);border-color:var(--danger);color:#FECACA;
  border-style:double;border-width:.22rem}
.gcell .by{
  position:absolute;top:.1rem;right:.2rem;font-size:.88rem;font-weight:700;
  opacity:.9;letter-spacing:0;
}
.gcell.act{outline:.14rem solid var(--accent);outline-offset:-.14rem}
.pin{
  position:absolute;transform:translate(-50%,-100%);pointer-events:none;
  display:flex;flex-direction:column;align-items:center;z-index:5;
}
.pin .pdot{
  width:1.05rem;height:1.05rem;border-radius:50%;border:.16rem solid #fff;
  box-shadow:0 0 .5rem rgba(0,0,0,.9);
}
.pin .plb{
  font-size:.9rem;font-weight:800;padding:.05rem .3rem;border-radius:.2rem;
  background:rgba(7,10,14,.85);margin-bottom:.12rem;white-space:nowrap;
}
.pin.last .pdot{background:var(--info)}   .pin.last .plb{color:#7DD3FC;border:1px solid #155E75}
.pin.found .pdot{background:var(--danger)}.pin.found .plb{color:#FCA5A5;border:1px solid #7F1D1D}
.pin .stem{width:.14rem;height:.8rem;background:#fff;opacity:.75}
.rcircle{
  position:absolute;border-radius:50%;border:.14rem dashed rgba(56,189,248,.75);
  background:rgba(56,189,248,.07);transform:translate(-50%,-50%);pointer-events:none;z-index:4;
}
.cov{display:flex;align-items:center;gap:.75rem;flex:0 0 auto}
.cov-pct{font-size:3.1rem;font-weight:800;line-height:1;color:var(--ok)}
.cov-pct small{font-size:1.15rem;color:var(--muted);font-weight:700;margin-left:.15rem}
.cov-bar{flex:1 1 auto;height:1.15rem;background:var(--surface3);border-radius:.6rem;overflow:hidden;display:flex}
.cov-bar i{display:block;height:100%}
.cov-bar i.done{background:var(--ok)} .cov-bar i.doing{background:var(--warn)} .cov-bar i.re{background:var(--danger)}
.legend{display:flex;gap:.75rem;flex:0 0 auto;font-size:1.15rem;font-weight:700}
.legend span{display:flex;align-items:center;gap:.28rem;color:#B8C9D9}
.legend i{width:.9rem;height:.9rem;border-radius:.15rem;border:1px solid rgba(143,163,184,.4)}
.legend i.l0{background:rgba(7,10,14,.2);border-style:dashed}
.legend i.l1{background-color:rgba(232,185,49,.34);border-color:var(--warn);
  background-image:repeating-linear-gradient(45deg,rgba(0,0,0,0) 0 .16rem,rgba(255,255,255,.30) .16rem .32rem)}
.legend i.l2{background:rgba(34,197,94,.46);border-color:var(--ok)}
.legend i.l3{background:rgba(239,68,68,.26);border-color:var(--danger);border-style:double;border-width:.16rem}

/* 안전·규제 */
.card-safety{flex:0 0 auto}
.safety-row{display:flex;flex-wrap:wrap;gap:.4rem;align-items:stretch}
.sf{
  flex:1 1 8rem;background:var(--surface2);border:1px solid var(--border);
  border-radius:.35rem;padding:.32rem .5rem;min-width:0;
}
.sf .sl{font-size:1rem;color:var(--muted);white-space:nowrap}
.sf .sv{font-size:1.34rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf.ok .sv{color:var(--ok)} .sf.warn .sv{color:var(--warn)} .sf.danger .sv{color:var(--danger)}
/* 비행 판정 점과 같은 어법. 색을 못 읽어도 등급이 남는다. */
.sf.ok .sv::before,.sf.warn .sv::before,.sf.danger .sv::before{
  margin-right:.32em;font-size:.78em;display:inline-block;vertical-align:.06em
}
.sf.ok .sv::before{content:"\25CF"}      /* ● */
.sf.warn .sv::before{content:"\25B2"}    /* ▲ */
.sf.danger .sv::before{content:"\25A0"}  /* ■ */
.sf.wide{flex:2.2 1 15rem}
.sf.wide .sv{
  white-space:normal;font-size:1.15rem;line-height:1.22;overflow-wrap:anywhere;
  max-height:3.66em;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;
}
.sf.danger{background:#2A0B0B;border-color:#7F1D1D}
.wx{display:flex;gap:.4rem;margin-top:.4rem;flex-wrap:wrap}
.wx .sf{flex:1 1 6rem}

/* ==========================================================================
   5. 우열 - 드론 운용 현황 / 이벤트 타임라인
   ========================================================================== */
.card-drones{flex:0 0 auto;max-height:82%}
.drones{display:flex;flex-direction:column;gap:.34rem}
.drone{
  background:var(--surface2);border:1px solid var(--border);
  border-left:.28rem solid var(--border2);border-radius:.4rem;padding:.34rem .5rem;
}
.drone.st-flying{border-left-color:var(--ok);background:#0F1B18}
.drone.st-flying.low{border-left-color:var(--warn);background:#1C170B}
.drone.st-flying.crit{border-left-color:var(--danger);background:#20100F;animation:critpulse2 2s ease-in-out infinite}
@keyframes critpulse2{0%,100%{background:#20100F}50%{background:#2C1413}}
.drone.st-ready{border-left-color:var(--info)}
.drone.st-charging,.drone.st-swap{border-left-color:var(--warn)}
.drone.st-maint,.drone.st-commloss{border-left-color:var(--danger);opacity:.92}
.d-top{display:flex;align-items:baseline;gap:.4rem;margin-bottom:.2rem}
.d-name{font-size:1.5rem;font-weight:800;line-height:1}
.d-model{font-size:1rem;color:var(--muted);font-weight:600}
.d-st{
  margin-left:auto;font-size:1.02rem;font-weight:800;padding:.1rem .45rem;
  border-radius:.25rem;background:var(--surface3);white-space:nowrap;
}
.st-flying  .d-st{background:#0B3A22;color:#86EFAC}
.st-ready   .d-st{background:#0C2A3A;color:#7DD3FC}
.st-charging .d-st,.st-swap .d-st{background:#33210A;color:#FCD34D}
.st-maint   .d-st,.st-commloss .d-st{background:#3B1010;color:#FCA5A5}
.d-batt{display:flex;align-items:center;gap:.45rem;margin-bottom:.22rem}
.bar{flex:1 1 auto;height:.85rem;background:#0A1016;border:1px solid var(--border2);border-radius:.5rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.bar.low i{background:var(--warn)}
/* 잔량은 막대 길이가 이미 값을 나타내므로 색은 보조다. 위험 구간만 사선으로 못박는다. */
.bar.crit i{background-color:var(--danger);
  background-image:repeating-linear-gradient(45deg,rgba(0,0,0,0) 0 .17rem,rgba(0,0,0,.38) .17rem .34rem)}
.d-pct{font-size:1.45rem;font-weight:800;min-width:3.6rem;text-align:right}
.d-pct.low{color:var(--warn)} .d-pct.crit{color:var(--danger)}
.d-rows{display:grid;grid-template-columns:repeat(4,1fr);gap:.22rem;margin-bottom:.2rem}
.d-rows div{background:#0C131A;border-radius:.25rem;padding:.1rem .28rem;min-width:0}
.d-rows em{display:block;font-size:.95rem;color:var(--muted);font-style:normal;line-height:1.1}
.d-rows b{font-size:1.25rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.d-foot{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.sens{display:flex;gap:.2rem}
.sens span{
  font-size:.95rem;font-weight:800;padding:.05rem .3rem;border-radius:.2rem;
  background:#132433;color:#8FD0F5;border:1px solid #1E4256;
}
.sens span.ir{background:#2B1206;color:#FDBA74;border-color:#7C3A0D}
.d-crew{margin-left:auto;font-size:1.1rem;color:#A9BDD0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 타임라인 */
.card-log{flex:1 1 auto;min-height:6.5rem}
.card-log .card-b{padding:.35rem .5rem}
.log{display:flex;flex-direction:column;gap:.18rem}
.log-row{display:grid;grid-template-columns:7rem auto 1fr;gap:.4rem;align-items:baseline;
  padding:.2rem .3rem;border-radius:.25rem;background:var(--surface2);font-size:1.22rem}
.log-row .lt{font-weight:800;color:#B9CBDC;font-size:1.16rem}
.log-row .lk{font-size:.98rem;font-weight:800;padding:.05rem .32rem;border-radius:.2rem;
  background:var(--surface3);color:#9FB6CB;white-space:nowrap}
.log-row .lx{min-width:0;word-break:break-word;line-height:1.25}
.log-row.k-found{background:#3B1010;box-shadow:inset 0 0 0 1px #7F1D1D}
.log-row.k-found .lk{background:#7F1D1D;color:#FFE4E6}
.log-row.k-found .lx{font-weight:800;color:#FECACA}
.log-row.k-heat{background:#33210A}
.log-row.k-heat .lk{background:#7C4A0A;color:#FDE68A}
.log-row.k-order{background:#101F33}
.log-row.k-order .lk{background:#1E3A5F;color:#BFDBFE}
.log-row.k-accident{background:#3B1010}
.log-row.k-accident .lk{background:#991B1B;color:#FFE4E6}
.log-row.voided{opacity:.58;text-decoration:line-through}

/* ==========================================================================
   6. 티커 / 발견 배너 / 유인기 경고
   ========================================================================== */
.ticker{
  display:grid;grid-template-columns:auto 1fr auto;gap:.75rem;align-items:center;
  background:var(--surface);border:1px solid var(--border);border-radius:.55rem;
  padding:.3rem .75rem;height:3.3rem;overflow:hidden;
}
.tk-lb{
  font-size:1.05rem;font-weight:800;color:#0A0F14;background:var(--accent);
  padding:.16rem .5rem;border-radius:.25rem;white-space:nowrap;
}
.tk-track{overflow:hidden;position:relative;height:2.2rem;display:flex;align-items:center;min-width:0}
.tk-move{white-space:nowrap;font-size:1.45rem;font-weight:700;will-change:transform}
.tk-move.scroll{animation:tkscroll linear infinite}
.tk-track:hover .tk-move.scroll,.tk-track:focus .tk-move.scroll{animation-play-state:paused}
@keyframes tkscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk-right{display:flex;gap:.6rem;font-size:1.08rem;color:#B8C9D9;white-space:nowrap}
.tk-right b{color:var(--text)}

.alert-banner{
  position:fixed;left:0;right:0;top:0;z-index:9200;
  background:#B91C1C;color:#fff;padding:.7rem 1.2rem;
  display:flex;align-items:center;gap:1rem;
  box-shadow:0 .5rem 2rem rgba(0,0,0,.6);animation:bannerin .25s ease-out;
}
@keyframes bannerin{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.alert-banner .ab-k{font-size:2.6rem;font-weight:800;letter-spacing:.06em;white-space:nowrap}
.alert-banner .ab-x{font-size:1.6rem;font-weight:700;flex:1 1 auto;min-width:0}
.alert-banner button{
  font:inherit;font-size:1.1rem;font-weight:800;cursor:pointer;
  background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.5);
  border-radius:.3rem;padding:.35rem .8rem;
}
.alert-banner.manned{background:#7F1D1D;animation:mannedblink 1.1s steps(1) infinite}
@keyframes mannedblink{0%,100%{background:#7F1D1D}50%{background:#DC2626}}

/* ==========================================================================
   7. 조작 패널 (px 단위 - 노트북에서 일반 크기로 보여야 함)
   ========================================================================== */
.cons{font-size:15px;color:var(--text);max-width:1240px;margin:0 auto;padding:14px 16px 60px}
.cons-top{
  position:sticky;top:0;z-index:50;background:#0A0F15EE;backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border);margin:-14px -16px 14px;padding:10px 16px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.cons-top .ct-brand{font-size:17px;font-weight:800;white-space:nowrap;margin:0}
.cons-top .ct-brand span{color:var(--accent)}
.cons-top .ct-brand .app-version{
  color:var(--muted);font-size:11px;font-weight:700;margin-left:5px;
  border:1px solid var(--border2);border-radius:99px;padding:1px 5px;
  vertical-align:2px;
}
.cons-top .ct-mode{font-size:12px;color:var(--muted);background:var(--surface2);
  border:1px solid var(--border);border-radius:4px;padding:2px 7px;white-space:nowrap}
.cons-top .spacer{flex:1 1 auto}
/* 조작 패널은 노트북 기준 8화면 가까이 되고, 수색 중 가장 자주 만지는 수색구역이
   70% 지점에 있다. 상단 바에 섹션 점프를 붙여 스크롤 없이 오갈 수 있게 한다. */
/* 노트북 1대 + 대형 모니터 구성에서 기록자는 조작 패널만 본다. 골든타임·일몰·
   비행 판정·출동 경과를 보려고 고개를 돌리지 않게 상단 바에 축소판을 둔다. */
.cons-top .ct-kpi{flex:1 0 100%;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;
  padding-top:8px;border-top:1px solid var(--border)}
.ct-kpi .ck{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.ct-kpi .ck em{font-style:normal;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.ct-kpi .ck b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ct-kpi .ck small{font-size:10.5px;font-weight:700;color:var(--muted)}
.ct-kpi .ck .dot{width:11px;height:11px;align-self:center;margin-right:1px}
.ct-kpi .ck-ok b{color:var(--ok)}
.ct-kpi .ck-warn b{color:var(--warn)}
.ct-kpi .ck-danger b{color:var(--danger)}
.ct-kpi .ck-crit b{color:#FF6B6B}
.ct-kpi .ck-idle b{color:var(--muted2)}
.cons-top .ct-nav{flex:1 0 100%;display:flex;flex-wrap:wrap;gap:5px;
  padding-top:8px;border-top:1px solid var(--border)}
.ct-nav button{
  font:700 11.5px/1 system-ui,sans-serif;color:var(--muted);cursor:pointer;
  background:var(--surface2);border:1px solid var(--control-border);border-radius:99px;padding:5px 9px;
}
.ct-nav button:hover{color:var(--text);border-color:var(--border2);background:var(--surface3)}
/* 키보드 포커스 이동용 폴백. 칩이 줄바꿈되면 상단 바가 더 높아지므로
   버튼 클릭 경로에서는 실제 높이를 재서 정확히 맞춘다(bindConsole 의 nav 처리). */
.sec{scroll-margin-top:96px}
.sync-pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;
  background:#0B3A22;color:#86EFAC;border:1px solid #166534}
.sync-pill.off{background:#33210A;color:#FCD34D;border-color:#7C4A0A}
.sync-pill.bad{background:#3B1010;color:#FCA5A5;border-color:#991B1B}
.save-pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;
  background:#0C2A3A;color:#7DD3FC;border:1px solid #155E75}
.save-pill.bad{background:#3B1010;color:#FCA5A5;border-color:#991B1B}

.btn{
  font:inherit;font-weight:700;cursor:pointer;white-space:nowrap;
  background:var(--surface2);color:var(--text);border:1px solid var(--control-border);
  border-radius:6px;padding:7px 12px;
}
.btn:hover{background:var(--surface3)}
.btn.primary{background:var(--accent);border-color:#FF8A4C;color:#160800}
.btn.primary:hover{background:#FF7F35}
.btn.danger{background:#3B1010;border-color:#7F1D1D;color:#FCA5A5}
.btn.danger:hover{background:#4C1414}
.btn.sm{padding:4px 8px;font-size:12px;border-radius:5px}
.btn.on{background:#0B3A22;border-color:#166534;color:#86EFAC}
.btn.big{padding:14px 16px;font-size:16px;width:100%}
.btn.alarm{background:#7F1D1D;border-color:#B91C1C;color:#fff}
.btn.alarm.on{animation:mannedblink 1.1s steps(1) infinite}
.btn:disabled{cursor:not-allowed;opacity:.45;filter:saturate(.4)}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.quick-grid{display:grid;grid-template-columns:minmax(280px,.72fr) minmax(0,1.45fr);gap:12px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:900px){.grid2,.grid3,.quick-grid{grid-template-columns:1fr}}

.sec{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden}
.sec>h2{
  margin:0;padding:9px 12px;font-size:13.5px;font-weight:800;letter-spacing:.04em;
  background:var(--surface2);border-bottom:1px solid var(--border);color:#CFDCE9;
  display:flex;align-items:center;gap:8px;
}
.sec>h2 .hint{font-weight:600;font-size:11.5px;color:var(--muted2);letter-spacing:0}
.sec>h2 .spacer{flex:1 1 auto}
.sec-b{padding:12px}
/* 기록과 실제 상태가 어긋난 항목 목록 (빠른기록은 타임라인만 바꾼다) */
.mismatch{border:1px solid var(--warn);background:#2A1E06;border-radius:6px;padding:9px 11px;margin:10px 0}
.mismatch .mm-h{font-size:12.5px;font-weight:800;color:var(--warn);margin-bottom:6px}
.mismatch .mm-row{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12.5px}
.mismatch .mm-row>span{flex:1 1 auto;min-width:0}
.mismatch .note{margin-top:7px}

label.f{display:block;margin-bottom:9px}
label.f>span{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:5px}
input,select,textarea{
  font:inherit;width:100%;background:#0B1218;color:var(--text);
  border:1px solid var(--control-border);border-radius:5px;padding:6px 8px;
}
input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid #7DD3FC;outline-offset:2px;border-color:#7DD3FC;
}
input.invalid,select.invalid,textarea.invalid{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
input[type=color]{padding:2px;height:32px;cursor:pointer}
input[type=checkbox]{width:auto;accent-color:var(--accent);transform:scale(1.15)}
input[type=range]{padding:0;accent-color:var(--accent)}
textarea{resize:vertical;min-height:52px}
.inline{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.inline label.f{margin-bottom:0}
.chkline{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-bottom:7px;cursor:pointer}
.row-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.note{font-size:13px;color:var(--muted2);line-height:1.55;margin-top:8px}
.note b{color:#A9BDD0}

/* 조작 패널의 기체/인원 목록 */
.item{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px}
.item-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.item-h .ih-t{font-size:14px;font-weight:800}
.item-h .spacer{flex:1 1 auto}
.recent-event{
  display:grid;grid-template-columns:92px 68px minmax(0,1fr) auto auto;
  gap:6px;align-items:center;margin:5px 0;
}
.recent-event .re-text{min-width:0;overflow-wrap:anywhere}
.event-filters{display:grid;grid-template-columns:minmax(180px,2fr) repeat(2,minmax(110px,1fr));gap:8px;margin-bottom:8px}
.event-pages{justify-content:space-between;margin-top:8px}
.event-voided .re-text{text-decoration:line-through;color:var(--muted)}
#evEntityWrap{flex:0 1 160px;min-width:0}#evEntityWrap:empty{display:none}#evEntityWrap select{width:100%}
@media(max-width:600px){.event-filters{grid-template-columns:1fr 1fr}.event-filters>.f:first-child{grid-column:1/-1}}
@media (max-width:600px){
  .recent-event{grid-template-columns:auto 1fr auto auto;align-items:start;padding:7px 0;border-bottom:1px solid var(--border)}
  .recent-event .re-text{grid-column:1/-1;grid-row:2}
}
.f4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:760px){.f4,.f3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sens-pick{display:flex;gap:5px;flex-wrap:wrap}
.sens-pick button{font-size:11.5px;padding:3px 7px}

/* 조작 패널 안의 격자 편집기 */
/* 칠하기 팔레트 — 칠할 것을 먼저 고르고 칸을 찍거나 쓸어내린다. */
.paint{margin-bottom:8px}
.paint .prow{display:flex;align-items:center;gap:5px;margin-bottom:5px;flex-wrap:wrap}
.paint .pl{font-size:11.5px;font-weight:800;color:var(--muted);flex:0 0 30px}
.pb{font:700 12px/1 system-ui,sans-serif;cursor:pointer;color:var(--muted);
  background:var(--surface2);border:1px solid var(--control-border);border-radius:4px;padding:6px 10px}
.pb:hover{color:var(--text);border-color:var(--info)}
.pb.on{color:#0A0F14;background:var(--muted);border-color:var(--text)}
.pb.keep.on{background:var(--surface3);color:var(--text);border-color:var(--border2)}
/* 좌표 보정 기준점 마커 (조작 패널에만 표시. 표출 화면에는 세팅 흔적을 남기지 않는다) */
.refpt{
  position:absolute;transform:translate(-50%,-50%);z-index:6;pointer-events:none;
  width:18px;height:18px;border-radius:50%;background:var(--info);color:#04121C;
  border:2px solid #fff;display:flex;align-items:center;justify-content:center;
  font:800 11px/1 system-ui,sans-serif;
}
.geo{margin-top:10px;border-top:1px solid var(--border);padding-top:9px}
.geo-h{font-size:12.5px;font-weight:800;margin-bottom:6px}
.geo-h .hint{margin-left:6px}
.geo-row{display:flex;align-items:flex-end;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.geo-xy{font-size:11.5px;color:var(--muted);flex:0 0 118px}
.geo-f{flex:1 1 96px;min-width:0;margin:0}
.geo-f>span{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:2px}
.geo-f>input{width:100%}
.geo-read{color:var(--info);font-weight:700}
.pb.undo{border-color:var(--border2)}
.pb.undo[disabled]{opacity:.4;cursor:default}
.pb.p1.on{background:var(--warn)}
.pb.p2.on{background:var(--ok);color:#04140A}
.pb.p3.on{background:var(--danger);color:#1A0505}
/* touch-action:none 이 없으면 터치로 쓸어내릴 때 페이지가 스크롤돼 칠하기가 끊긴다. */
.cons-map{position:relative;width:100%;aspect-ratio:16/10;border:1px solid var(--border2);
  border-radius:6px;overflow:hidden;background:#0B1219;cursor:crosshair;touch-action:none}
.cons-map .gcell{font-size:12px;cursor:pointer}
.cons-map .gcell .by{font-size:9px}
.cons-map .gcell:focus{outline:3px solid var(--accent);outline-offset:-3px}
.paste-zone{
  border:2px dashed var(--border2);border-radius:6px;padding:14px;text-align:center;
  color:var(--muted);font-size:12.5px;line-height:1.6;cursor:pointer;background:#0B1218;
}
.paste-zone:focus{outline:2px solid #3B82F6;color:var(--text)}
.paste-zone.hot{border-color:var(--accent);color:var(--text)}
.paste-zone.has{border-style:solid;border-color:#166534;color:#B8C9D9}
.paste-zone kbd{
  font:inherit;font-weight:800;background:var(--surface3);border:1px solid var(--border2);
  border-radius:4px;padding:1px 5px;color:var(--text);
}
.map-msg{font-size:11.5px;margin-top:6px;line-height:1.55;min-height:17px}
.map-msg .ok{color:#86EFAC;font-weight:700}
.map-msg .warn{color:#FCD34D;font-weight:700}
.map-msg .err{color:#FCA5A5;font-weight:700}
.warn-strip{
  background:#33210A;border:1px solid #7C4A0A;color:#FDE68A;border-radius:6px;
  padding:9px 11px;font-size:12.5px;line-height:1.55;margin-bottom:12px;
}
.warn-strip.danger{background:#3B1010;border-color:#991B1B;color:#FCA5A5}
/* 상단에 두면 조작 패널의 상단 바(편집권·표출 화면 열기)와 표출 화면의 발견 배너를
   동시에 덮는다. 둘 다 이 경고보다 먼저 눌러야 하는 것들이라 하단으로 내린다. */
.system-alert{
  position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:9500;
  width:min(860px,calc(100vw - 24px));background:#7F1D1D;color:#fff;border:1px solid #EF4444;
  border-radius:7px;padding:10px 14px;font:700 13px/1.45 system-ui,sans-serif;
  box-shadow:0 8px 30px rgba(0,0,0,.55)
}
/* 우상단에 두면 발견 배너의 "확인" 버튼과 정확히 겹쳐(z-index 9000 > 배너 8000)
   경보 확인 클릭을 이 칩이 가로챈다. 배너와 절대 겹치지 않는 우하단으로 옮긴다. */
.audio-arm{
  position:fixed;right:1rem;bottom:4.2rem;z-index:9000;border:1px solid #F5A524;
  background:#33210A;color:#FDE68A;border-radius:.35rem;padding:.35rem .7rem;
  font:700 1rem/1.2 system-ui,sans-serif;cursor:pointer
}

/* Ctrl+E 드로어 (표출 화면 위에 겹쳐 열림) */
.drawer{
  position:fixed;inset:0;z-index:7000;background:rgba(3,6,10,.72);
  display:flex;justify-content:flex-end;
}
.drawer-in{
  width:min(760px,94vw);height:100%;overflow-y:auto;background:#0A0F15;
  border-left:1px solid var(--border2);box-shadow:-1rem 0 3rem rgba(0,0,0,.7);
}
.drawer-in .cons{max-width:none;font-size:14px}

/* 장갑·현장 태블릿에서는 시각적 밀도보다 확실한 터치 성공률을 우선한다. */
@media (pointer:coarse){
  .btn,.pb,.ct-nav button,.sens-pick button,.alert-banner button{min-width:44px;min-height:44px}
  .btn.sm{padding:10px 12px;font-size:13px}
  input:not([type="color"]):not([type="range"]):not([type="checkbox"]),select{min-height:44px}
  input[type="color"],input[type="range"]{min-height:44px}
  input,select,textarea{font-size:16px}
  input[type="checkbox"]{width:22px;height:22px;transform:none}
  .chkline{min-height:44px;gap:10px}
  .row-tools,.paint .prow,.sens-pick{gap:8px}
  .cons-map{overflow:auto;touch-action:pan-x pan-y;overscroll-behavior:contain;cursor:default}
  .cons-map .mapfit{
    position:relative !important;top:auto !important;left:auto !important;
    transform:none !important;margin:auto;
  }
  .cons-map .gcell{min-width:44px;min-height:44px}
}

/* 세로가 짧은 휴대 화면에서는 상단 바가 화면 절반을 계속 가리지 않게 스크롤시킨다. */
@media (max-width:480px),(max-height:640px){
  .cons{padding-left:10px;padding-right:10px}
  .cons-top{position:relative;margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px}
  .cons-top .ct-nav{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;padding-bottom:5px}
  .ct-nav button{flex:0 0 auto}
}

@media (prefers-reduced-motion:reduce){
  .kpi.lv-crit,.drone.st-flying.crit,.alert-banner,.alert-banner.manned,.btn.alarm.on{
    animation:none !important;
  }
  .ticker{height:auto;min-height:3.3rem;max-height:6.9rem}
  .tk-move,.tk-move.scroll{
    animation:none !important;transform:none !important;white-space:normal;will-change:auto;
    width:100%;max-height:3.5rem;overflow:hidden;display:-webkit-box;
    -webkit-box-orient:vertical;-webkit-line-clamp:2;
  }
  .tk-track{height:auto;max-height:3.5rem;overflow:hidden}
  .gcell,.cov-bar i,.bar i,#dimmer{transition:none !important}
}

/* 글자 배율과 화면의 열 너비를 분리해 확대해도 수색지도가 밀려나지 않게 한다. */
.board{--unit:calc(min(100vw / 120, 100vh / 67.5))}
.hdr{grid-template-columns:calc(22.5 * var(--unit)) minmax(0,1fr) calc(13.5 * var(--unit))}
.cols{grid-template-columns:calc(21.5 * var(--unit)) minmax(0,1fr) calc(25.5 * var(--unit))}
.col-c{display:grid;grid-template-rows:minmax(0,3fr) minmax(0,1fr)}
.col-l{display:grid;grid-template-rows:minmax(0,1.4fr) minmax(0,.9fr) minmax(0,1fr)}
.col-l>.card{min-height:0 !important;max-height:none !important}
.col-r{display:grid;grid-template-rows:minmax(0,2.3fr) minmax(0,1fr)}
.col-r>.card{min-height:0;max-height:none}
.card-grid,.card-safety{min-height:0}
.kpis{min-width:0;grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{container-type:inline-size}
.kpi-v{font-size:min(4.3rem,24cqw)}
.kpi-v small{font-size:min(1.5rem,7cqw)}
.kpi-flight .kpi-v{font-size:min(3.1rem,16cqw)}
.kpi-flight .dot{width:.65em;height:.65em}
.kpi-s{font-size:min(.98rem,6cqw)}
.brand{font-size:calc(1.6 * var(--unit))}
.brand .app-version{font-size:calc(.88 * var(--unit))}
.clock{font-size:calc(3.05 * var(--unit))}
.cov{flex-wrap:wrap;gap:.35rem .65rem}
.cov-bar{min-width:3rem}
.cov-pct{font-size:min(3.1rem,calc(4 * var(--unit)))}
.radchip .rl{font-size:min(1rem,calc(1.1 * var(--unit)))}
.radchip .rv{font-size:min(2rem,calc(2.5 * var(--unit)))}
.legend{flex:1 0 100%;justify-content:flex-end;flex-wrap:wrap;gap:.35rem .65rem}
.legend{font-size:min(1.15rem,calc(1.3 * var(--unit)))}
.card-h{min-width:0;flex-wrap:wrap;gap:.2rem .5rem}
.card-h .h-right{white-space:normal;overflow-wrap:anywhere;font-size:1rem}
.sf .sl{white-space:normal}
.sf{flex-basis:calc(8 * var(--unit))}
.sf.wide{flex-basis:calc(15 * var(--unit))}
.wx .sf{flex-basis:calc(6 * var(--unit))}
.sf .sl{font-size:min(1rem,calc(1.1 * var(--unit)))}
.sf .sv{font-size:min(1.34rem,calc(1.6 * var(--unit)))}
.sf.wide .sv{font-size:min(1.15rem,calc(1.25 * var(--unit)))}
.wx .sf:last-child .sv{white-space:normal;overflow-wrap:anywhere}
.large-type .col-c{grid-template-rows:minmax(0,1.8fr) minmax(0,1fr)}
.large-type .alert-banner .ab-k{font-size:calc(2.6 * var(--unit))}
.large-type .alert-banner .ab-x{font-size:calc(1.8 * var(--unit))}
.large-type .d-rows{grid-template-columns:repeat(2,minmax(0,1fr))}
.large-type .log-row{grid-template-columns:max-content minmax(0,1fr);gap:.2rem .4rem}
.large-type .log-row .lx{grid-column:1/-1}
.large-type .pin .plb{font-size:calc(1.05 * var(--unit))}
.large-type .pin .pdot{width:calc(1.2 * var(--unit));height:calc(1.2 * var(--unit))}
.large-type .pin .stem{height:calc(.8 * var(--unit))}
.d-rows em{word-break:keep-all}
.d-top,.d-foot{flex-wrap:wrap}
.endur{flex-wrap:wrap;gap:.3rem}
.endur .ev{white-space:nowrap}
.battery-stamp{color:var(--muted);font-size:.86rem;line-height:1.35;margin:.15rem 0 .35rem}
.cons .battery-stamp{font-size:13px;margin:0}
.setup-section,.settings-fold{border:1px solid var(--border2);border-radius:8px;margin-bottom:12px;background:var(--surface)}
.setup-section>summary,.settings-fold>summary{
  cursor:pointer;padding:12px;font-size:14px;font-weight:750;color:var(--text);list-style-position:inside;
}
.setup-section>summary span{display:block;font-size:13px;font-weight:400;color:var(--muted);margin:4px 0 0 17px}
.setup-section>.sec{border:0;margin-bottom:0}
.setup-section[open]>summary,.settings-fold[open]>summary{border-bottom:1px solid var(--border)}
.settings-fold{background:transparent;margin:8px 0 0}
.settings-fold>div{padding:12px}
summary:focus-visible{outline:3px solid #7DD3FC;outline-offset:2px}
.operator-start{padding:12px 14px;margin-bottom:12px;border:1px solid var(--border2);border-radius:8px;color:var(--muted);font-size:14px}
.operator-start .row-tools{margin-top:7px}
.item-h{flex-wrap:wrap}
.cons .sec>h2{font-size:15px;flex-wrap:wrap}
.cons .sec>h2 .hint{font-size:12.5px}
.cons .ct-nav button{font-size:13px;min-height:32px}
.cons .ct-nav button[aria-current="location"]{background:var(--surface3);color:var(--text);border-color:var(--info)}
.grid-editor-columns{grid-template-columns:minmax(0,1fr)}
@media (pointer:coarse){.cons .ct-nav button,summary{min-height:44px}}
@media print{body{background:#fff}}
</style>
</head>
<body>
<div id="dimmer"></div>
<div class="system-alert" id="systemAlert" role="alert" hidden></div>

<!-- ======================= 표출 화면 (대형 스크린) ======================= -->
<div class="board" id="board" hidden>

  <div class="alert-banner" id="alertBanner" role="alert" aria-live="assertive" aria-atomic="true" hidden></div>
  <button class="audio-arm" id="audioArm" type="button" hidden>&#9654;&#65038; 경보음 준비</button>

  <header class="hdr">
    <div class="hdr-id">
      <div class="brand"><span class="su">STAY UP</span><span class="sep">|</span>현장 상황판<span class="app-version" id="appVersion"></span></div>
      <div class="mission" id="hMission">상황명 미입력</div>
      <div class="mission-sub" id="hLoc">수색 장소 미입력</div>
    </div>

    <div class="kpis">
      <div class="kpi lv-idle" id="kGolden">
        <div class="kpi-l">골든타임 잔여</div>
        <div class="kpi-v num" id="vGolden">--:--</div>
        <div class="kpi-s" id="sGolden">실종시각 미입력</div>
      </div>
      <div class="kpi lv-idle" id="kSunset">
        <div class="kpi-l">일몰까지</div>
        <div class="kpi-v num" id="vSunset">--:--</div>
        <div class="kpi-s" id="sSunset">좌표 미입력</div>
      </div>
      <div class="kpi kpi-flight lv-idle" id="kFlight">
        <div class="kpi-l">비행 가능 판정</div>
        <div class="kpi-v" id="vFlight"><i class="dot"></i>확인중</div>
        <div class="kpi-s" id="sFlight">&nbsp;</div>
      </div>
      <div class="kpi lv-idle" id="kElapsed">
        <div class="kpi-l">출동 경과</div>
        <div class="kpi-v num" id="vElapsed">--:--</div>
        <div class="kpi-s" id="sElapsed">출동시각 미입력</div>
      </div>
    </div>

    <div class="hdr-clock">
      <div class="clock num" id="hClock">--:--:--</div>
      <div class="cdate" id="hDate">&nbsp;</div>
    </div>
  </header>

  <main class="cols">
    <!-- ---------- 좌열 ---------- -->
    <section class="col col-l">
      <div class="card" style="flex:0 0 auto;max-height:54%">
        <div class="card-h"><h2>실종자 정보</h2><span class="h-right" id="subjTracker"></span></div>
        <div class="card-b" id="subjBody"></div>
      </div>
      <div class="card" style="flex:0 0 auto">
        <div class="card-h"><h2>배터리 자원</h2><span class="h-right" id="battGen"></span></div>
        <div class="card-b" id="battBody"></div>
      </div>
      <div class="card" style="flex:1 1 auto;min-height:7rem">
        <div class="card-h"><h2>출동 인원</h2><span class="h-right" id="crewCount"></span></div>
        <div class="card-b" id="crewBody"></div>
      </div>
    </section>

    <!-- ---------- 중앙열 ---------- -->
    <section class="col col-c">
      <div class="card card-grid">
        <div class="card-h">
          <h2>수색구역 현황</h2>
          <span class="h-right" id="gridMeta"></span>
        </div>
        <div class="card-b">
          <div class="mapwrap" id="mapWrap"></div>
          <div class="cov">
            <div class="cov-pct num"><span id="covPct">0</span><small>%</small></div>
            <div class="cov-bar" id="covBar"></div>
            <div class="radchip" id="radChip"></div>
            <div class="legend">
              <span><i class="l2"></i><b id="cnt2">0</b> 완료</span>
              <span><i class="l1"></i><b id="cnt1">0</b> 수색중</span>
              <span><i class="l3"></i><b id="cnt3">0</b> 재수색</span>
              <span><i class="l0"></i><b id="cnt0">0</b> 미수색</span>
            </div>
          </div>
        </div>
      </div>
      <div class="card card-safety">
        <div class="card-h"><h2>안전 · 규제 · 기상</h2><span class="h-right" id="wxStamp"></span></div>
        <div class="card-b" id="safetyBody"></div>
      </div>
    </section>

    <!-- ---------- 우열 ---------- -->
    <section class="col col-r">
      <div class="card card-drones">
        <div class="card-h"><h2>드론 운용 현황</h2><span class="h-right" id="droneMeta"></span></div>
        <div class="card-b" id="droneBody"></div>
      </div>
      <div class="card card-log">
        <div class="card-h"><h2>이벤트 타임라인</h2><span class="h-right" id="logMeta"></span></div>
        <div class="card-b" id="logBody"></div>
      </div>
    </section>
  </main>

  <footer class="ticker">
    <span class="tk-lb">지휘부 지시</span>
    <div class="tk-track" tabindex="0" aria-label="지휘부 지시, 포커스하거나 마우스를 올리면 흐름이 멈춥니다"><div class="tk-move" id="tkMove">—</div></div>
    <div class="tk-right" id="tkRight"></div>
  </footer>
</div>

<!-- ======================= 조작 패널 ======================= -->
<div id="consoleRoot" hidden></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="STAY UP 조작 패널" hidden><div class="drawer-in" id="drawerIn"></div></div>

<script>

function showSystemAlert(message){

}
function refreshSystemAlert(){

  else if(!SAVE_STATUS.backupOk)showSystemAlert('현재 입력은 저장됐지만 자동 복구본 생성 실패: '+(SAVE_STATUS.backupMessage||'저장공간을 확인하세요.'));
  else if(SAVE_STATUS.backupNote)showSystemAlert(SAVE_STATUS.backupNote);
  else showSystemAlert('');
}
function setSaveStatus(ok, message){

  refreshSystemAlert();
}
function persistCandidate(candidate){
  try{
    if(!epochCurrent())throw new Error('출동 종료 후 열린 이전 창입니다. 새로고침하세요.');
    if(!ownsEditorLock())throw new Error('편집권이 다른 조작 창으로 이동했습니다. 최신 화면을 확인하세요.');
    candidate.meta.epoch=SESSION_EPOCH;
    var raw=JSON.stringify(candidate); localStorage.setItem(KEY,raw);
    if(localStorage.getItem(KEY)!==raw) throw new Error('저장 확인 실패');
    setSaveStatus(true,''); return true;
  }catch(e){ console.warn('저장 실패',e); setSaveStatus(false,e&&e.name?e.name:String(e)); return false; }
}
function touchState(state){
  var now=Date.now(); state.meta.v=STATE_VERSION;state.meta.epoch=SESSION_EPOCH;
  state.meta.updated=Math.max(now,sanNum(state.meta.updated,0,Number.MAX_SAFE_INTEGER,0,false)+1);
  state.meta.revision=sanInt(state.meta.revision,0,Number.MAX_SAFE_INTEGER-1,0)+1;

function touch(){ touchState(S); }
function persist(){ return persistCandidate(S); }

  try{

    canonical.meta.epoch=SESSION_EPOCH;painting=null;

function commit(){

  /* 저장에 실패한 상태(완전삭제 후 남은 이전 세대 창 등)를 상대 창으로 내보내지 않는다.
     내보내면 삭제된 실종자 정보가 표출 화면에 되살아난다. */

  else {rollbackStoredState();if(sweepBefore&&epochCurrent()&&ownsEditorLock())lastSweep=sweepBefore;}
  renderAll(); return ok;

function getSnapshots(){
  try{ var a=JSON.parse(localStorage.getItem(SNAPKEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){return [];}
}
/* 작업 직전 복구점이 있어도 30초 자동 복구본을 숨기지 않는다. 현장에서 실수 직전과
   더 최근 자동 저장 중 무엇으로 돌아갈지 운영자가 시각·사유를 보고 고를 수 있어야 한다. */
function recoveryCandidates(){
  var out=[],seen={};
  function add(key,kind,x){
    if(!x||!isPlainObject(x.state))return;
    var t=intv(x.t,0),mapId=x.state.grid&&x.state.grid.mapId||'';
    var stable=key+':'+t+':'+intv(x.state.meta&&x.state.meta.updated,0)+':'+mapId;
    if(t<=0)return;
    if(seen[stable])return;seen[stable]=true;
    out.push({key:stable,kind:kind,t:t,reason:String(x.reason||'').slice(0,60),record:x});
  }
  try{add('point','작업 전',JSON.parse(localStorage.getItem(RECOVERY_KEY)||'null'));}catch(e){}
  getSnapshots().slice().sort(function(a,b){return intv(b&&b.t,0)-intv(a&&a.t,0);})
    .slice(0,5).forEach(function(x){add('snapshot','자동',x);});
  return out;
}
function recoveryChoiceHtml(){
  var cs=recoveryCandidates();
  if(!cs.length)return '<select id="recoveryPick" aria-label="복구본 선택" disabled><option>복구본 없음</option></select>';
  return '<select id="recoveryPick" aria-label="복구본 선택">'+cs.map(function(c){
    return '<option value="'+esc(c.key)+'">'+esc(c.kind+' · '+shortDateTime(c.t)+' · '+(c.reason||'복구본'))+'</option>';
  }).join('')+'</select>';
}
/* 이벤트가 한도(MAX_EVENTS)에 가까우면 상태 사본 5개가 localStorage 할당량을 넘는다.
   전부 실패해 복구본이 0개가 되는 것보다, 세대를 줄여서라도 최근 것을 남기는 편이 낫다. */
function createSnapshot(reason){
  if(!STORAGE_OK||!epochCurrent()||!ownsEditorLock()||S.meta.updated===lastSnapshotUpdated)return true;
  var a, lastErr=null, wanted=0;
  try{
    a=getSnapshots(); a.push({t:Date.now(),reason:reason||'자동',state:JSON.parse(JSON.stringify(S))});
    if(a.length>5) a=a.slice(-5);
    wanted=a.length;   /* 이번에 남기려던 세대 수. 이보다 줄었을 때만 경고한다. */
  }catch(e){ a=null; lastErr=e; }
  while(a&&a.length){
    try{
      localStorage.setItem(SNAPKEY,JSON.stringify(a));
      lastSnapshotUpdated=S.meta.updated;SAVE_STATUS.backupOk=true;SAVE_STATUS.backupMessage='';
      SAVE_STATUS.backupNote=a.length<wanted?'저장공간이 부족해 복구본을 '+a.length+'세대만 유지합니다. 지금 JSON을 내보내세요.':'';
      refreshSystemAlert();gcMapBlobs();return true;
    }catch(e2){ lastErr=e2; a=a.slice(1); }
  }
  console.warn('복구본 저장 실패',lastErr);
  SAVE_STATUS.backupOk=false;SAVE_STATUS.backupMessage=lastErr&&lastErr.name?lastErr.name:String(lastErr);

function saveRecoveryPoint(reason){

      map:S.grid.mapId?null:(MAPDATA||null)}));

function gcMapBlobs(){
  /* 읽기 전용 표출 창은 상태가 늦을 수 있다. 그 창이 오래된 참조만 보고 최신 지도를
     지우지 못하도록 정리는 단일 편집자만 수행한다. */
  if(!ownsEditorLock()) return Promise.resolve(false);
  var gcSeq=mapGcGeneration;
  var keep={};
  try{if(S.grid.mapId)keep[S.grid.mapId]=true;}catch(e){}
  try{
    var live=JSON.parse(localStorage.getItem(KEY)||'null');
    var lid=live&&live.grid&&live.grid.mapId;if(lid)keep[lid]=true;
  }catch(e){}
  try{getSnapshots().forEach(function(x){var id=x&&x.state&&x.state.grid&&x.state.grid.mapId;if(id)keep[id]=true;});}catch(e){}
  try{
    var rr=JSON.parse(localStorage.getItem(RECOVERY_KEY)||'null');
    var rid=rr&&rr.state&&rr.state.grid&&rr.state.grid.mapId;if(rid)keep[rid]=true;
  }catch(e){}
  /* localStorage 잔재 (구버전·폴백 환경) */
  if(STORAGE_OK)try{
    var keys=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(MAP_PREFIX)===0)keys.push(k);}
    keys.forEach(function(k){var id=k.slice(MAP_PREFIX.length);if(!keep[id])localStorage.removeItem(k);});

  return mapBlobKeys().then(function(ks){
    /* 키를 읽는 사이 새 지도 저장이 시작됐다면, 그 블롭은 아직 상태에서 참조되기
       전일 수 있다. 이 정리 회차를 버리고 새 커밋 뒤 정리에 맡긴다. */
    if(gcSeq!==mapGcGeneration||!ownsEditorLock())return false;

  if(id&&idbBroken){try{if(idbDB)idbDB.close();}catch(e){}idbDB=null;idbBroken=false;}
  var get = id ? mapBlobGet(id) : Promise.resolve((function(){
    try{ return localStorage.getItem(MAPKEY); }catch(e){ return null; }   /* 구버전 단일 키 */
  })());
  function warn(msg){

  function stillWanted(){
    return lifecycleCurrent(opSeq,opEpoch)&&S.grid.hasMap
      &&S.grid.mapVer===want&&S.grid.mapId===id;
  }
  get.then(function(m){
    if(!stillWanted()) return; /* 삭제됐거나 그 사이 같은 판 번호의 다른 지도로 바뀌었다 */
    if(!validMapData(m)){ dropMissingMap(); return; }

  }, function(){

       블롭이 실제로 없어진 것과 저장소를 못 읽은 것은 다르게 다뤄야 한다. */

     지리 범위(geo)와 원본 크기는 이미지와 별개로 유효하므로 남긴다 —
     같은 지도를 다시 넣으면 좌표 보정이 그대로 이어진다. */

    if(!ownsEditorLock()){ renderGridAll(); return; }   /* 정정은 편집 창의 몫 */
    S.grid.hasMap=false; S.grid.mapId=null;
    S.grid.mapW=0; S.grid.mapH=0; S.grid.mapKB=0;

    S.grid.mapVer = sanInt(S.grid.mapVer,0,2147483646,0)+1;

/* 이미지 본체를 저장소에 먼저 쓰고, 성공하면 상태를 동기로 커밋한다.

  if(!saveRecoveryPoint('격자 크기 변경 전')){alert('복구본을 만들 수 없어 격자 변경을 중단했습니다.');return false;}
  var candidate=migrate(S);candidate.grid.rows=rows;candidate.grid.cols=cols;resetSpatialGrid(candidate,false);touchState(candidate);

function saveMap(dataUrl,meta,opSeq,opEpoch,fileSeq){
  if(!ensureEditor()) return Promise.resolve(false);
  if(opSeq===undefined)opSeq=stateLifecycleSeq;
  if(opEpoch===undefined)opEpoch=SESSION_EPOCH;
  if(fileSeq===undefined)fileSeq=++fileMutationSeq;
  if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq))return Promise.resolve(false);
  mapGcGeneration++;
  if(dataUrl&&!validMapData(dataUrl)){
    mapMsg('지원하지 않거나 너무 큰 지도 이미지입니다 · 한도 '

      ?'다른 지도 이미지로 교체할까요?\n기존 구역 상태·담당, 기체 담당구역, 핀과 좌표 보정을 초기화합니다. 작업 전 상태는 복구본에 보관합니다.'
      :'지도 이미지와 기존 구역 상태·담당, 기체 담당구역, 핀, 좌표 보정을 지울까요? 작업 전 상태는 복구본에 보관합니다.'))return Promise.resolve(false);
  if(hadSpatial&&!saveRecoveryPoint(dataUrl?'지도 교체 전':'지도 삭제 전')){
    mapMsg('복구본을 만들 수 없어 지도 변경을 중단했습니다. 저장공간을 확인하세요.','err');
    return Promise.resolve(false);
  }
  var recoveryRevision=S.meta.revision;
  var newId = dataUrl ? uid() : null;
  return (dataUrl ? mapBlobPut(newId, dataUrl) : Promise.resolve()).then(function(){
    if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq)){if(newId)mapBlobDel(newId);return false;}
    /* 큰 이미지가 저장되는 동안 추가한 입력도 작업 전 복구본에 포함한다. */
    if(!sameImage&&S.meta.revision!==recoveryRevision&&!saveRecoveryPoint(dataUrl?'지도 교체 전':'지도 삭제 전')){
      if(newId)mapBlobDel(newId);mapMsg('최신 입력의 복구본을 만들 수 없어 지도 변경을 중단했습니다.','err');return false;

    mapMsg('지도 저장에 실패했습니다 · '+(e&&e.message?e.message:e),'err');

function commitMap(dataUrl,meta,newId,opSeq,opEpoch,fileSeq){
  var candidate=migrate(S),hadLegacyMap=!!(S.grid.hasMap&&!S.grid.mapId);
  try{
    if(!lifecycleCurrent(opSeq,opEpoch)||!fileMutationCurrent(fileSeq))throw new Error('더 최신 지도 작업이 시작됐습니다.');
    var sameImage=!!(dataUrl&&MAPDATA&&dataUrl===MAPDATA);
    candidate.grid.mapId = dataUrl ? newId : null;
    candidate.grid.hasMap=!!dataUrl; candidate.grid.mapVer=(candidate.grid.mapVer||0)+1;
    candidate.grid.mapW=meta?sanInt(meta.w,0,20000,0):0; candidate.grid.mapH=meta?sanInt(meta.h,0,20000,0):0;
    candidate.grid.mapNatW=meta?sanInt(meta.natW,0,200000,0):0;
    candidate.grid.mapNatH=meta?sanInt(meta.natH,0,200000,0):0;
    /* 픽셀 크기가 같아도 다른 장소의 지도일 수 있다. 이미지 본체가 완전히 같을 때만
       좌표 보정을 유지하고, 그 외에는 화면 변환까지 원점으로 되돌린다. */
    if(!sameImage){
      resetSpatialGrid(candidate,true);
      candidate.grid.geo=null; candidate.grid.ref1=null; candidate.grid.ref2=null;
      candidate.grid.mapZoom=100;candidate.grid.mapX=0;candidate.grid.mapY=0;
    }
    candidate.grid.mapKB=dataUrl?Math.round(dataUrl.length/1024):0; touchState(candidate);
    if(!persistCandidate(candidate)) throw new Error('상태 저장 실패');
    S=candidate;MAPDATA=dataUrl||null;mapVerLoaded=S.grid.mapVer;mapIdLoaded=dataUrl?S.grid.mapId:null;lastSeenUpdated=S.meta.updated;
    if(!sameImage){lastSweep=null;painting=null;pinMode=null;gridDimensionsDraft=null;}
    if(hadLegacyMap)try{localStorage.removeItem(MAPKEY);}catch(ignore){}
  }catch(e){
    mapMsg('지도 저장에 실패해 이전 지도로 되돌렸습니다. 저장공간을 확인하세요.','err');
    renderAll(); return false;
  }
  /* 이 시점에는 KEY와 지도 블롭이 모두 확인됐다. 이후 렌더 예외는 저장 실패로
     돌리지 않아 참조 중인 새 블롭을 호출자가 삭제하지 않게 한다. */
  try{
    broadcast();renderAll();gcMapBlobs();
    sendPeer({type:'map',ver:S.grid.mapVer,data:dataUrl||null});
    mapMsg(dataUrl?'지도 적용·저장 완료 · '+S.grid.mapW+'×'+S.grid.mapH+' · 약 '+S.grid.mapKB+'KB · '+mapStoreLabel()
      :'지도 이미지를 삭제했습니다.',dataUrl?'ok':'warn');
  }catch(e){console.warn('지도 저장 후 화면 갱신 실패',e);}
  return true;
}

window.addEventListener('message',function(ev){
  var m=ev.data; if(!m||m.ch!=='stayup'||ev.source===window) return;
  var expectedOrigin=location.protocol==='file:'?'null':location.origin;
  if(ev.origin!==expectedOrigin)return;
  if(m.type==='hello'){
    if(MODE!=='console') return; peer=ev.source; lastPeerSeen=Date.now();
    sendPeer({type:'helloAck'}); broadcast(); if(MAPDATA)sendPeer({type:'map',ver:S.grid.mapVer,data:MAPDATA}); return;
  }
  if(ev.source!==peer&&ev.source!==window.opener) return;
  lastPeerSeen=Date.now(); if(ev.source)peer=ev.source;
  if(m.type==='helloAck'||m.type==='pong'||m.type==='ack') return;
  if(m.type==='ping'){sendPeer({type:'pong'});return;}
  if(m.type==='purge'){
    stateLifecycleSeq++;mapGcGeneration++;fileMutationSeq++;resetAutoSaveSession();
    S=defaultState();MAPDATA=null;mapVerLoaded=-1;mapIdLoaded=null;
    if(MODE==='display'&&m.epoch)SESSION_EPOCH=m.epoch;
    STARTUP_WARNINGS=['출동 종료로 상황 데이터가 완전 삭제되었습니다.'];renderAll();return;
  }
  if(m.type==='state'){adopt(m.state,false);sendPeer({type:'ack',revision:S.meta.revision});}
  else if(m.type==='map'){
    if(m.data&&!validMapData(m.data)) return;
    if(m.ver==null||m.ver!==S.grid.mapVer)return;
    if((m.data&&!S.grid.hasMap)||(!m.data&&S.grid.hasMap))return;
    MAPDATA=m.data||null;mapVerLoaded=m.ver;mapIdLoaded=m.data?(S.grid.mapId||'legacy'):null;
    renderGridAll(); sendPeer({type:'ack',revision:S.meta.revision});
  }else if(m.type==='action'&&ownsEditorLock()){handlePeerAction(m);}
});

/* localStorage 폴링 - 읽기 화면은 저장소의 단일 편집자 상태를 따라간다. */
function pollStore(){
  try{

        stateLifecycleSeq++;mapGcGeneration++;fileMutationSeq++;resetAutoSaveSession();SESSION_EPOCH=localStorage.getItem(EPOCHKEY)||SESSION_EPOCH;S=defaultState();S.meta.epoch=SESSION_EPOCH;MAPDATA=null;mapVerLoaded=-1;mapIdLoaded=null;renderAll();
      }else if(!epochInvalidNotified){epochInvalidNotified=true;stateLifecycleSeq++;mapGcGeneration++;fileMutationSeq++;resetAutoSaveSession();
        S=defaultState();MAPDATA=null;mapVerLoaded=-1;mapIdLoaded=null;
        STARTUP_WARNINGS=['다른 창에서 출동 종료 삭제가 실행되었습니다. 이 창을 새로고침하세요.'];renderAll();}
      lastPolledRaw=null;

       저장 원문이 지난번과 같으면 상태가 바뀌었을 수 없으므로 바로 빠져나간다. */

      else if(!ownsEditorLock()&&rr===sr&&o.meta.updated===S.meta.updated&&JSON.stringify(o)!==JSON.stringify(S))adopt(o,true);

/* ==========================================================================
   S4. 일몰 계산 (좌표만으로 오프라인 동작 · NOAA 태양위치 알고리즘)
   ========================================================================== */
var RAD = Math.PI/180, J1970 = 2440588, J2000 = 2451545, DAYMS = 86400000;
var OBLIQ = RAD * 23.4397;
function toJulian(d){ return d.valueOf()/DAYMS - 0.5 + J1970; }
function fromJulian(j){ return new Date((j + 0.5 - J1970) * DAYMS); }
function toDays(d){ return toJulian(d) - J2000; }
function meanAnomaly(d){ return RAD * (357.5291 + 0.98560028 * d); }
function eclipticLon(M){
  var C = RAD*(1.9148*Math.sin(M) + 0.02*Math.sin(2*M) + 0.0003*Math.sin(3*M));
  return M + C + RAD*102.9372 + Math.PI;
}
function declination(L){ return Math.asin(Math.sin(OBLIQ)*Math.sin(L)); }
function transitJ(ds,M,L){ return J2000 + ds + 0.0053*Math.sin(M) - 0.0069*Math.sin(2*L); }
function sunTimes(date, lat, lon){
  var lw = RAD * -lon, phi = RAD * lat;
  var d = toDays(date), n = Math.round(d - 0.0009 - lw/(2*Math.PI));
  var ds = 0.0009 + lw/(2*Math.PI) + n;
  var M = meanAnomaly(ds), L = eclipticLon(M), dec = declination(L);
  var Jnoon = transitJ(ds, M, L);
  function ev(hDeg){
    var h = hDeg * RAD;
    var cosw = (Math.sin(h) - Math.sin(phi)*Math.sin(dec)) / (Math.cos(phi)*Math.cos(dec));
    if(cosw > 1 || cosw < -1) return null;             /* 백야/극야 */
    var w = Math.acos(cosw);
    var Jset=transitJ(0.0009 + (w + lw)/(2*Math.PI) + n, M, L);
    return {rise:fromJulian(Jnoon-(Jset-Jnoon)),set:fromJulian(Jset)};
  }
  var sun=ev(-0.833), civil=ev(-6);
  return {sunrise:sun&&sun.rise,sunset:sun&&sun.set,
    dawn:civil&&civil.rise,dusk:civil&&civil.set,noon:fromJulian(Jnoon)};
}
/* 오늘(또는 이미 지났으면 내일)의 일몰 시각 */
function nextSunset(now, lat, lon){
  var t = sunTimes(now, lat, lon);
  if(t.sunset && t.sunset.getTime() > now.getTime()) return t;
  var t2 = sunTimes(new Date(now.getTime() + DAYMS), lat, lon);
  t2.tomorrow = true;
  return t2;
}
function sunPhase(now){
  var cs=coordinateStatus();
  if(!cs.ok) return {kind:'unknown',times:null};
  var t=sunTimes(now,cs.lat,cs.lon);
  if(!t.sunrise||!t.sunset) return {kind:'unknown',times:t};
  if(now.getTime()<t.sunrise.getTime()) return {kind:'beforeSunrise',times:t};
  if(now.getTime()>=t.sunset.getTime()) return {kind:'afterSunset',times:t};
  return {kind:'day',times:t};
}

/* ==========================================================================
   S5. 파생 계산
   ========================================================================== */
/* 셀 상태 집계 */
function gridRows(){ return clamp(intv(S.grid.rows,5),1,12); }
function gridCols(){ return clamp(intv(S.grid.cols,6),1,12); }
function gridStats(){
  var n = {0:0,1:0,2:0,3:0};
  var R = gridRows(), C = gridCols(), total = R*C;
  for(var r=0;r<R;r++) for(var c=0;c<C;c++){
    var cel0 = S.grid.cells[cellId(r,c)];
    n[(cel0 && cel0.s) || 0]++;
  }
  return { n:n, total:total, pct: total ? Math.round(n[2]/total*100) : 0 };
}
/* 기체 잔여 비행시간 추정: 100% -> 착륙 유보 25% 구간을 항속시간으로 본다 */
function droneRemainMin(d){
  var end = num(d.endurance, 25);
  var b = num(d.battery, 0);
  if(end <= 0) return 0;
  var rate = 75 / end;            /* %/분 */
  return Math.max(0, Math.round((b - 25) / rate));
}
/* 지속 운용 가능시간(시간) = 충전완료 배터리 x 평균 항속 / 동시 운용대수 */
function endurHours(){
  var b = S.batteries;
  var conc = Math.max(1, intv(b.concurrent,2));
  return (intv(b.ready,0) * num(b.avgFlightMin,25)) / conc / 60;
}
function isNight(now){
  var p=sunPhase(now);
  return p.kind==='unknown'?null:(p.kind!=='day');
}
/* 비행 가능 판정 */
function flightVerdict(now){
  var sf = S.safety, w = S.weather;
  var bad = [], hold = [], warn = [], cs=coordinateStatus();
  if(sf.manned) bad.push('유인기 진입 · 전 기체 즉시 착륙');
  /* 비행 중 기체는 현행 명부의 '조종' 역할과 연결돼야 한다. 공란·미등록·다른 역할을
     정상으로 간주하면 조종자 없는 기체가 '비행 가능'으로 표시되는 fail-open 이 된다. */
  var pilotProblems=[],commloss=[];
  S.drones.forEach(function(d){
    if(d.status!=='flying'&&d.status!=='commloss') return;
    var droneName=d.name||'기체',pilotName=String(d.pilot||'').trim();
    if(d.status==='commloss')commloss.push(droneName);
    var activePilot=!!pilotName&&S.crew.some(function(c){
      var joined=tms(c.inAt);
      return String(c.name||'').trim()===pilotName&&c.role==='조종'&&!c.outAt
        &&joined>0&&joined<=now.getTime()+5*60000;
    });
    if(!activePilot)pilotProblems.push(droneName+(pilotName?' 조종자 현행 투입 확인 불가':' 조종자 미지정'));
  });
  commloss.forEach(function(name){bad.push(name+' 통신불량 · 즉시 착륙·비상절차 적용');});
  pilotProblems.forEach(function(problem){bad.push(problem);});
  if(String(sf.agencies||'').trim()) warn.push('인접기관 동시운용 · 공역 분리 확인');
  if(!cs.ok) hold.push(cs.why); else if(!cs.confirmed) hold.push(cs.why);
  if((sf.noFly||sf.ctrlZone)&&sf.approval!=='done')
    bad.push((sf.noFly?'비행금지구역':'관제권')+' · 승인완료 확인 필요');
  else if(['unknown','none','pending'].indexOf(sf.approval)>=0)
    hold.push('비행승인 '+({unknown:'미확인',none:'미신청',pending:'신청중'}[sf.approval]||'미확인'));
  var ws=cs.ok?weatherStatus(now):{ok:false,why:'현장 기상 확인 미완료'};
  if(!ws.ok) hold.push(ws.why);
  var wind=w.wind, gust=w.gust, lim=num(sf.windLimit,NaN), glim=num(sf.gustLimit,NaN);
  if(!isFinite(lim)||lim<=0) hold.push('지속풍 한계 미설정');
  if(!isFinite(glim)||glim<=0) hold.push('돌풍 한계 미설정');
  if(ws.ok&&isFinite(lim)){
    if(wind>=lim) bad.push('풍속 '+wind+'m/s (한계 '+lim+')');
    else if(wind>=lim*0.8-1e-9)warn.push('풍속 '+wind+'m/s 한계 근접');
  }
  if(ws.ok&&isFinite(glim)){
    if(gust>=glim) bad.push('돌풍 '+gust+'m/s (한계 '+glim+')');
    else if(gust>=glim*0.8-1e-9)warn.push('돌풍 '+gust+'m/s 한계 근접');
  }
  if(ws.ok&&w.rain) bad.push('강수 중');
  else if(ws.ok&&w.precip != null && w.precip >= 60) warn.push('강수확률 '+w.precip+'%');
  var night = isNight(now);
  if(night===null) hold.push('일출·일몰 판정 불가');
  else if(night && !sf.nightApproval) bad.push('야간 · 특별비행승인 없음');
  else if(night) warn.push('야간 비행(승인 보유)');
  if(night===false&&cs.ok){
    var ns = nextSunset(now,cs.lat,cs.lon);
    if(ns.sunset){
      var left = ns.sunset.getTime() - now.getTime();
      if(left > 0 && left <= 30*60000) warn.push('일몰 '+Math.ceil(left/60000)+'분 전');
    }
  }
  function unique(a){return a.filter(function(x,i){return a.indexOf(x)===i;});}
  if(bad.length)return {lv:'danger',txt:'비행 불가',why:unique(bad.concat(hold))};
  if(hold.length)return {lv:'idle',txt:'판정 보류',why:unique(hold)};
  if(warn.length) return { lv:'warn',   txt:'제한 비행', why:warn };
  return { lv:'ok', txt:'비행 가능', why:['제한사항 없음'] };
}
/* ==========================================================================
   S5b. 지도 좌표계 (지오레퍼런스)
   격자는 지금까지 픽셀 좌표계였고, 실제 거리와의 연결은 '지도 가로 실거리' 손입력
   하나뿐이었다. 그래서 무전으로 "C3"는 말할 수 있어도 지상팀 GPS에 찍을 좌표는
   줄 수 없었다. 지도 네 변의 위경도를 알면 모든 칸과 핀에 실제 좌표가 생긴다.
   지도 캡처와 정사영상은 정북 정렬이라 회전은 다루지 않는다.
   ========================================================================== */
var MPD_LAT = 111132;   /* 위도 1도당 미터 (평균) */
function geoOK(){
  var g = S.grid.geo;
  return !!(g && isFinite(g.west) && isFinite(g.east) && isFinite(g.north) && isFinite(g.south)
    && g.west !== g.east && g.north !== g.south);
}
/* 이미지 정규좌표(u,v: 0~1) -> 위경도. v 는 위에서 아래로 증가한다. */
function geoAt(u, v){
  if(!geoOK()) return null;
  var g = S.grid.geo;
  return { lat: g.north + clamp(v,0,1)*(g.south - g.north),
           lon: g.west  + clamp(u,0,1)*(g.east  - g.west) };
}
function cellCenterAt(r, c){ return geoAt((c+0.5)/gridCols(), (r+0.5)/gridRows()); }
function cellCenterById(id){
  var m = /^([A-L])(\d{1,2})$/.exec(String(id||'').toUpperCase());
  if(!m) return null;
  var r = m[1].charCodeAt(0)-65, c = parseInt(m[2],10)-1;
  if(r<0||r>=gridRows()||c<0||c>=gridCols()) return null;
  return cellCenterAt(r, c);
}
function fmtLatLon(p){ return p ? p.lat.toFixed(5)+', '+p.lon.toFixed(5) : ''; }
/* 보정이 있으면 가로 실거리를 계산해서 쓴다. 눈대중 축척 입력보다 정확하다. */
function mapWidthMeters(){
  if(geoOK()){
    var g = S.grid.geo, midLat = (g.north + g.south)/2;
    return Math.abs(g.east - g.west) * MPD_LAT * Math.cos(midLat*RAD);
  }
  return num(S.grid.widthMeters, 2000);
}
/* 네 변 값이 실제로 쓸 만한지 본다. 잘못된 좌표를 지상팀에 넘기면 안 된다. */
function validateGeo(geo){
  if(!geo) return {err:'좌표 계산에 실패했습니다.'};
  var w = Math.abs(geo.east-geo.west), h = Math.abs(geo.north-geo.south);
  if(!isFinite(w)||!isFinite(h)||w<=0||h<=0) return {err:'좌표 계산에 실패했습니다.'};
  if(Math.abs(geo.north)>90||Math.abs(geo.south)>90
     ||Math.abs(geo.west)>180||Math.abs(geo.east)>180)
    return {err:'좌표가 위경도 범위를 벗어났습니다.'};
  if(w > 2 || h > 2)
    return {err:'지도 범위가 비정상적으로 넓습니다(가로 약 '+Math.round(w*100)+'km). 입력값을 확인하세요.'};
  if(w < 0.00002 || h < 0.00002)
    return {err:'지도 범위가 비정상적으로 좁습니다. 입력값을 확인하세요.'};
  if(geo.north <= geo.south)
    return {err:'위쪽 기준점이 아래쪽보다 남쪽입니다. 두 점의 위도를 확인하세요.'};
  return {geo:geo};
}
/* 두 기준점에서 네 변을 유도한다. 두 점은 가로·세로가 모두 충분히 달라야 한다. */
function geoFromRefs(r1, r2){
  if(!r1 || !r2) return {err:'기준점 두 개를 모두 지도에 찍으세요.'};
  var u1=r1.x/100, v1=r1.y/100, u2=r2.x/100, v2=r2.y/100;
  if(Math.abs(u2-u1) < 0.05)
    return {err:'두 기준점의 좌우 간격이 너무 좁습니다. 대각선으로 떨어진 두 점을 쓰세요.'};
  if(Math.abs(v2-v1) < 0.05)
    return {err:'두 기준점의 상하 간격이 너무 좁습니다. 대각선으로 떨어진 두 점을 쓰세요.'};
  var lat1=num(r1.lat,NaN), lon1=num(r1.lon,NaN), lat2=num(r2.lat,NaN), lon2=num(r2.lon,NaN);
  if(!isFinite(lat1)||!isFinite(lon1)||!isFinite(lat2)||!isFinite(lon2))
    return {err:'기준점의 위도·경도를 모두 입력하세요.'};
  var dLon = (lon2-lon1)/(u2-u1), dLat = (lat2-lat1)/(v2-v1);
  var west = lon1 - u1*dLon, north = lat1 - v1*dLat;
  return validateGeo({west:west, north:north, east:west+dLon, south:north+dLat,
    src:'manual', at:Date.now()});
}
function geoSrcLabel(){
  if(!geoOK()) return '미보정';
  return {manual:'수동 2점', world:'좌표 파일(world)', kml:'좌표 파일(KML)'}[S.grid.geo.src] || '보정됨';
}

/* 실종 경과시간 기반 이동 추정반경(km) */
function moveRadiusKm(now){
  var t = tms(S.subject.missingAt);
  if(!t) return null;
  var h = (now.getTime() - t) / 3600000;
  if(h <= 0) return 0;
  return num(S.subject.walkSpeed,2) * h * num(S.subject.decay,0.35);
}

   S6. 표출 화면 렌더
   ========================================================================== */
function setKpi(id, lv){
  var el = $(id); if(!el) return;
  el.className = 'kpi' + (id==='kFlight' ? ' kpi-flight' : '') + ' lv-' + lv;

/* --------------------------------------------------------------------------
   상단 KPI 네 개
   표출 화면(대형 모니터)과 조작 패널(기록자 노트북)이 같은 계산을 써야 한다.
   노트북 1대 + 대형 모니터 구성에서 기록자는 조작 패널만 보므로, 이 넷을 보려고
   고개를 돌리게 하면 안 된다. 계산을 여기 한 곳에 두고 양쪽이 나눠 쓴다.
     v = 큰 숫자 · u = 단위 접미사 · s = 부제 · lv = 등급 · dot = 형태 표식 사용
   -------------------------------------------------------------------------- */
function kpiGolden(now){
  var mt = tms(S.subject.missingAt);
  if(!mt) return {v:'--:--', u:'', s:'실종시각 미입력', lv:'idle'};
  var passed = now.getTime() - mt;
  var left = GOLDEN_HOURS*3600000 - passed;
  var ph = passed/3600000;
  return {
    /* 큰 숫자가 현재시각과 비슷하게 읽혀 혼동되므로 단위를 붙인다.
       durHM 은 숫자와 콜론만 만들어내므로 그대로 붙여도 안전하다. */
    v: left <= 0 ? '초과' : durHM(left),
    u: left <= 0 ? '' : '남음',
    s: '실종 후 '+durHM(passed)+' 경과 · 기준 '+GOLDEN_HOURS+'h',
    lv: left <= 0 ? 'crit' : (ph < 8 ? 'ok' : (ph < 16 ? 'warn' : 'danger'))
  };
}
function kpiSunset(now){
  var cs = coordinateStatus(), sp = sunPhase(now);
  if(!(cs.ok && sp.times && sp.times.sunset && sp.times.sunrise))
    return {v:'--:--', u:'', s: cs.why || '일출·일몰 계산 불가', lv:'idle'};
  var nightLv = cs.confirmed ? (S.safety.nightApproval?'warn':'danger') : 'idle';
  if(sp.kind === 'beforeSunrise') return {v:'일출 전', u:'', lv:nightLv,
    s:'일출 '+hhmm(sp.times.sunrise)+' · 일몰 '+hhmm(sp.times.sunset)};
  if(sp.kind === 'afterSunset') return {v:'일몰 후', u:'', lv:nightLv,
    s:'일몰 '+hhmm(sp.times.sunset)+(sp.times.dusk?' · 박명종료 '+hhmm(sp.times.dusk):'')};
  var sl = sp.times.sunset.getTime() - now.getTime();
  return { v:durHM(sl), u:'남음',
    s:'일몰 '+hhmm(sp.times.sunset)+(cs.confirmed?'':' · 좌표 확인 필요'),
    lv: cs.confirmed ? (sl<=30*60000?'warn':'ok') : 'idle' };
}
function kpiFlight(now){
  var v = flightVerdict(now);
  var detail=v.why.join(' · ');
  var visible=v.why.slice(0,2).map(function(x){
    return x.length>48?x.slice(0,47)+'…':x;
  }).join(' · ');
  if(v.why.length>2)visible+=' · 외 '+(v.why.length-2)+'건';
  return {v:v.txt, u:'', s:visible, detail:detail, lv:v.lv, dot:true};
}
function kpiElapsed(now){
  var dt = tms(S.mission.dispatchedAt);
  if(!dt) return {v:'--:--', u:'', s:'출동시각 미입력', lv:'idle'};
  return {v:durHM(now.getTime()-dt), u:'경과', s:'출동 '+hhmm(new Date(dt)), lv:'ok'};
}
