name: 버전 자동 증가

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: stayup-dash-version-main
  # cancel-in-progress:false 만으로 대기 1건이 유지된다.
  # 이전에 있던 queue: max 는 GitHub Actions 공식 스키마에 없는 키였고,
  # 지금은 통과하지만 스키마가 엄격해지면 워크플로 전체가 실패할 수 있어 제거했다.
  # 짧은 간격의 연속 푸시에서 중간 푸시가 버전 증가 없이 넘어갈 수 있는데,
  # 버전은 푸시 묶음 단위로 올리는 것이 의도이므로 문제되지 않는다.
  cancel-in-progress: false

jobs:
  version-up:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 소스 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: 증가 종류 결정
        id: bump-type
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          bump_type=patch
          if [[ "$COMMIT_MESSAGE" == *"[주버전]"* ]]; then
            bump_type=major
          elif [[ "$COMMIT_MESSAGE" == *"[부버전]"* ]]; then
            bump_type=minor
          fi
          echo "type=$bump_type" >> "$GITHUB_OUTPUT"

      - name: 앱 버전 증가·검증·푸시
        id: version
        env:
          BASE_SHA: ${{ github.sha }}
          BUMP_TYPE: ${{ steps.bump-type.outputs.type }}
        run: bash scripts/auto-version.sh
