<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>STAY UP 회귀 검사</title>
<!--
  ============================================================================
  STAY UP 회귀 검사
  ----------------------------------------------------------------------------
  로컬 HTTP 로 열어야 합니다. file:// 에서는 iframe 이 교차 출처로 취급돼
  앱 내부 함수에 접근할 수 없습니다.

      python3 -m http.server 8899 --bind 127.0.0.1
      http://127.0.0.1:8899/tests/regression.html

  앱을 iframe 에 띄우고 내부 함수를 직접 호출해 검사합니다. 실제 브라우저에서
  돌아가므로 레이아웃·포인터·저장소까지 함께 확인됩니다.
  ============================================================================
-->
<style>
  body{font:14px/1.5 system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:#0B0E12;color:#E9F0F7;margin:0;padding:20px 24px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:#8FA3B8;font-size:12.5px;margin-bottom:14px}
  #sum{font-weight:800;font-size:15px;padding:10px 14px;border-radius:6px;margin-bottom:12px;
    background:#18212C;border:1px solid #2E3E51}
  #sum.pass{background:#0C2A18;border-color:#22C55E;color:#8BE7B0}
  #sum.fail{background:#2A0B0B;border-color:#EF4444;color:#FFB4B4}
  ol{margin:0;padding-left:26px}
  li{padding:3px 0;border-bottom:1px solid #1A2430}
  li.p::marker{color:#22C55E} li.f::marker{color:#EF4444}
  li.f{color:#FFB4B4}
  .tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 6px;border-radius:3px;margin-right:7px}
  .tag.p{background:#123524;color:#6EE7A0} .tag.f{background:#3A1010;color:#FF8A8A}
  .d{color:#8FA3B8;font-size:12px;margin-left:6px}
  .grp{margin:16px 0 4px;font-weight:800;color:#FF6A1A;font-size:12.5px;letter-spacing:.04em}
  iframe{position:fixed;left:-9999px;top:0;width:1600px;height:900px;border:0}
</style>
</head>
<body>
<h1>STAY UP 회귀 검사</h1>
<div class="sub">앱을 iframe 으로 띄워 내부 함수를 직접 호출합니다. 로컬 HTTP 필요.</div>
<div id="sum">준비 중…</div>
<ol id="out"></ol>
<iframe id="app" src="../stayup-dash.html?regression=1"></iframe>

<script>
"use strict";
var out = document.getElementById('out'), sum = document.getElementById('sum');
var results = [];

function ok(name, cond, detail){
  var pass = !!cond;
  results.push({name:name, pass:pass});
  var li = document.createElement('li');
  li.className = pass ? 'p' : 'f';
  li.innerHTML = '<span class="tag '+(pass?'p':'f')+'">'+(pass?'PASS':'FAIL')+'</span>'
    + name + (detail ? '<span class="d">'+detail+'</span>' : '');
  out.appendChild(li);
}
function group(t){
  var li = document.createElement('div');
  li.className = 'grp'; li.textContent = t; out.appendChild(li);
}
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

var W = null;   /* iframe 의 window */

/* 앱을 초기 상태로 되돌린다. 저장소를 비우고 다시 부팅한다. */
function reload(){
  return new Promise(function(res){
    var f = document.getElementById('app');
    try{
      var w = f.contentWindow;
      for(var i = w.localStorage.length - 1; i >= 0; i--){
        var k = w.localStorage.key(i);
        if(k && k.indexOf('stayup.') === 0) w.localStorage.removeItem(k);
      }
    }catch(e){}
    f.onload = function(){
      W = f.contentWindow;
      W.alert = function(m){ W.__alerts.push(String(m)); };
      W.confirm = function(){ return true; };
      W.__alerts = [];
      W.__dl = []; W.__dlBytes = []; W.__dlText = [];
      W.download = function(n, t){ W.__dl.push(n); W.__dlBytes.push(t ? t.length : 0); W.__dlText.push(t || ''); };
      setTimeout(function(){ res(); }, 350);
    };
    f.src = '../stayup-dash.html?regression=' + Date.now();
  });
}

function cellRect(id){
  var e = W.document.querySelector('#consMap [data-cell="'+id+'"]');
  if(!e) return null;
  var r = e.getBoundingClientRect();
  var fr = document.getElementById('app').getBoundingClientRect();
  return { x: fr.x + r.x + r.width/2, y: fr.y + r.y + r.height/2,
           ix: r.x + r.width/2, iy: r.y + r.height/2 };
}
/* iframe 내부 좌표로 포인터 이벤트를 만든다. elementFromPoint 도 내부 좌표를 쓴다. */
function drag(ids){
  var host = W.document.getElementById('consMap');
  var pts = ids.map(cellRect);
  var P = W.PointerEvent;
  host.dispatchEvent(new P('pointerdown', {bubbles:true, pointerId:1, button:0,
    clientX:pts[0].ix, clientY:pts[0].iy}));
  for(var i=1;i<pts.length;i++)
    host.dispatchEvent(new P('pointermove', {bubbles:true, pointerId:1,
      clientX:pts[i].ix, clientY:pts[i].iy}));
  var L = pts[pts.length-1];
  host.dispatchEvent(new P('pointerup', {bubbles:true, pointerId:1, clientX:L.ix, clientY:L.iy}));
}
function pick(act, v){
  var b = W.document.querySelector('[data-act="'+act+'"][data-v="'+v+'"]');
  if(b) b.click();
  return !!b;
}
function gotoSection(id){
  var b = W.document.querySelector('[data-sec="'+id+'"]');
  if(b) b.click();
}
async function loadMap(w, h, color){
  var cv = W.document.createElement('canvas'); cv.width = w; cv.height = h;
  var cx=cv.getContext('2d');cx.fillStyle=color||'#000';cx.fillRect(0, 0, w, h);
  var blob = await new Promise(function(r){ cv.toBlob(r, 'image/png'); });
  W.fileToMap(new W.File([blob], 'm.png', {type:'image/png'}));
  await wait(2200);
}

async function run(){
  /* ---------------- 저장 · 개인정보 ---------------- */
  await reload();
  group('저장 · 개인정보');

  W.loadSample(); await wait(300);
  ok('샘플 상황이 적재된다', W.S.drones.length === 3 && W.S.crew.length === 6);

  ok('다른 세대(epoch)의 상태는 채택하지 않는다',
    W.adopt({meta:{revision:9999, updated:Date.now()+1e6, epoch:'다른-세대'},
             mission:{title:'되살아난 개인정보'}}, false) === false
    && W.S.mission.title !== '되살아난 개인정보',
    '완전삭제 후 이전 창이 PII 를 되돌리는 경로');

  var badEpoch = (function(){
    var keep = W.SESSION_EPOCH;
    W.SESSION_EPOCH = '없는-세대';           /* 저장이 실패하는 상황 */
    var sent = [];
    var realSend = W.sendPeer;
    W.sendPeer = function(m){ sent.push(m.type); return true; };
    W.commit();
    W.sendPeer = realSend; W.SESSION_EPOCH = keep;
    return sent.indexOf('state') < 0;
  })();
  ok('저장에 실패하면 상대 창으로 내보내지 않는다', badEpoch);

  var durableTitle=W.S.mission.title,realPersist=W.persist,realSend2=W.sendPeer,sentLight=[];
  W.S.mission.title='저장되지 않은 변경';
  W.persist=function(){return false;};
  W.sendPeer=function(m){sentLight.push(m.type);return true;};
  var lightOk=W.commitLight();
  W.persist=realPersist;W.sendPeer=realSend2;
  ok('가벼운 저장도 실패 시 방송하지 않고 마지막 저장 상태로 되돌린다',
    lightOk===false&&W.S.mission.title===durableTitle&&sentLight.indexOf('state')<0);

  var canonical=W.migrate(W.S);canonical.mission.title='공유 저장소 최신 상황';W.touchState(canonical);
  W.localStorage.setItem(W.KEY,W.JSON.stringify(canonical));
  W.S.mission.title='백그라운드 창의 오래된 상황';W.releaseEditorLock();
  var reacquired=W.acquireEditorLock();
  ok('편집권을 다시 얻을 때 공유 저장소 최신 상태를 먼저 채택한다',
    reacquired&&W.S.mission.title==='공유 저장소 최신 상황');

  ok('손상 사본은 하나만 남긴다',
    W.document.documentElement.innerHTML.indexOf('.corrupt.') > 0,
    '구현 존재 확인');

  /* ---------------- 비행 판정 ---------------- */
  await reload();
  group('비행 판정');

  W.loadSample(); await wait(300);
  W.S.safety.agencies = '경찰 드론(서편)'; W.commit();
  ok('인접기관 동시운용은 제한 비행',
    W.flightVerdict(new Date()).why.some(function(x){ return x.indexOf('인접기관') >= 0; }));

  W.S.safety.agencies = '';
  W.S.crew.find(function(c){ return c.name === '홍○○'; }).outAt = W.localDateTime(new Date());
  W.commit();
  ok('비행 중 기체의 조종자 교대 종료는 비행 불가',
    W.flightVerdict(new Date()).lv === 'danger');

  W.S.crew.push({id:W.uid(), name:'홍○○', role:'조종',
    inAt:W.localDateTime(new Date()), outAt:''}); W.commit();
  ok('같은 이름이 재투입되면 정상으로 본다',
    W.flightVerdict(new Date()).lv !== 'danger');

  var flying=W.S.drones.find(function(d){return d.status==='flying';});
  flying.pilot='';W.commit();
  ok('비행 중 조종자 공란은 비행 불가',
    W.flightVerdict(new Date()).lv==='danger'
    && W.flightVerdict(new Date()).why.some(function(x){return x.indexOf('미지정')>=0;}));
  flying.pilot='김○○';W.commit();
  ok('이름이 같아도 관측 역할은 조종자로 인정하지 않는다',W.flightVerdict(new Date()).lv==='danger');
  flying.pilot='명부외';W.commit();
  ok('명부에 없는 비행 중 조종자는 비행 불가',W.flightVerdict(new Date()).lv==='danger');
  var activePilot=W.S.crew.find(function(c){return c.name==='홍○○'&&!c.outAt;});
  flying.pilot='홍○○';activePilot.role='조종';activePilot.inAt=W.localDateTime(new Date(Date.now()+10*60000));W.commit();
  ok('미래에 투입 예정인 조종자는 현행 조종자로 인정하지 않는다',W.flightVerdict(new Date()).lv==='danger');
  activePilot.inAt=W.localDateTime(new Date(Date.now()-60*60000));W.commit();
  flying.pilot='홍○○';flying.status='commloss';W.commit();
  var commVerdict=W.flightVerdict(new Date());
  ok('통신불량은 정상 조종자가 있어도 비행 불가',
    commVerdict.lv==='danger'&&commVerdict.why.some(function(x){return x.indexOf('통신불량')>=0;}));

  /* ---------------- 기상 ---------------- */
  await reload();
  group('기상 확인');

  W.loadSample(); await wait(300);
  W.S.safety.agencies = ''; W.S.safety.windLimit = 12; W.S.safety.gustLimit = 12;
  var base = {confirmed:true, src:'auto', rain:false, wind:4.2, gust:7.8, precip:20};
  var same = Object.assign({}, base);
  ok('값이 그대로면 확인을 유지한다', W.weatherNeedsReconfirm(base, same) === false);
  ok('풍속 1m/s 이상 변하면 재확인',
    W.weatherNeedsReconfirm(base, Object.assign({}, base, {wind:5.4})) === true);
  ok('강수 여부가 바뀌면 재확인',
    W.weatherNeedsReconfirm(base, Object.assign({}, base, {rain:true})) === true);
  ok('한계 80% 구간에 들어가면 재확인',
    W.weatherNeedsReconfirm(base, Object.assign({}, base, {gust:10.2})) === true);
  ok('수동 관측을 자동 모델로 바꾸면 재확인',
    W.weatherNeedsReconfirm(Object.assign({}, base, {src:'manual'}), base) === true);

  W.S.weather.confirmedAt = Date.now() - 31*60000; W.commit();
  ok('확인 후 30분이 지나면 만료된다', W.weatherStatus(new Date()).ok === false);
  W.S.weather.confirmedAt = Date.now() - 29*60000; W.commit();
  ok('29분은 아직 유효하다', W.weatherStatus(new Date()).ok === true);
  W.S.weather.confirmedAt = Date.now() + 6*60000; W.commit();
  ok('현장 기상 확인시각이 미래이면 무효다', W.weatherStatus(new Date()).ok === false);

  var realFetch=W.fetch,resolveWx;
  W.S.weather.src='auto';W.S.weather.auto=true;W.S.weather.confirmed=true;
  W.S.weather.confirmedAt=Date.now();W.S.weather.observedAt=Date.now();W.commit();
  W.fetch=function(){return new Promise(function(resolve){resolveWx=resolve;});};
  W.fetchWeather(false);await wait(80);
  /* iframe 함수의 isPlainObject는 realm까지 확인하므로, 후보 상태도 iframe에서 만든다. */
  var replacement=W.migrate(W.S),rw=replacement.weather;
  rw.auto=false;rw.temp=20;rw.wind=15;rw.gust=16;rw.precip=0;rw.rain=false;
  rw.stamp=W.localDateTime(new Date());rw.observedAt=Date.now();rw.lastAttemptAt=0;rw.error='';rw.src='manual';
  rw.confirmed=true;rw.confirmedAt=Date.now();rw.lat=replacement.mission.lat;rw.lon=replacement.mission.lon;
  var replacementOk=await W.applyStateWithMap(replacement,null);
  resolveWx({ok:true,json:function(){return Promise.resolve({
    current:{temperature_2m:10,wind_speed_10m:2,wind_gusts_10m:3,precipitation:0,time:Math.floor(Date.now()/1000)},
    hourly:{time:[],precipitation_probability:[]}
  });}});
  await wait(180);W.fetch=realFetch;
  ok('상태 교체 전의 늦은 기상 응답이 새 수동 관측을 덮지 않는다',
    W.S.weather.src==='manual'&&W.S.weather.wind===15&&W.S.weather.gust===16,
    'apply '+replacementOk+' / '+W.S.weather.src+' / '+W.S.weather.wind+' / '+W.S.weather.gust
      +' / busy '+W.wxBusy+' / seq '+W.wxRequestSeq+' / '+W.__alerts.slice(-1).join(''));

  /* ---------------- 경보 ---------------- */
  await reload();
  group('발견 경보');

  W.loadSample(); await wait(300);
  W.addEvent('found', '1차 발견', 'C3', true);
  W.S.ui.ackFound = W.foundAlarmKey(W.latestFound()); W.commit();
  ok('확인한 발견은 다시 울리지 않는다',
    W.S.ui.ackFound >= W.foundAlarmKey(W.latestFound()));

  W.addEvent('found', '소급 입력한 발견', 'E4', true, Date.now() - 5*3600000);
  W.commit();
  ok('과거 시각으로 소급 입력한 발견도 경보 대상이 된다',
    W.S.ui.ackFound < W.foundAlarmKey(W.latestFound()),
    '기록시각 기준 선택');

  var g = W.getComputedStyle;
  var mk = function(cls){
    var i = W.document.createElement('i'); i.className = 'dot ' + cls;
    W.document.body.appendChild(i);
    var s = g(i); var v = s.borderRadius + '|' + s.clipPath + '|' + s.borderTopWidth;
    i.remove(); return v;
  };
  var shapes = [mk('ok'), mk('warn'), mk('danger'), mk('idle')];
  ok('비행 판정 표시가 색 말고 형태로도 구분된다',
    new Set(shapes).size === 4, shapes.join('  ·  '));

  /* ---------------- 수색격자 ---------------- */
  await reload();
  group('수색격자');

  W.loadSample(); await wait(300);
  await loadMap(1600, 900);
  ok('지도가 적재된다', W.S.grid.hasMap && W.S.grid.mapW === 1600);

  var mapBeforeSample = W.MAPDATA;
  W.loadSample(); await wait(300);
  ok('지도 적용 후 샘플을 넣어도 이미지 좌표계가 유지된다',
    W.S.grid.hasMap && W.MAPDATA === mapBeforeSample
    && W.S.grid.mapW === 1600 && W.S.grid.mapH === 900,
    W.S.grid.mapW + '×' + W.S.grid.mapH);

  gotoSection('sec-grid'); await wait(300);
  var host = W.document.getElementById('consMap');
  var fit = host.querySelector('.mapfit').getBoundingClientRect();
  var hostR = host.getBoundingClientRect();
  ok('격자가 지도 이미지 종횡비에 고정된다',
    Math.abs(fit.width/fit.height - 1600/900) < 0.02,
    '컨테이너 ' + (hostR.width/hostR.height).toFixed(3)
      + ' → 상자 ' + (fit.width/fit.height).toFixed(3));

  ok('칠하기 팔레트가 있다',
    W.document.querySelectorAll('[data-act="paints"]').length === 5      /* 그대로 + 상태 4 */
    && W.document.querySelectorAll('[data-act="paintby"]').length === 6  /* 그대로 + 담당 5 */
    && W.document.querySelectorAll('.pb.keep').length === 2);

  var e0 = W.S.events.length;
  pick('paints', '2'); pick('paintby', '지상');
  drag(['A5','A6','B6']); await wait(400);
  ok('쓸어내리면 여러 칸이 한 번에 바뀐다',
    W.S.grid.cells.A5 && W.S.grid.cells.A5.s === 2
    && W.S.grid.cells.A6.by === '지상' && W.S.grid.cells.B6.s === 2);
  ok('한 번의 쓸기는 기록 한 줄만 남긴다', (W.S.events.length - e0) === 1);
  ok('방금 칠한 칸이 빠른기록 구역에 채워진다',
    W.document.getElementById('evZone').value === 'A5');

  var e1 = W.S.events.length;
  pick('paints', '2'); drag(['A5','A6','B6']); await wait(400);
  ok('이미 완료인 칸을 다시 칠해도 기록이 늘지 않는다', W.S.events.length === e1);

  pick('paints', ''); pick('paintby', '수색견'); drag(['A5']); await wait(400);
  ok('그대로 를 고르면 그 항목은 건드리지 않는다',
    W.S.grid.cells.A5.s === 2 && W.S.grid.cells.A5.by === '수색견');

  /* --- 직전 쓸기 되돌리기 --- */
  function cellsSig(){
    var c = W.S.grid.cells;
    return Object.keys(c).sort().map(function(k){
      return k + ':' + (c[k].s|0) + ':' + (c[k].by||''); }).join(',');
  }
  var sigBefore = cellsSig();
  pick('paints', '2'); pick('paintby', '드론');
  drag(['C6','D6','E6']); await wait(400);
  var painted = !!(W.S.grid.cells.C6 && W.S.grid.cells.C6.s === 2
    && W.S.grid.cells.E6.by === '드론');
  var zoneEvId = W.S.events[W.S.events.length-1].id;
  var savedSweep=W.lastSweep,realPersistSweep=W.persist;
  W.S.mission.title='저장 실패로 되돌릴 임시 제목';W.persist=function(){return false;};
  var unrelatedCommit=W.commit();W.persist=realPersistSweep;
  ok('다른 입력 저장 실패가 정상 저장된 직전 쓸기 되돌리기를 지우지 않는다',
    unrelatedCommit===false&&W.lastSweep===savedSweep);
  W.undoSweep(); await wait(300);
  ok('되돌리기가 칸을 쓸기 전 상태로 복원한다',
    painted && cellsSig() === sigBefore, '3칸');
  ok('원래 없던 칸은 없던 대로 되돌린다', !W.S.grid.cells.C6);

  var voided = W.S.events.filter(function(e){ return e.id === zoneEvId; })[0];
  ok('되돌리면 완료 기록을 지우지 않고 무효 처리한다',
    !!voided && voided.voided === true && voided.voidReason === '쓸기 취소');
  ok('되돌린 사실이 정정 이력으로 남는다',
    W.S.events[W.S.events.length-1].type === 'correction');
  ok('되돌린 뒤에는 되돌릴 것이 없다', W.undoSweep() === false);

  pick('paints', '2'); drag(['C6','D6']); await wait(400);
  W.document.dispatchEvent(new W.KeyboardEvent('keydown',
    {key:'z', ctrlKey:true, bubbles:true}));
  await wait(300);
  ok('Ctrl+Z 로도 되돌린다', cellsSig() === sigBefore);

  var cellStyles = ['s0','s1','s2','s3'].map(function(c){
    var d = W.document.createElement('div'); d.className = 'gcell ' + c;

  var keptId = W.S.grid.mapId;
  W.saveRecoveryPoint('저장소 검사');
  W.gcMapBlobs(); await wait(600);
  ok('복구본이 참조하는 지도는 남긴다', !!(await W.mapBlobGet(keptId)));

  W.releaseEditorLock();
  var liveMapId=W.S.grid.mapId;W.S.grid.mapId='stale-display-map';
  await W.gcMapBlobs();
  W.S.grid.mapId=liveMapId;W.acquireEditorLock();
  ok('편집권 없는 오래된 창의 정리 요청은 최신 지도를 지우지 않는다',!!(await W.mapBlobGet(liveMapId)));

  /* 폴백 — IndexedDB 가 막힌 환경에서 종전 동작으로 되돌아가야 한다 */
  W.idbBroken = true; W.idbDB = null;
  ok('폴백 시 한도가 종전 값으로 돌아간다',
    W.mapCharCap() === W.MAX_MAP_CHARS_LS && W.mapPxCap() === W.MAP_MAX_PX_LS,
    Math.round(W.MAX_MAP_CHARS_LS/1048576) + 'MB / ' + W.MAP_MAX_PX_LS + 'px');
  ok('폴백 시 저장소 표시가 바뀐다', W.mapStoreLabel().indexOf('localStorage') === 0);
  await W.mapBlobPut('fallback-test', 'data:image/jpeg;base64,BBBB');
  ok('폴백 경로는 localStorage 에 쓴다',
    W.localStorage.getItem(W.MAP_PREFIX + 'fallback-test') === 'data:image/jpeg;base64,BBBB');
  W.localStorage.removeItem(W.MAP_PREFIX + 'fallback-test');

  /* 구버전이 localStorage 에 남긴 지도는 읽으면서 옮긴다 */
  W.idbBroken = false; W.idbDB = null;
  var legacy = 'data:image/jpeg;base64,CCCC';
  W.localStorage.setItem(W.MAP_PREFIX + 'legacy-test', legacy);
  ok('구버전 localStorage 지도를 읽는다', (await W.mapBlobGet('legacy-test')) === legacy);
  await wait(500);
  ok('읽으면서 IndexedDB 로 옮긴다',
    W.localStorage.getItem(W.MAP_PREFIX + 'legacy-test') === null
    && (await W.mapBlobGet('legacy-test')) === legacy);
  await W.mapBlobDel('legacy-test');

  /* 블롭이 사라진 경우 — 상태를 바로잡고 상대 창에도 알려야 한다 */
  W.idbBroken = false; W.idbDB = null;
  await loadMap(1600, 900);
  W.acquireEditorLock();
  W.S.grid.geo = {west:127.1950, east:127.2450, north:35.9025, south:35.8775,
                  src:'manual', at:Date.now()};
  W.commit(); await wait(200);
  var lostId = W.S.grid.mapId, verBefore = W.S.grid.mapVer, natBefore = W.S.grid.mapNatW;
  await W.mapBlobDel(lostId);          /* 블롭만 지운다. 상태는 아직 지도가 있다고 본다 */
  var sent = [];
  var realSend = W.sendPeer;
  W.sendPeer = function(m){ sent.push(m.type + (m.type==='map' ? (m.data===null?':null':':data') : '')); return true; };
  W.mapVerLoaded = -1;                  /* 다시 읽게 만든다 */
  W.readMapFromStore();
  await wait(800);
  W.sendPeer = realSend;
  ok('블롭이 사라지면 상태를 바로잡는다',
    W.S.grid.hasMap === false && W.S.grid.mapId === null && W.MAPDATA === null);
  ok('판 번호를 올려 폴링 창도 따라오게 한다', W.S.grid.mapVer > verBefore,
    verBefore + ' → ' + W.S.grid.mapVer);
  ok('상대 창에 지도 제거를 알린다', sent.indexOf('map:null') >= 0, sent.join(' '));
  ok('좌표 보정과 원본 크기는 남긴다', W.geoOK() === true && W.S.grid.mapNatW === natBefore);

  /* 읽기 실패(일시적)와 블롭 소실은 다르게 다뤄야 한다 */
  await loadMap(1600, 900);
  var keepId = W.S.grid.mapId,realMapGet=W.mapBlobGet,mapGetCalls=0;
  W.mapBlobGet=function(id){
    mapGetCalls++;
    if(mapGetCalls===1){W.idbBroken=true;W.idbDB=null;return Promise.reject(new Error('일시 읽기 실패'));}
    return realMapGet(id);
  };
  W.mapRetryDelay=50;W.mapRetryAt=0;W.mapVerLoaded=-1;W.readMapFromStore();
  await wait(120);
  ok('저장소를 못 읽으면 상태를 건드리지 않는다',
    W.S.grid.hasMap === true && W.S.grid.mapId === keepId);
  W.pollStore();await wait(700);W.mapBlobGet=realMapGet;
  ok('일시적 저장소 오류 뒤 자동으로 다시 열어 지도를 복구한다',
    mapGetCalls>=2&&typeof W.MAPDATA==='string'&&W.mapIdLoaded===keepId);

  /* 덮어쓴 최신 파일 하나만 있어도 지도까지 복원 가능해야 한다 */
  W.autoSaveHandle = null; W.autoSaveAt = 0; W.lastAutoSavedRev = -1; W.autoSavedMapVer = -1;
  W.__dl = []; W.__dlBytes = []; W.__dlText = [];
  W.acquireEditorLock();
  W.autoSaveTick();
  W.S.mission.title = W.S.mission.title + ' 변경'; W.commit();
  W.autoSaveAt = 0;
  W.autoSaveTick();
  var autoPackages=W.__dlText.map(function(t){try{return JSON.parse(t);}catch(e){return {};}});
  ok('자동 보관의 최신 파일도 지도 본체를 포함한다',
    autoPackages.length===2&&autoPackages.every(function(p){return typeof p.map==='string'&&p.map.indexOf('data:image/')===0;}),
    Math.round(W.__dlBytes[0]/1024) + 'KB → ' + Math.round(W.__dlBytes[1]/1024) + 'KB');
  ok('수동 내보내기는 항상 지도를 포함한다',
    W.exportPayload(true).length > W.exportPayload(false).length * 2);
  var loadedIdentity=W.mapIdLoaded,downloadsBeforeMismatch=W.__dl.length;
  W.mapIdLoaded='이전-지도';
  var mismatchedExport=W.exportJson();W.mapIdLoaded=loadedIdentity;
  ok('상태의 mapId와 실제 적재 지도가 다르면 내보내기를 중단한다',
    mismatchedExport===false&&W.__dl.length===downloadsBeforeMismatch);

  var incomplete=W.JSON.parse(W.exportPayload(false)),incompleteRejected=false;
  try{W.validateImportPackage(incomplete);}catch(e){incompleteRejected=true;}
  ok('지도 참조만 있고 본체가 없는 JSON은 가져오기를 거부한다',incompleteRejected);
  var beforeBrokenMapId=W.S.grid.mapId;
  var brokenMapOk=await W.applyStateWithMap(W.migrate(W.S),'data:image/png;base64,AAAA');
  ok('형식만 data URL인 손상 지도는 실제 해독 뒤 거부한다',
    brokenMapOk===false&&W.S.grid.mapId===beforeBrokenMapId);

  var recoveryTitle=W.S.mission.title,recoveryMapId=W.S.grid.mapId;
  W.saveRecoveryPoint('IDB 지도 복구 검사');
  W.S.mission.title='복구 뒤 사라져야 할 변경';W.commit();W.MAPDATA=null;
  await W.restoreRecovery();await wait(250);
  ok('직전 복구점이 IndexedDB 지도와 상태를 함께 되살린다',
    W.S.mission.title===recoveryTitle&&W.S.grid.hasMap&&W.S.grid.mapId!==recoveryMapId
    &&typeof W.MAPDATA==='string'&&W.MAPDATA.indexOf('data:image/')===0);

  var purgeMapId=W.S.grid.mapId,realLatePut=W.mapBlobPut,resolveLatePut;
  W.mapBlobPut=function(){return new Promise(function(resolve){resolveLatePut=resolve;});};
  var staleState=W.migrate(W.S);staleState.mission.title='삭제 뒤 되살아나면 안 되는 상태';
  var staleApply=W.applyStateWithMap(staleState,W.MAPDATA);
  for(var lateWait=0;lateWait<20&&!resolveLatePut;lateWait++)await wait(25);
  W.mapBlobPut=realLatePut;
  var realClear=W.mapBlobClear,resolveClear;
  W.mapBlobClear=function(){return new Promise(function(resolve,reject){
    resolveClear=function(){realClear().then(resolve,reject);};
  });};
  W.prompt=function(){return '완전삭제';};
  var purgePromise=W.purgeIncidentData();await wait(80);
  var blockedDuringPurge=W.acquireEditorLock()===false&&W.localStorage.getItem(W.KEY)===null;
  resolveLatePut();var staleOk=await staleApply;
  resolveClear();var purgeOk=await purgePromise;W.mapBlobClear=realClear;
  ok('완전삭제는 IndexedDB 지도까지 비운다',
    purgeOk===true&&W.S.grid.hasMap===false&&!(await W.mapBlobGet(purgeMapId)));
  ok('완전삭제 진행 중에는 다른 편집권을 막고 완료 뒤에만 다시 연다',
    blockedDuringPurge&&W.ownsEditorLock()&&!W.purgeBarrierActive());
  ok('완전삭제 전에 시작한 늦은 지도·상태 작업이 삭제 내용을 되살리지 않는다',
    staleOk===false&&W.S.mission.title===''&&W.localStorage.getItem(W.KEY)===null);

  /* ---------------- 복구점 ---------------- */
  await reload();
  group('복구점');

  W.loadSample(); await wait(300);
  var realSave = W.saveRecoveryPoint;
  W.saveRecoveryPoint = function(){ return false; };   /* 저장공간 부족 상황 */
  var before = W.S.mission.title;
  W.document.querySelector('[data-act="sample"]').click(); await wait(300);
  ok('복구점을 만들지 못하면 샘플 적용을 중단한다',
    W.S.mission.title === before && W.__alerts.some(function(m){
      return m.indexOf('복구본') >= 0; }));
  W.saveRecoveryPoint = realSave;

  var pointState=W.migrate(W.S),autoState=W.migrate(W.S),nowRecovery=Date.now();
  pointState.mission.title='작업 직전 복구점';autoState.mission.title='더 최근 자동 복구본';
  W.localStorage.setItem(W.RECOVERY_KEY,W.JSON.stringify({t:nowRecovery-1000,reason:'가져오기 전',state:pointState,map:null}));
  W.localStorage.setItem(W.SNAPKEY,W.JSON.stringify([{t:nowRecovery,reason:'자동',state:autoState}]));
  W.renderConsole(W.document.getElementById('consoleRoot'));
  var recoveryChoices=W.recoveryCandidates(),autoChoice=recoveryChoices.filter(function(c){return c.kind==='자동';})[0];
  ok('작업 직전과 자동 복구본을 화면에서 함께 선택할 수 있다',
    recoveryChoices.length===2&&W.document.querySelectorAll('#recoveryPick option').length===2&&!!autoChoice);
  await W.restoreRecovery(autoChoice.key);await wait(250);
  ok('선택한 자동 복구본을 실제로 복구한다',W.S.mission.title==='더 최근 자동 복구본');

  var pointA=W.migrate(W.S),pointB=W.migrate(W.S),staleBase=Date.now()+1000;
  pointA.meta.updated=staleBase;pointA.mission.title='화면에 보였던 복구점';
  pointB.meta.updated=staleBase+1;pointB.mission.title='뒤늦게 교체된 복구점';
  W.localStorage.setItem(W.RECOVERY_KEY,W.JSON.stringify({t:staleBase,reason:'A',state:pointA,map:null}));
  var stalePointKey=W.recoveryCandidates().filter(function(c){return c.kind==='작업 전';})[0].key;
  W.localStorage.setItem(W.RECOVERY_KEY,W.JSON.stringify({t:staleBase+1,reason:'B',state:pointB,map:null}));
  var titleBeforeStaleChoice=W.S.mission.title,alertsBeforeStaleChoice=W.__alerts.length;
  await W.restoreRecovery(stalePointKey);await wait(50);
  ok('화면을 그린 뒤 교체된 작업 복구점을 잘못 적용하지 않는다',
    W.S.mission.title===titleBeforeStaleChoice&&W.__alerts.slice(alertsBeforeStaleChoice).some(function(m){
      return m.indexOf('더 이상 없습니다')>=0;
    }));

  var cvRecovery=W.document.createElement('canvas');cvRecovery.width=2;cvRecovery.height=2;
  cvRecovery.getContext('2d').fillRect(0,0,2,2);var oldestMap=cvRecovery.toDataURL('image/png');
  var oldestMapId='oldest-recovery-map',oldestBase=Date.now()+2000,snapshots=[];
  for(var ri=0;ri<5;ri++){
    var rs=W.defaultState();rs.meta.epoch=W.SESSION_EPOCH;rs.meta.updated=oldestBase+ri;
    rs.mission.title=ri===0?'가장 오래된 지도 복구본':'자동 복구본 '+ri;
    if(ri===0){rs.grid.hasMap=true;rs.grid.mapId=oldestMapId;rs.grid.mapW=2;rs.grid.mapH=2;rs.grid.mapKB=1;rs.grid.mapNatW=2;rs.grid.mapNatH=2;}
    snapshots.push({t:oldestBase+ri,reason:ri===0?'가장 오래된 지도':'자동',state:rs});
  }
  var liveBeforeOldest=W.defaultState();liveBeforeOldest.meta.epoch=W.SESSION_EPOCH;
  liveBeforeOldest.mission.title='복구 적용 전 현재 상태';W.S=liveBeforeOldest;W.touch();W.persist();
  W.MAPDATA=null;W.mapIdLoaded=null;W.mapVerLoaded=-1;W.lastSnapshotUpdated=-1;
  W.localStorage.removeItem(W.RECOVERY_KEY);W.localStorage.setItem(W.SNAPKEY,W.JSON.stringify(snapshots));
  W.idbBroken=true;W.idbDB=null;W.localStorage.setItem(W.MAP_PREFIX+oldestMapId,oldestMap);
  var oldestChoice=W.recoveryCandidates().filter(function(c){return c.reason==='가장 오래된 지도';})[0];
  var restoredOldest=await W.restoreRecovery(oldestChoice.key);await wait(350);
  ok('5개 중 가장 오래된 지도 복구본도 GC에 잃지 않고 복구한다',
    restoredOldest===true&&W.S.mission.title==='가장 오래된 지도 복구본'
    &&W.S.grid.hasMap&&typeof W.MAPDATA==='string'
    &&W.getSnapshots().some(function(x){return x.reason==='복구 적용 전'&&x.state.mission.title==='복구 적용 전 현재 상태';}));

  /* ---------------- 마무리 ---------------- */
  var pass = results.filter(function(r){ return r.pass; }).length;
  var fail = results.length - pass;
  sum.className = fail ? 'fail' : 'pass';
  sum.textContent = fail
    ? (fail + '건 실패 / 전체 ' + results.length + '건')
    : ('전체 ' + results.length + '건 통과');
  window.__REGRESSION__ = {total:results.length, pass:pass, fail:fail,
    failed:results.filter(function(r){ return !r.pass; }).map(function(r){ return r.name; })};
}

run().catch(function(e){
  sum.className = 'fail';
  sum.textContent = '검사 중 오류: ' + (e && e.message ? e.message : e);
  window.__REGRESSION__ = {error:String(e && e.stack || e)};
});
</script>
</body>
</html>
